  if (e.target.closest("[data-cat-clear]")) { movCat = null; repaintView("movimentos"); return; }

  const cat = e.target.closest("[data-cat]");
  if (cat) {
    movCat = cat.dataset.cat === "Sem categoria" ? null : cat.dataset.cat;
    movTipo = "Todos";
    gotoView("contas", "movimentos"); repaintView("movimentos");
    window.scrollTo({ top: 0 }); return;
  }
  const tgo = e.target.closest("[data-tipo-goto]");
  if (tgo) {
    movTipo = tgo.dataset.tipoGoto; movCat = null;
    gotoView("contas", "movimentos"); repaintView("movimentos");
    window.scrollTo({ top: 0 }); return;
  }
});

/* ---------------- Pesquisa global ---------------- */
const searchOverlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

function openSearch() {
  searchOverlay.hidden = false;
  searchInput.value = "";
  renderSearch("");
  searchInput.focus();
  ensureGroupLoaded("viaturas").then(() => { if (!searchOverlay.hidden) renderSearch(searchInput.value); });
}
function closeSearch() { searchOverlay.hidden = true; }

/* comparação sem acentos: "claudio" encontra "Claúdio".
   NFD separa a letra do acento; descartam-se as marcas combinatórias
   (U+0300–U+036F) sem escrever caracteres invisíveis no código. */
function deaccent(s) {
  let out = "";
  for (const ch of String(s || "").normalize("NFD")) {
    const c = ch.codePointAt(0);
    if (c < 0x300 || c > 0x36f) out += ch;
  }
  return out.toLowerCase();
}

function renderSearch(q) {
  const term = deaccent(q.trim());
  if (!term) {
    searchResults.innerHTML = `<div class="state"><div class="icon">🔎</div>
      <h3>Procurar</h3><p>Escreve um código de viagem (VF50), uma matrícula, um motorista ou um cliente.</p></div>`;
    return;
  }
  const has = s => deaccent(s).includes(term);
  const out = [];

  const td = tripsData();
  if (td) {
    for (const t of td.trips) {
      if (has(t.cod) || has(t.cliente) || has(t.motorista) || has(t.viatura) || has(t.rota)) {
        out.push({ kind: "Viagem", title: t.cod || "(sem código)",
          sub: [t.dataTxt, t.cliente, t.motorista, t.viatura].filter(Boolean).join(" · "),
          act: () => { viagemNav.mode = "detalhe"; viagemNav.sel = t.cod;
                       gotoView("viagens", "viagens"); repaintViagens(); } });
      }
      if (out.length > 40) break;
    }
    for (const key of ["motorista", "cliente"]) {
      for (const e of entityStats(td.trips, key)) {
        if (!has(e.nome)) continue;
        out.push({ kind: key === "motorista" ? "Motorista" : "Cliente", title: e.nome,
          sub: `${e.trips.length} viage${e.trips.length === 1 ? "m" : "ns"}`,
          act: () => openEntity(key, e.nome) });
      }
    }
  }
  const vt = extractViaturas(state.data["Viaturas"]);
  if (vt) {
    for (const v of vt.items) {
      if (!has(v.mat)) continue;
      out.push({ kind: "Viatura", title: v.mat,
        sub: v.consumoSeco != null ? `Consumo esperado ${fmtNumRaw(String(v.consumoSeco))} l/100km` : "",
        act: () => openEntity("viatura", v.mat) });
    }
  }

  if (!out.length) {
    searchResults.innerHTML = `<div class="state"><div class="icon">🤔</div>
      <h3>Nada encontrado</h3><p>Não há resultados para «${esc(q)}».</p></div>`;
    return;
  }
  searchActions = out.slice(0, 40);
  searchResults.innerHTML = `<div class="card">` + searchActions.map((r, i) => `
    <div class="sr-item" data-sr="${i}">
      <span class="sr-kind">${esc(r.kind)}</span>
      <div class="sr-main">
        <div class="sr-title">${esc(r.title)}</div>
        ${r.sub ? `<div class="sr-sub">${esc(r.sub)}</div>` : ""}
      </div>
      <span style="color:var(--ink-muted)">›</span>
    </div>`).join("") + `</div>`;
}
let searchActions = [];

document.getElementById("searchBtn").addEventListener("click", openSearch);
document.getElementById("searchClose").addEventListener("click", closeSearch);
searchInput.addEventListener("input", () => renderSearch(searchInput.value));
searchResults.addEventListener("click", e => {
  const item = e.target.closest("[data-sr]");
  if (!item) return;
  const r = searchActions[+item.dataset.sr];
  closeSearch();
  if (r) { r.act(); window.scrollTo({ top: 0 }); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !searchOverlay.hidden) closeSearch();
});

/* abre a ficha de um motorista / cliente / viatura */
function openEntity(key, nome) {
  entityNav[key] = nome;
  const target = key === "viatura" ? ["viaturas", "viaturas"]
    : key === "cliente" ? ["viagens", "clientes"] : ["viagens", "motoristas"];
  ensureGroupLoaded(target[0]);
  gotoView(target[0], target[1]);
  repaintView(target[1]);
  window.scrollTo({ top: 0 });
}

function paint(view) {
  const panel = document.getElementById("view-" + view.id);
  if (!panel) return;
  const rows = state.data[view.sheet];
  try {
    panel.innerHTML = (RENDERERS[view.render] || renderAuto)(rows);
  } catch (err) {
    console.error("render", view.id, err);
    // nunca deixar um separador em branco
    panel.innerHTML = rows ? renderAuto(rows) : emptyState("Sem dados para mostrar.");
  }
}

function setUpdated() {
  const metas = Object.values(state.meta);
  if (!metas.length) { updatedEl.textContent = ""; return; }
  const anyCache = metas.some(m => m.fromCache);
  const t = new Date(Math.min(...metas.map(m => m.time)));
  const stamp = t.toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit" }) +
    " " + t.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });
  updatedEl.innerHTML = anyCache
    ? `<span class="stale">Sem ligação — a mostrar dados guardados de ${stamp}</span>`
    : `Atualizado em ${stamp}`;
}

/* Carrega um conjunto de folhas (uma vez cada) e guarda-as no estado.
   Só se carrega o que a área aberta precisa — a app arranca mais depressa. */
async function loadSheets(sheetNames, force) {
  const todo = [...new Set(sheetNames)].filter(s => s && (force || !state.data[s]));
  if (!todo.length) return;
  const results = await Promise.all(todo.map(sheet =>
    loadSheet(sheet, force).then(r => ({ sheet, ...r })).catch(err => ({ sheet, err }))));
  for (const r of results) {
    if (r.err) {
      console.error("load", r.sheet, r.err);
      delete state.meta[r.sheet];
      state.errors[r.sheet] = true;
    } else {
      state.data[r.sheet] = r.rows;
      state.meta[r.sheet] = { fromCache: r.fromCache, time: r.time };
      delete state.errors[r.sheet];
    }
  }
}
/* Uma vista só está disponível se a folha carregada tiver a assinatura
   esperada no cabeçalho. Assim, uma folha apagada ou reestruturada faz
   desaparecer o sub-separador em vez de mostrar os dados de outra folha
   (o Google devolve a 1.ª folha do ficheiro quando o nome não existe). */
function viewAvailable(v) {
  const rows = state.data[v.sheet];
  if (!rows || !v.expect) return true;   // ainda não carregou, ou sem assinatura
  return rows.slice(0, 12).some(r => r.some(c => v.expect.test(String(c || "").trim())));
}

/* mostra/esconde os sub-separadores conforme as folhas existentes */
function refreshSubtabs(groupId) {
  const g = NAV.find(x => x.id === groupId);
  if (!g || g.views.length < 2) return;
  const bar = document.querySelector(`.subtabs[data-group="${groupId}"]`);
  const disponiveis = g.views.filter(viewAvailable);
  if (bar) {
    bar.querySelectorAll("button[data-view]").forEach(b => {
      b.hidden = !disponiveis.some(v => v.id === b.dataset.view);
    });
    bar.hidden = disponiveis.length < 2;
  }
  /* se a vista aberta deixou de existir, abre a primeira disponível */
  if (disponiveis.length && !disponiveis.some(v => v.id === state.activeView[groupId])) {
    state.activeView[groupId] = disponiveis[0].id;
  }
  g.views.forEach(v => {
    const el = document.getElementById("view-" + v.id);
    if (el) el.style.display = v.id === state.activeView[groupId] ? "" : "none";
  });
  if (bar) bar.querySelectorAll("button[data-view]").forEach(b =>
    b.classList.toggle("on", b.dataset.view === state.activeView[groupId]));
}

/* pinta pela ordem de ALL_VIEWS → cores dos sócios estáveis entre visitas */
function paintViewsFor(sheetNames) {
  const set = new Set(sheetNames);
  for (const view of ALL_VIEWS) {
    if (!set.has(view.sheet)) continue;
    const el = document.getElementById("view-" + view.id);
    if (!el) continue;
    if (state.errors[view.sheet]) el.innerHTML = errorState(view.id);
    else if (state.data[view.sheet] && viewAvailable(view)) paint(view);
  }
  NAV.forEach(g => refreshSubtabs(g.id));
}

async function ensureGroupLoaded(groupId, force) {
  const g = NAV.find(x => x.id === groupId);
  if (!g || g.soon) return;
  const sheets = groupSheets(g);
  if (!sheets.some(s => force || !state.data[s])) return;
  await loadSheets(sheets, force);
  paintViewsFor(sheets);
  setUpdated();
}

async function refreshAll(force) {
  refreshBtn.classList.add("spinning");
  const g = NAV.find(x => x.id === state.activeGroup);
  const sheets = [...new Set([
    ...RESUMO_SHEETS,                 // o dashboard cruza várias folhas
    ...(g ? groupSheets(g) : []),     // a área aberta
    ...Object.keys(state.data),       // e tudo o que já tinha sido carregado
  ])];
  await loadSheets(sheets, force);
  paintViewsFor(sheets);
  setUpdated();
  refreshBtn.classList.remove("spinning");
}

refreshBtn.addEventListener("click", () => refreshAll(true));
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refreshAll(false); // reabrir a app → dados frescos
});

/* app instalável e a abrir offline */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

refreshAll(false);
</script>
