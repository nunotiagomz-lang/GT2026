function renderViagens() {
  const td = tripsData();
  if (!td || !td.trips.length) {
    viagemNav.mode = "lista";
    return emptyState("Ainda não há viagens registadas.",
      "As viagens que registares na folha 'Viagens' do Excel aparecem aqui automaticamente.");
  }
  if (viagemNav.mode !== "lista" && !td.trips.find(t => t.cod === viagemNav.sel)) {
    viagemNav.mode = "lista";
  }
  if (viagemNav.mode === "detalhe") return viagemDetalheHTML(td);
  if (viagemNav.mode === "abast") return abastHTML(td);

  const keyCols = [];
  for (const alternativas of VG_PRIOR) {
    if (/data|partida/i.test(alternativas[0].source)) continue; // a data já vai no topo
    let c = null;
    for (const re of alternativas) {
      c = td.cols.find(c => re.test(c.name) && !keyCols.includes(c));
      if (c) break;
    }
    if (c) keyCols.push(c);
    if (keyCols.length >= 4) break;
  }

  const shown = tripsInPeriod(td);
  if (!shown.length) {
    return periodBar() + emptyState("Sem viagens neste período.",
      "Escolhe outro período em cima para veres mais viagens.");
  }
  const receita = shown.reduce((a, t) => a + (t.receita || 0), 0);
  const despesa = shown.reduce((a, t) => a + (t.despesa || 0), 0);
  const margem = td.hasReceita ? receita - despesa : null;
  const pendente = shown.reduce((a, t) => a + (t.pendente || 0), 0);
  const porReceber = shown.filter(t => t.pendente > 0.5).length;
  const recPend = shown.flatMap(t => t.recibosPendentes || []);
  const caixa = (rot, val, cor, sub) => `<div style="min-width:0"><div style="font-size:11.5px;color:var(--ink-2)">${rot}</div>
    <b style="font-size:16px;${cor ? `color:${cor}` : ""}">${val}</b>${sub ? `<div style="font-size:11px;color:var(--ink-muted)">${sub}</div>` : ""}</div>`;

  return periodBar() +
    `<div class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px">
      ${caixa("Viagens", shown.length)}
      ${margem != null ? caixa("Margem", fmtMZN(margem) + ' <small style="font-size:11px;color:var(--ink-muted)">MZN</small>', margem >= 0 ? "var(--good-text)" : "var(--serious)")
        : despesa ? caixa("Custos", fmtMZN(despesa) + ' <small style="font-size:11px;color:var(--ink-muted)">MZN</small>') : ""}
      ${porReceber ? caixa("Por receber", fmtMZN(pendente) + ' <small style="font-size:11px;color:var(--ink-muted)">MZN</small>', "var(--serious)", `${porReceber} viage${porReceber > 1 ? "ns" : "m"}`) : ""}
      ${recPend.length ? caixa("Recibos por entregar", recPend.length, "var(--warning)", fmtMZN(recPend.reduce((a, m) => a + m.valor, 0)) + " MZN") : ""}
    </div>
    <div class="card">${shown.map(t => tripRowHTML(t, keyCols)).join("")}</div>`;
}

/* ---------- fichas: motoristas, clientes, viaturas ---------- */
const entityNav = { motorista: null, cliente: null, viatura: null };

function entityListHTML(key, titleSing, emptyMsg) {
  const td = tripsData();
  if (!td || !td.trips.length) return emptyState(emptyMsg);
  const shown = tripsInPeriod(td);
  const ents = entityStats(shown, key);
  if (!ents.length) return periodBar() + emptyState(`Sem ${titleSing}s neste período.`);
  return periodBar() + `<div class="card">` + ents.map(e => {
    const margem = td.hasReceita ? e.receita - e.despesa : null;
    return `<div class="mov" data-entity="${esc(key)}" data-entity-name="${esc(e.nome)}" style="cursor:pointer;align-items:center">
      <div class="m-main">
        <div style="font-size:14px;font-weight:650">${esc(e.nome)}</div>
        <div style="font-size:12px;color:var(--ink-2);margin-top:3px">
          ${e.trips.length} viage${e.trips.length === 1 ? "m" : "ns"}${e.km ? ` · ${fmtMZN(e.km)} km` : ""}
        </div>
      </div>
      <div class="m-side">
        ${margem != null ? `<div class="m-val" style="font-size:13px;color:${margem >= 0 ? "var(--good-text)" : "var(--serious)"}">${fmtMZN(margem)}</div>`
                         : (e.despesa ? `<div class="m-val" style="font-size:13px">${fmtMZN(e.despesa)}</div>` : "")}
        <div style="color:var(--ink-muted);font-size:18px">›</div>
      </div>
    </div>`;
  }).join("") + `</div>`;
}

function entityDetailHTML(key, nome, backAttr) {
  const td = tripsData();
  const all = td ? td.trips.filter(t => (t[key] || "").trim() === nome) : [];
  const shown = all.filter(t => inPeriod(t.date, state.period));
  const receita = shown.reduce((a, t) => a + (t.receita || 0), 0);
  const despesa = shown.reduce((a, t) => a + (t.despesa || 0), 0);
  const km = shown.reduce((a, t) => a + (t.km || 0), 0);
  const margem = td && td.hasReceita ? receita - despesa : null;
  /* saldo do motorista: último valor conhecido nas viagens dele */
  const saldos = shown.map(t => t.saldoMot).filter(v => v != null);
  const saldo = key === "motorista" && saldos.length ? saldos[saldos.length - 1] : null;

  const vinfo = key === "viatura" ? viaturaInfo(nome) : null;

  return backBtn(backAttr, "Voltar") + periodBar() +
    `<div class="card">
      <div style="font-size:18px;font-weight:750;letter-spacing:-0.01em">${esc(nome)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px">
        <div><div style="font-size:11.5px;color:var(--ink-muted)">Viagens</div><b style="font-size:15px">${shown.length}</b></div>
        ${km ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Km</div><b style="font-size:15px">${fmtMZN(km)}</b></div>` : ""}
        ${despesa ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Despesas</div><b style="font-size:15px">${fmtMZN(despesa)}</b></div>` : ""}
        ${margem != null ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Margem</div><b style="font-size:15px;color:${margem >= 0 ? "var(--good-text)" : "var(--serious)"}">${fmtMZN(margem)}</b></div>` : ""}
        ${saldo != null ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Saldo do motorista</div><b style="font-size:15px;color:${saldo >= 0 ? "var(--ink)" : "var(--serious)"}">${fmtMZN(saldo)} MZN</b></div>` : ""}
        ${vinfo && vinfo.consumoSeco != null ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Consumo esperado</div><b style="font-size:15px">${fmtNumRaw(String(vinfo.consumoSeco))} l/100km</b></div>` : ""}
      </div>
    </div>
    ${vinfo ? viaturaFichaHTML(vinfo) : ""}
    <div class="section-title">Viagens</div>
    ${shown.length ? `<div class="card">${shown.map(t => tripRowHTML(t, [])).join("")}</div>`
                   : emptyState("Sem viagens neste período.")}`;
}

function renderMotoristas() {
  return entityNav.motorista
    ? entityDetailHTML("motorista", entityNav.motorista, 'data-entity-back="motorista"')
    : entityListHTML("motorista", "motorista", "Ainda não há viagens com motorista registado.");
}
function renderClientes() {
  return entityNav.cliente
    ? entityDetailHTML("cliente", entityNav.cliente, 'data-entity-back="cliente"')
    : entityListHTML("cliente", "cliente", "Ainda não há viagens com cliente registado.");
}

/* --- Viaturas: folha própria, cruzada com as viagens --- */
function viaturaFichaHTML(v) {
  const linhas = (extractViaturas(state.data["Viaturas"])?.cols || [])
    .map(c => ({ name: c.name, val: (v.row[c.i] || "").trim() }))
    .filter(x => x.val);
  if (!linhas.length) return "";
  return `<div class="section-title">Ficha da viatura</div><div class="card">
    ${linhas.map((x, i) => `<div style="display:flex;justify-content:space-between;gap:14px;padding:8px 0;${i < linhas.length - 1 ? "border-bottom:1px solid var(--hairline)" : ""}">
      <span style="font-size:12.5px;color:var(--ink-2)">${esc(x.name)}</span>
      <b style="font-size:13px;text-align:right">${fmtCell(x.val)}</b>
    </div>`).join("")}
  </div>`;
}

function renderViaturas() {
  const vt = extractViaturas(state.data["Viaturas"]);
  if (!vt || !vt.items.length) {
    return emptyState("Sem viaturas registadas.",
      "As viaturas da folha 'Viaturas' do Excel aparecem aqui automaticamente.");
  }
  if (entityNav.viatura) {
    return entityDetailHTML("viatura", entityNav.viatura, 'data-entity-back="viatura"');
  }
  const td = tripsData();
  const shown = td ? tripsInPeriod(td) : [];
  const porViatura = new Map(entityStats(shown, "viatura").map(e => [
    String(e.nome).toLowerCase().replace(/[\s\-_]/g, ""), e]));

  return periodBar() + `<div class="card">` + vt.items.map(v => {
    const e = porViatura.get(String(v.mat).toLowerCase().replace(/[\s\-_]/g, ""));
    return `<div class="mov" data-entity="viatura" data-entity-name="${esc(v.mat)}" style="cursor:pointer;align-items:center">
      <div class="m-main">
        <div style="font-size:14px;font-weight:650">${esc(v.mat)}</div>
        <div style="font-size:12px;color:var(--ink-2);margin-top:3px">
          ${e ? `${e.trips.length} viage${e.trips.length === 1 ? "m" : "ns"}` : "Sem viagens no período"}
          ${v.consumoSeco != null ? ` · esperado ${fmtNumRaw(String(v.consumoSeco))} l/100km` : ""}
        </div>
      </div>
      <div style="color:var(--ink-muted);font-size:18px;flex:none">›</div>
    </div>`;
  }).join("") + `</div>`;
}

function backBtn(attr, label) {
  return `<button ${attr} class="chip" style="cursor:pointer;font-size:13px;padding:8px 14px;margin-bottom:12px;background:var(--surface)">‹ ${label}</button>`;
}

/* Ficha completa de uma viagem: pagamento, custos e recibos (do livro geral),
   todos os campos da folha agrupados, e os movimentos ligados ao VF. */
const GRUPOS_VIAGEM = [
  { t: "Identificação",       re: /^(factura|fatura|vf$|c[óo]digo|req|tipo\s*viagem|condi[çc])/i },
  { t: "Valores",             re: /valor|combinado|receita|rate|tarifa|frete/i },
  { t: "Rota e datas",        re: /destino|origem|prov|trajec|rota|percurso|partida|regresso|chegada|^km|dias|data/i },
  { t: "Equipa e viatura",    re: /cliente|motorista|ajudante|viatura|trailer|matr|reboque/i },
  { t: "Motorista: transferências e justificação", re: /di[áa]ria|transf|despesa|saldo|justific|portage|combust/i },
];
function viagemDetalheHTML(td) {
  const t = td.trips.find(x => x.cod === viagemNav.sel);
  const margem = tripMargin(t);
  const mzn = '<small style="font-size:11px;color:var(--ink-muted);font-weight:600"> MZN</small>';
  const num = (rot, v, cor, sub) => `<div style="min-width:0"><div style="font-size:11.5px;color:var(--ink-2)">${rot}</div>
    <b style="font-size:16px;${cor ? `color:${cor}` : ""}">${v}</b>${sub ? `<div style="font-size:11px;color:var(--ink-muted);margin-top:1px">${sub}</div>` : ""}</div>`;

  /* ---- topo ---- */
  let html = `${backBtn("data-viagens-back", "Voltar às viagens")}
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        ${t.cod ? `<span class="chip" style="background:#1c5cab;color:#fff;border-color:transparent;font-size:14px;padding:7px 13px;font-weight:750">${esc(t.cod)}</span>` : ""}
        ${seloPagamento(t)}
        <button data-abast class="chip" style="cursor:pointer;font-size:13px;font-weight:650;padding:8px 14px;border-color:var(--accent);color:var(--accent-text);margin-left:auto">⛽ Abastecimentos</button>
      </div>
      ${t.rota ? `<div style="font-size:18px;font-weight:750;margin-top:12px">${esc(t.rota)}</div>` : ""}
      <div style="font-size:12.5px;color:var(--ink-2);margin-top:3px">${[t.dataTxt, t.cliente, t.viatura, t.motorista].filter(Boolean).map(esc).join(" · ")}</div>
    </div>`;

  /* ---- pagamento do cliente ---- */
  const pct = t.combinado ? Math.min(100, t.recebido / t.combinado * 100) : null;
  html += `<div class="card">
    <div class="card-t">${svgIc("receitas")}<h3>Pagamento do cliente</h3></div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      ${num("Combinado", t.combinado != null ? fmtMZN(t.combinado) + mzn : "—")}
      ${num("Recebido", fmtMZN(t.recebido) + mzn, t.recebido ? "var(--good-text)" : "")}
      ${num("Pendente", t.pendente != null ? fmtMZN(t.pendente) + mzn : "—", t.pendente > 0.5 ? "var(--serious)" : "")}
    </div>
    ${pct != null ? `<div class="bar" style="margin-top:12px" role="img" aria-label="${Math.round(pct)}% recebido"><i style="width:${pct}%;background:${pct >= 99.9 ? "var(--good)" : "var(--accent)"}"></i></div>
      <div class="bar-legend"><span>${fmtNumRaw(pct.toFixed(0))}% recebido</span><span>${ESTADO_PAG[t.estadoPag].rot}</span></div>` : ""}
    <div style="font-size:12.5px;color:var(--ink-2);margin-top:10px">${t.faturaNum
      ? `Fatura <b style="color:var(--ink)">${esc(t.faturaNum)}</b>${t.fatura && t.fatura.vencTxt ? ` · vence ${esc(t.fatura.vencTxt)}` : ""}${t.fatura && t.fatura.valor !== t.combinado ? ` · ${fmtMZN(t.fatura.valor)} MZN` : ""}`
      : `Ainda sem fatura registada${t.combinado ? " — regista-a no back office, separador Faturação" : ""}.`} <span style="color:var(--ink-muted)">Valores sem IVA.</span></div>
    ${t.combinado == null ? `<div class="vazio-mini">Sem valor combinado. Lança-o na viagem (back office, campo «Valor Combinado»)
      para a app acompanhar o pendente até ficar paga.</div>` : ""}
    ${t.recebimentos.length ? `<div style="margin-top:10px">${t.recebimentos.map(m => `<div class="mov" style="padding:8px 0">
        <div class="m-main"><div class="m-item" style="font-size:13px">${esc(m.desc || "Recebimento")}</div>
          <div class="m-date">${[m.data, m.meio].filter(Boolean).map(esc).join(" · ")}</div></div>
        <div class="m-side"><div class="m-val" style="font-size:13px;color:var(--good-text)">+${fmtMZN(m.valor)}</div></div></div>`).join("")}</div>`
      : `<div class="vazio-mini">Ainda sem recebimentos com o VF desta viagem.</div>`}
  </div>`;

  /* ---- custos, margem e recibos ---- */
  const porCat = new Map();
  for (const m of t.custos) {
    const c = m.categoria || "Sem categoria";
    if (!porCat.has(c)) porCat.set(c, { valor: 0, ent: 0, pend: 0, precisa: precisaRecibo(m) });
    const e = porCat.get(c);
    e.valor += m.valor;
    if (/entregue/i.test(m.recibo)) e.ent++;
    if (t.recibosPendentes.includes(m)) e.pend++;
  }
  const custoTotal = t.custos.reduce((a, m) => a + m.valor, 0);
  html += `<div class="card">
    <div class="card-t">${svgIc("despesas")}<h3>Custos e margem</h3></div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
      ${num("Custos", t.despesa != null ? fmtMZN(t.despesa) + mzn : "—", "", custoTotal ? "do livro geral" : t.despesaCol != null ? "da folha Viagens" : "")}
      ${num("Margem", margem != null ? fmtMZN(margem) + mzn : "—", margem == null ? "" : margem >= 0 ? "var(--good-text)" : "var(--serious)")}
      ${num("Margem/km", margem != null && t.km ? fmtNumRaw((margem / t.km).toFixed(2)) + mzn : "—", "", t.km ? fmtMZN(t.km) + " km" : "")}
    </div>
    ${porCat.size ? `<table class="leg-tab" style="margin-top:12px"><tbody>
      ${[...porCat.entries()].sort((a, b) => b[1].valor - a[1].valor).map(([c, e]) => `<tr>
        <td>${esc(c)}</td>
        <td class="n">${fmtMZN(e.valor)}</td>
        <td class="n" style="font-size:11.5px;color:${e.pend ? "var(--warning)" : e.precisa ? "var(--good-text)" : "var(--ink-muted)"}">
          ${!e.precisa ? "sem recibo" : e.pend ? `${e.pend} recibo${e.pend > 1 ? "s" : ""} por entregar` : e.ent ? "✓ recibos" : "—"}</td></tr>`).join("")}
    </tbody></table>` : `<div class="vazio-mini">Ainda sem despesas lançadas com o VF desta viagem.</div>`}
    ${t.recibosPendentes.length ? `<div class="pr pagar" style="cursor:default;margin-top:12px">
      <span class="icone" style="--cor:var(--warning)">${svgIc("documento")}</span>
      Recibos por entregar: ${t.recibosPendentes.length}<b>${fmtMZN(t.recibosPendentes.reduce((a, m) => a + m.valor, 0))} <small style="color:var(--ink-muted)">MZN</small></b></div>`
      : t.recibosEntregues.length ? `<div style="margin-top:10px;font-size:12.5px;color:var(--good-text)">✓ Todos os recibos entregues (${t.recibosEntregues.length})</div>` : ""}
  </div>`;

  /* ---- todos os campos da folha, agrupados ---- */
  const usados = new Set();
  const grupos = GRUPOS_VIAGEM.map(g => ({ t: g.t, cols: td.cols.filter(c => {
    if (usados.has(c.i) || !g.re.test(c.name)) return false; usados.add(c.i); return true; }) }));
  grupos.push({ t: "Outros", cols: td.cols.filter(c => !usados.has(c.i)) });
  html += `<div class="card"><div class="card-t">${svgIc("lista")}<h3>Dados da viagem</h3>
      <span class="extra">tudo o que está na folha Viagens</span></div>` +
    grupos.filter(g => g.cols.length).map(g => `
      <div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);margin:14px 0 2px">${esc(g.t)}</div>
      ${g.cols.map(c => { const v = (t.row[c.i] || "").trim(); return `
        <div style="display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--hairline)">
          <span style="font-size:12.5px;color:var(--ink-2)">${esc(c.name.replace(/\s+/g, " "))}</span>
          <b style="font-size:13px;text-align:right;font-variant-numeric:tabular-nums;${v ? "" : "color:var(--ink-muted);font-weight:500"}">${v ? fmtCell(v) : "—"}</b>
        </div>`; }).join("")}`).join("") + `</div>`;

  /* ---- movimentos ligados ao VF ---- */
  if (t.movs.length) {
    html += `<div class="card"><div class="card-t">${svgIc("moedas")}<h3>Movimentos ligados</h3><span class="extra">${t.movs.length}</span></div>` +
      t.movs.map(m => `<div class="mov" style="padding:9px 0">
        <div class="m-main"><div class="m-item" style="font-size:13px">${esc(m.desc || m.categoria || m.tipo)}</div>
          <div class="m-date">${[m.data, m.tipo, m.categoria, m.meio, m.recibo && "recibo: " + m.recibo.toLowerCase()].filter(Boolean).map(esc).join(" · ")}</div></div>
        <div class="m-side"><div class="m-val" style="font-size:13px;color:${m.entrada ? "var(--good-text)" : "var(--ink)"}">${m.entrada ? "+" : "−"}${fmtMZN(m.valor)}</div></div>
      </div>`).join("") + `</div>`;
  }

  /* ---- atalhos ---- */
  const links = [
    t.motorista && { key: "motorista", label: "Motorista", val: t.motorista },
    t.viatura   && { key: "viatura",   label: "Viatura",   val: t.viatura },
    t.cliente   && { key: "cliente",   label: "Cliente",   val: t.cliente },
  ].filter(Boolean);
  if (links.length) html += `<div class="card" style="display:flex;flex-wrap:wrap;gap:8px">
      ${links.map(l => `<button class="chip" data-entity="${l.key}" data-entity-name="${esc(l.val)}" style="cursor:pointer;font-size:12.5px;padding:8px 13px">
        ${esc(l.label)}: <b style="margin-left:3px">${esc(l.val)}</b> ›</button>`).join("")}
    </div>`;
  return html;
}

/* consumo real da viagem vs o esperado para a viatura */
function consumoHTML(t, header, dataRows) {
  const cols = header.map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  const iLitros = findCol(cols, /litros?/i);
  if (iLitros < 0) return "";
  const litros = dataRows.reduce((a, r) => a + (parseNum(r[iLitros]) || 0), 0);
  if (!litros) return "";

  /* km: da folha de viagens, ou pela diferença de leituras do conta-km */
  let km = t.km;
  if (km == null) {
    const iKm = findCol(cols, /^km$/i, /conta[\s-]?km|od[óo]metro|quil[óo]metr/i);
    if (iKm >= 0) {
      const leituras = dataRows.map(r => parseNum(r[iKm])).filter(v => v != null && v > 0);
      if (leituras.length >= 2) km = Math.max(...leituras) - Math.min(...leituras);
    }
  }
  if (!km) {
    return `<div class="card" style="font-size:12px;color:var(--ink-2)">
      Total de <b style="color:var(--ink)">${fmtNumRaw(String(litros))} litros</b> nesta viagem.
      Para calcular o consumo, acrescenta os <b style="color:var(--ink)">km</b> à folha de viagens
      (ou as leituras do conta-quilómetros aos abastecimentos).</div>`;
  }

  const real = litros / km * 100;               // l/100km
  const v = viaturaInfo(t.viatura);
  const esperado = v ? (v.consumoSeco ?? v.consumoCarr) : null;
  const desvio = esperado ? (real - esperado) / esperado * 100 : null;
  const mau = desvio != null && desvio > 10;

  return `<div class="card">
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <div><div style="font-size:11px;color:var(--ink-muted)">Consumo real</div>
        <b style="font-size:17px">${fmtNumRaw(real.toFixed(1))} <small style="font-size:11px;color:var(--ink-muted)">l/100km</small></b></div>
      ${esperado ? `<div><div style="font-size:11px;color:var(--ink-muted)">Esperado</div>
        <b style="font-size:17px">${fmtNumRaw(String(esperado))} <small style="font-size:11px;color:var(--ink-muted)">l/100km</small></b></div>` : ""}
      <div><div style="font-size:11px;color:var(--ink-muted)">Litros · Km</div>
        <b style="font-size:17px">${fmtNumRaw(String(litros))} · ${fmtMZN(km)}</b></div>
    </div>
    ${desvio != null ? `<div class="status ${mau ? "warn" : "good"}" style="margin-top:10px;font-size:12.5px">
      ${mau ? "!" : "✓"} ${desvio >= 0 ? "+" : ""}${fmtNumRaw(desvio.toFixed(1))}% face ao esperado${mau ? " — vale a pena verificar" : ""}
    </div>` : `<div style="font-size:11.5px;color:var(--ink-muted);margin-top:8px">
      Acrescenta o consumo esperado desta viatura à folha «Viaturas» para veres o desvio.</div>`}
  </div>`;
}

/* Linha do cabeçalho numa folha de abastecimentos. Procura-se pelos NOMES
   (Data, Litros, Preço, Valor, Km, Local, Bomba): a linha "mais cheia" falha
   quando um abastecimento tem um valor solto numa coluna sem título — essa
   linha passava a ser o cabeçalho e a folha parecia vazia. Antes do cabeçalho
   pode haver o bloco de identificação (Viagem / Matrícula / Motorista / Trajecto). */
const RE_CAB_ABAST = /^(data|local|bomba|posto|litros?|pre[çc]o|valor|montante|total|km|kms|quil[óo]metr|od[óo]metro|conta)/i;
function linhaCabecalhoAbast(rows) {
  for (let i = 0; i < Math.min(rows.length, 12); i++) {
    const n = rows[i].filter(c => RE_CAB_ABAST.test(String(c || "").trim())).length;
    if (n >= 3) return i;
  }
  /* sem nomes conhecidos: a linha com mais texto que não seja número nem data */
  let hi = 0, best = -1;
  rows.slice(0, 8).forEach((r, i) => {
    const txt = r.filter(c => { const t = String(c || "").trim(); return t && parseNum(t) == null && !parseDate(t); }).length;
    if (txt > best) { best = txt; hi = i; }
  });
  return hi;
}

function abastHTML(td) {
  const t = td.trips.find(x => x.cod === viagemNav.sel);
  const code = (t.cod || "").trim();
  const head = `${backBtn("data-abast-back", "Voltar à viagem")}
    <div class="section-title">Abastecimentos · ${esc(code.toUpperCase())}</div>`;
  if (!code) return head + emptyState("Viagem sem código", "Sem código não é possível encontrar a folha de abastecimentos.");

  const entry = abastCache[code.toLowerCase()];
  if (!entry || entry.loading) {
    if (!entry) loadAbastecimentos(code);
    return head + `<div class="card"><div class="skel" style="height:120px"></div></div>`;
  }
  if (entry.err === "config") {
    return head + `<div class="state"><div class="icon">🔗</div><h3>Ficheiro por ligar</h3>
      <p>A "Planilha de Abastecimentos CNET" ainda não está ligada à app. É preciso partilhar esse ficheiro no Drive («Qualquer pessoa com o link — Leitor») e configurar o ID no site.</p></div>`;
  }
  if (entry.err) {
    return head + emptyState("Sem folha para esta viagem",
      `Não foi encontrada nenhuma folha chamada «${code}» na Planilha de Abastecimentos CNET. O nome do separador (em baixo, no Google Sheets) tem de ser exatamente o código da viagem — ex.: «${code.toUpperCase()}».`);
  }

  const clean = entry.rows.filter(r => !isRowEmpty(r));
  const hi = linhaCabecalhoAbast(clean);
  const header = clean[hi], dataRows = clean.slice(hi + 1);
  if (!dataRows.length) return head + emptyState("Sem abastecimentos registados nesta viagem.");

  /* totais das colunas de litros/valores */
  const totais = header.map((c, i) => ({ name: (c || "").trim(), i }))
    .filter(c => /litro|valor|custo|montante|total/i.test(c.name) &&
                 !/pre[çc]o|\/|m[ée]di|km/i.test(c.name)) // não somar preços/médias
    .map(c => ({ name: c.name, sum: dataRows.reduce((a, r) => a + (parseNum(r[c.i]) || 0), 0) }))
    .filter(c => c.sum > 0);

  return head +
    `<div style="font-size:11px;color:var(--ink-muted);margin:-4px 2px 8px">Folha «${esc(entry.sheetName || code)}» da Planilha de Abastecimentos CNET</div>` +
    consumoHTML(t, header, dataRows) +
    tableHTML(header, dataRows) +
    (totais.length ? `<div class="card" style="display:flex;flex-wrap:wrap;gap:6px 18px">
      ${totais.map(c => `<div style="font-size:12px;color:var(--ink-2)">${esc(c.name)}: <b style="color:var(--ink);font-variant-numeric:tabular-nums">${fmtMZN(c.sum)}</b></div>`).join("")}
    </div>` : "");
}

function abastUrl(name) {
  return SRC_OVERRIDE
    ? SRC_OVERRIDE.replace(/\/$/, "") + "/abast-" + encodeURIComponent(name) + ".csv"
    : "https://docs.google.com/spreadsheets/d/" + ABASTECIMENTOS_ID +
      "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(name) + "&t=" + Date.now();
}
async function fetchCsvText(url) {
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) return null;
    const text = await res.text();
    if (/<html/i.test(text.slice(0, 300))) return null;
    return text;
  } catch (e) { return null; }
}

/* nomes de folha a experimentar para um código VF+número, dos mais
   prováveis para os menos: VF15, vf15, Vf15, VF 15, VF-15, VF015 */
function codeVariants(code) {
  const c = code.trim();
  const compact = c.replace(/[\s\-_]/g, "");
  const out = [c, compact.toUpperCase(), compact.toLowerCase(), compact];
  const m = compact.match(/^([A-Za-z]+)0*(\d+)$/);
  if (m) {
    const pre = m[1].toUpperCase(), num = m[2];
    out.push(pre + " " + num, pre + "-" + num, pre + num.padStart(3, "0"),
             pre[0] + pre.slice(1).toLowerCase() + num, num);
  }
  return [...new Set(out.filter(Boolean))];
}

async function loadAbastecimentos(code) {
  const key = code.toLowerCase();
  if (abastCache[key] && !abastCache[key].loading) return;
  if (!ABASTECIMENTOS_ID && !SRC_OVERRIDE) {
    abastCache[key] = { err: "config" }; repaintViagens(); return;
  }
  abastCache[key] = { loading: true };

  /* O gviz devolve a PRIMEIRA folha quando o nome pedido não existe, em vez
     de dar erro. Pedimos primeiro um nome impossível: se vier resposta, é o
     conteúdo da primeira folha ("canário") — e qualquer variante que devolva
     exatamente isso só é aceite se o conteúdo mencionar o código da viagem. */
  const canary = await fetchCsvText(abastUrl("nl_folha_inexistente_9x7z"));

  const norm = s => s.toLowerCase().replace(/[\s\-_]/g, "");
  /* só aceitamos uma resposta igual à sonda se o conteúdo mencionar mesmo
     o código (ex.: "vf50" — e não "bt50" nem "vf500") */
  const codeRe = new RegExp(norm(code).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?!\\d)");
  for (const name of codeVariants(code)) {
    const text = await fetchCsvText(abastUrl(name));
    if (text == null) continue;
    if (canary != null && text === canary && !codeRe.test(norm(text))) {
      continue; // é a primeira folha devolvida por engano — não é esta viagem
    }
    abastCache[key] = { rows: parseCSV(text), sheetName: name };
    repaintViagens();
    return;
  }
  abastCache[key] = { err: "notfound" };
  repaintViagens();
}

  const view = ALL_VIEWS.find(v => v.id === id);

/* --- Render automático (folhas futuras): tabela genérica --- */
function renderAuto(rows) {
  const clean = rows.filter(r => !isRowEmpty(r));
  if (!clean.length) return emptyState("Folha sem dados.");
  // cabeçalho = linha mais "densa" nas primeiras 6 linhas
  let hi = 0, best = 0;
  clean.slice(0, 6).forEach((r, i) => {
    const filled = r.filter(c => c && c.trim()).length;
    if (filled > best) { best = filled; hi = i; }
  });
  return tableHTML(clean[hi], clean.slice(hi + 1));
}

function tableHTML(header, dataRows) {
  const cols = header.map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  const head = cols.map(c => `<th>${esc(c.name)}</th>`).join("");
  const body = dataRows.map(r => "<tr>" + cols.map(c => {
    const raw = (r[c.i] || "").trim();
    const numeric = isNumericCell(raw);
    return `<td class="${numeric ? "num" : ""}">${numeric ? fmtNumRaw(raw) : esc(raw) || "—"}</td>`;
  }).join("") + "</tr>").join("");
  return `<div class="card tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function emptyState(title, sub) {

    <div class="icon">🗂️</div>

/* =====================================================================
   FATURAÇÃO — faturas emitidas noutro lado e registadas aqui.
   Uma viagem por fatura; valores sem IVA. O estado de cada fatura vem dos
   recebimentos com o VF da viagem (não se marca nada à mão).
   ===================================================================== */
function extractFaturas(rows) {
  if (!rows) return null;
  /* a folha só conta se tiver Nº Fatura e VF no cabeçalho — quando a folha
     não existe, o Google devolve a primeira folha do ficheiro */
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 6); i++) {
    const c = rows[i].map(x => String(x || "").trim());
    if (c.some(x => /n[º°o]?\.?\s*(fatura|factura)|^(fatura|factura)$/i.test(x)) &&
        c.some(x => /^(vf|viagem)$/i.test(x))) { h = i; break; }
  }
  if (h < 0) return null;
  const cols = rows[h].map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  const ix = {
    num: findCol(cols, /n[º°o]?\.?\s*(fatura|factura)/i, /^(fatura|factura)$/i),
    data: findCol(cols, /^data/i), cli: findCol(cols, /^cliente/i), vf: findCol(cols, /^(vf|viagem)$/i),
    valor: findCol(cols, /^valor/i, /montante|total/i), venc: findCol(cols, /^vencimento/i), nota: findCol(cols, /^nota/i),
  };
  const get = (r, i) => i >= 0 ? String(r[i] || "").trim() : "";
  const out = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    const numero = get(r, ix.num);
    if (!numero) continue;
    out.push({ numero, dataTxt: get(r, ix.data), date: parseDate(get(r, ix.data)), cliente: get(r, ix.cli),
      vf: tripCode(get(r, ix.vf)), valor: parseNum(get(r, ix.valor)) || 0,
      vencTxt: get(r, ix.venc), venc: parseDate(get(r, ix.venc)), nota: get(r, ix.nota) });
  }
  return out;
}

/* faturas com o estado calculado a partir dos recebimentos da viagem */
function faturasComEstado() {
  const lista = extractFaturas(state.data["Faturas"]);
  if (!lista) return null;
  const td = tripsData();
  const viagens = new Map((td ? td.trips : []).map(t => [tripCode(t.cod), t]));
  const geral = extractGeral(state.data["Movimentos Geral"]) || [];
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  return lista.map(f => {
    const t = viagens.get(f.vf);
    const recebido = t ? t.recebido
      : geral.filter(m => m.viagem === f.vf && m.entrada && /receb/i.test(m.tipo)).reduce((a, m) => a + m.valor, 0);
    const pendente = Math.max(0, f.valor - recebido);
    const atraso = f.venc && pendente > 0.5 ? Math.floor((hoje - f.venc) / 864e5) : null;
    const estado = pendente <= 0.5 ? "paga" : atraso != null && atraso > 0 ? "vencida" : recebido > 0 ? "parcial" : "receber";
    return { ...f, viagem: t || null, recebido: Math.min(recebido, f.valor), pendente, atraso, estado,
      cliente: f.cliente || (t && t.cliente) || "" };
  });
}
const ESTADO_FAT = {
  paga:    { rot: "Paga",        cor: "var(--good)" },
  parcial: { rot: "Parcial",     cor: "var(--warning)" },
  receber: { rot: "Por receber", cor: "var(--accent)" },
  vencida: { rot: "Vencida",     cor: "var(--critical)" },
};
function seloFatura(f) {
  const e = ESTADO_FAT[f.estado];
  return `<span class="selo-pag" style="--cor:${e.cor}"><i></i>${e.rot}${f.estado === "vencida" ? ` há ${f.atraso} dia${f.atraso === 1 ? "" : "s"}` : ""}</span>`;
}

function faturaLinhaHTML(f) {
  return `<div class="mov" ${f.viagem ? `data-viagem-cod="${esc(f.viagem.cod)}" style="cursor:pointer;flex-wrap:wrap"` : `style="flex-wrap:wrap"`}>
    <div class="m-main">
      <div class="m-item">${esc(f.numero)} <span style="font-weight:500;color:var(--ink-2)">· ${esc(f.cliente || "—")}</span></div>
      <div class="m-desc">${esc(f.vf || "sem viagem")}${f.dataTxt ? " · emitida " + esc(f.dataTxt) : ""}${f.vencTxt ? " · vence " + esc(f.vencTxt) : ""}</div>
    </div>
    <div class="m-side"><div class="m-val">${fmtMZN(f.valor)} <small style="font-weight:600;color:var(--ink-muted)">MZN</small></div>
      ${f.pendente > 0.5 && f.recebido > 0 ? `<div style="font-size:11px;color:var(--ink-muted);margin-top:2px">falta ${fmtMZN(f.pendente)}</div>` : ""}</div>
    <div style="flex-basis:100%;margin-top:6px">${seloFatura(f)}</div>
  </div>`;
}

function renderFaturas() {
  const sub = contasNav.faturas;
  const bar = pillBar("faturas", [
    { id: "faturas", label: "Faturas" }, { id: "receber", label: "Por receber" },
    { id: "faturar", label: "Por faturar" }, { id: "clientes", label: "Clientes" },
  ], sub);
  const lista = faturasComEstado();
  const td = tripsData();
  const semFatura = td ? td.trips.filter(t => !t.faturaNum) : [];
  const mzn = '<small style="font-size:11px;color:var(--ink-muted);font-weight:600"> MZN</small>';

  if (sub === "faturar") {
    return bar + (semFatura.length
      ? `<div class="card" style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:12.5px;color:var(--ink-2)">${semFatura.length} viage${semFatura.length === 1 ? "m" : "ns"} sem fatura</span>
          <b style="font-size:16px">${fmtMZN(semFatura.reduce((a, t) => a + (t.combinado || 0), 0))}${mzn}</b></div>
        <div class="card">${semFatura.map(t => tripRowHTML(t, [])).join("")}</div>
        <p style="font-size:11px;color:var(--ink-muted);text-align:center;margin:2px 8px 8px">Regista a fatura no back office, separador Faturação.</p>`
      : emptyState("Todas as viagens estão faturadas."));
  }
  if (!lista) {
    return bar + emptyState("Ainda não há faturas registadas.",
      "Quando registares a primeira fatura no back office (separador Faturação), a folha «Faturas» é criada e aparece aqui. Entretanto, vê as viagens por faturar." );
  }

  const noPeriodo = lista.filter(f => inPeriod(f.date, state.period));
  const soma = (l, k) => l.reduce((a, f) => a + f[k], 0);
  const abertas = lista.filter(f => f.pendente > 0.5);
  const vencidas = abertas.filter(f => f.estado === "vencida");
  const topo = `<div class="grelha g4">
      ${[["Faturado", soma(noPeriodo, "valor"), "", `${noPeriodo.length} fatura${noPeriodo.length === 1 ? "" : "s"} no período`],
         ["Recebido", soma(noPeriodo, "recebido"), "var(--good-text)", "das faturas do período"],
         ["Por receber", soma(abertas, "pendente"), abertas.length ? "var(--ink)" : "", `${abertas.length} em aberto`],
         ["Vencido", soma(vencidas, "pendente"), vencidas.length ? "var(--serious)" : "", `${vencidas.length} vencida${vencidas.length === 1 ? "" : "s"}`]]
        .map(([r, v, c, sub2]) => `<div class="card kt"><div class="rot">${r}</div>
          <div class="val"${c ? ` style="color:${c}"` : ""}>${fmtMZN(v)}${MZN}</div><div class="sub">${sub2}</div></div>`).join("")}
    </div>`;

  if (sub === "receber") {
    if (!abertas.length) return bar + topo + emptyState("Nada por receber. ✓");
    /* antiguidade: dias depois do vencimento */
    const faixas = [
      { nome: "A vencer",   f: x => x.atraso == null || x.atraso <= 0, cor: "var(--accent)" },
      { nome: "1–30 dias",  f: x => x.atraso > 0 && x.atraso <= 30,    cor: "var(--warning)" },
      { nome: "31–60 dias", f: x => x.atraso > 30 && x.atraso <= 60,   cor: "var(--serious)" },
      { nome: "+60 dias",   f: x => x.atraso > 60,                     cor: "var(--critical)" },
    ].map(g => ({ ...g, itens: abertas.filter(g.f) })).map(g => ({ ...g, valor: soma(g.itens, "pendente") }));
    const total = soma(abertas, "pendente");
    return bar + topo + `<div class="card">
        <div class="card-t">${svgIc("relogio")}<h3>Antiguidade do que falta receber</h3></div>
        <div style="display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden">
          ${faixas.filter(g => g.valor).map(g => `<i class="marca" style="flex:${g.valor};background:${g.cor}"
            data-tip="${g.nome}&#10;${fmtMZN(g.valor)} MZN · ${g.itens.length} fatura${g.itens.length === 1 ? "" : "s"}"></i>`).join("")}
        </div>
        <table class="leg-tab"><tbody>${faixas.map(g => `<tr><td><i style="background:${g.cor}"></i>${g.nome}</td>
          <td class="n p">${g.itens.length}</td><td class="n">${fmtMZN(g.valor)}</td></tr>`).join("")}</tbody></table>
        <div style="font-size:11px;color:var(--ink-muted);margin-top:6px">Total em aberto: ${fmtMZN(total)} MZN · contado a partir do vencimento</div>
      </div>` +
      faixas.filter(g => g.itens.length).map(g => `<div class="section-title">${g.nome}</div>
        <div class="card">${g.itens.sort((a, b) => (b.atraso || 0) - (a.atraso || 0)).map(faturaLinhaHTML).join("")}</div>`).join("");
  }
  if (sub === "clientes") {
    const por = new Map();
    for (const f of lista) {
      const k = f.cliente || "Sem cliente";
      if (!por.has(k)) por.set(k, { nome: k, n: 0, valor: 0, recebido: 0, pendente: 0, vencido: 0 });
      const e = por.get(k);
      e.n++; e.valor += f.valor; e.recebido += f.recebido; e.pendente += f.pendente;
      if (f.estado === "vencida") e.vencido += f.pendente;
    }
    const cl = [...por.values()].sort((a, b) => b.pendente - a.pendente || b.valor - a.valor);
    return bar + topo + `<div class="card">${cl.map(c => `<div class="mov" style="flex-wrap:wrap">
        <div class="m-main"><div class="m-item">${esc(c.nome)}</div>
          <div class="m-desc">${c.n} fatura${c.n === 1 ? "" : "s"} · faturado ${fmtMZN(c.valor)} · recebido ${fmtMZN(c.recebido)}</div></div>
        <div class="m-side"><div class="m-val" style="color:${c.vencido ? "var(--serious)" : c.pendente ? "var(--ink)" : "var(--good-text)"}">${c.pendente ? fmtMZN(c.pendente) : "✓"}</div>
          <div style="font-size:11px;color:var(--ink-muted)">${c.vencido ? fmtMZN(c.vencido) + " vencido" : c.pendente ? "em aberto" : "tudo pago"}</div></div>
      </div>`).join("")}</div>`;
  }
  return bar + periodBar() + topo + (noPeriodo.length
    ? `<div class="card">${noPeriodo.slice().reverse().map(faturaLinhaHTML).join("")}</div>`
    : emptyState("Sem faturas neste período.")) +
    `<p style="font-size:11px;color:var(--ink-muted);text-align:center;margin:2px 8px 8px;line-height:1.5">
      Valores sem IVA. O estado vem dos recebimentos lançados com o VF da viagem.</p>`;
}

  return `<div class="tiles">
    <div class="skel" style="height:84px"></div><div class="skel" style="height:84px"></div>
    <div class="skel wide" style="grid-column:1/-1;height:120px"></div>
    <div class="skel wide" style="grid-column:1/-1;height:180px"></div>
  </div>`;
}

function gotoView(groupId, viewId) {
  const group = NAV.find(g => g.id === groupId);
  if (!group) return;
  state.activeGroup = groupId;
  navEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.group === groupId));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + groupId));
  if (viewId && group.views.some(v => v.id === viewId && viewAvailable(v))) {
    state.activeView[groupId] = viewId;
  }
  refreshSubtabs(groupId);
  if (group.views.length === 1) {
    const el = document.getElementById("view-" + group.views[0].id);
    if (el) el.style.display = "";
  }
  window.scrollTo({ top: 0 });
}

navEl.addEventListener("click", e => {
  const btn = e.target.closest("button[data-group]");
  if (btn) { gotoView(btn.dataset.group); ensureGroupLoaded(btn.dataset.group); }
});

mainEl.addEventListener("click", e => {
  const sub = e.target.closest(".subtabs button[data-view]");
  if (sub) {
    gotoView(sub.closest(".subtabs").dataset.group, sub.dataset.view);
    return;
  }
  const jump = e.target.closest("[data-goto]");
  if (jump) {
    const [g, v, pilula] = jump.dataset.goto.split(":");
    if (pilula && contasNav[v] !== undefined) contasNav[v] = pilula;
    gotoView(g, v);
    ensureGroupLoaded(g);
    /* a folha pode já estar carregada (pelo painel): redesenha já com a
       pílula pedida, senão abria na que estava escolhida antes */
    if (pilula) repaintView(v);
    return;
  }
  const per = e.target.closest("[data-periods] button[data-period]");
  if (per) {
    state.period = per.dataset.period;
    repaintActive(); return;
  }
  const ent = e.target.closest("[data-entity][data-entity-name]");
  if (ent) {
    openEntity(ent.dataset.entity, ent.dataset.entityName); return;
  }
  const entBack = e.target.closest("[data-entity-back]");
  if (entBack) {
    entityNav[entBack.dataset.entityBack] = null;
    repaintActive(); window.scrollTo({ top: 0 }); return;
  }
  const vRow = e.target.closest("[data-viagem-cod]");
  if (vRow) {
    viagemNav.mode = "detalhe"; viagemNav.sel = vRow.dataset.viagemCod;
    gotoView("viagens", "viagens");
    repaintViagens(); window.scrollTo({ top: 0 });
    return;
  }
  if (e.target.closest("[data-viagens-back]")) {
    viagemNav.mode = "lista"; repaintViagens(); window.scrollTo({ top: 0 });
    return;
  }
  if (e.target.closest("[data-abast-back]")) {
    viagemNav.mode = "detalhe"; repaintViagens(); window.scrollTo({ top: 0 });
    return;
  }
  if (e.target.closest("[data-abast]")) {
    viagemNav.mode = "abast"; repaintViagens(); window.scrollTo({ top: 0 });
    return;
  }
  const pill = e.target.closest("[data-pills] button[data-pill]");
  if (pill) {
    const grupo = pill.closest("[data-pills]").dataset.pills;
    contasNav[grupo] = pill.dataset.pill;
    repaintView(grupo); window.scrollTo({ top: 0 }); return;
  }

  const chip = e.target.closest("#movFilters button");
  if (chip) { movFilter = chip.dataset.socio; repaintView("investimentos"); return; }

  const tchip = e.target.closest("#movTipos button");
  if (tchip) { movTipo = tchip.dataset.tipo; repaintView("investimentos"); return; }

  if (e.target.closest("[data-cat-clear]")) { movCat = null; repaintView("investimentos"); return; }

  const cat = e.target.closest("[data-cat]");
  if (cat) {
    movCat = cat.dataset.cat === "Sem categoria" ? null : cat.dataset.cat;
    movTipo = "Todos"; contasNav.investimentos = "movimentos";
    gotoView("contas", "investimentos"); repaintView("investimentos");
    window.scrollTo({ top: 0 }); return;
  }
  const tgo = e.target.closest("[data-tipo-goto]");
  if (tgo) {
    movTipo = tgo.dataset.tipoGoto; movCat = null; contasNav.investimentos = "movimentos";
    gotoView("contas", "investimentos"); repaintView("investimentos");
    window.scrollTo({ top: 0 }); return;
  }

  /* --- livro geral --- */
  const gt = e.target.closest("[data-geral-tipos] button[data-gtipo]");
  if (gt) { geralTipo = gt.dataset.gtipo; repaintView("correntes"); return; }

  if (e.target.closest("[data-gcat-clear]")) { geralCat = null; repaintView("correntes"); return; }

  const gcat = e.target.closest("[data-gcat]");
  if (gcat) {
    geralCat = gcat.dataset.gcat === "Sem categoria" ? null : gcat.dataset.gcat;
    geralTipo = "Todos"; contasNav.correntes = "movimentos";
    repaintView("correntes"); window.scrollTo({ top: 0 }); return;
  }
});

/* ---------------- Valores ao toque nos gráficos ---------------- */
const vizTip = document.getElementById("vizTip");
let tipTimer = null;

function mostrarTip(alvo, x, y) {
  vizTip.innerHTML = esc(alvo.getAttribute("data-tip")).replace(/\n/g, "<br>");
  vizTip.hidden = false;
  const r = vizTip.getBoundingClientRect();
  const px = Math.min(Math.max(8, x - r.width / 2), window.innerWidth - r.width - 8);
  const py = y - r.height - 12 < 8 ? y + 16 : y - r.height - 12;
  vizTip.style.left = px + "px";
  vizTip.style.top = py + "px";
  clearTimeout(tipTimer);
  tipTimer = setTimeout(esconderTip, 2600);   // some sozinho no telemóvel
}
function esconderTip() { vizTip.hidden = true; }

document.addEventListener("click", e => {
  const marca = e.target.closest("[data-tip]");
  if (!marca) { esconderTip(); return; }
  mostrarTip(marca, e.clientX, e.clientY);
}, true);
document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const marca = e.target.closest("[data-tip]");
  if (marca) mostrarTip(marca, e.clientX, e.clientY); else esconderTip();
});
window.addEventListener("scroll", esconderTip, { passive: true });

/* ---------------- Pesquisa global ---------------- */
const searchOverlay = document.getElementById("searchOverlay");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");

function openSearch() {
  searchOverlay.hidden = false;
  searchInput.value = "";
  renderSearch("");
  searchInput.focus();
  ensureGroupLoaded("viaturas").then(() => { if (!searchOverlay.hidden) renderSearch(searchInput.value); });
}
function closeSearch() { searchOverlay.hidden = true; }

/* comparação sem acentos: "claudio" encontra "Claúdio".
   NFD separa a letra do acento; descartam-se as marcas combinatórias
   (U+0300–U+036F) sem escrever caracteres invisíveis no código. */
function deaccent(s) {
  let out = "";
  for (const ch of String(s || "").normalize("NFD")) {
    const c = ch.codePointAt(0);
    if (c < 0x300 || c > 0x36f) out += ch;
  }
  return out.toLowerCase();
}

function renderSearch(q) {
  const term = deaccent(q.trim());
  if (!term) {
    searchResults.innerHTML = `<div class="state"><div class="icon">🔎</div>
      <h3>Procurar</h3><p>Escreve um código de viagem (VF50), uma matrícula, um motorista ou um cliente.</p></div>`;
    return;
  }
  const has = s => deaccent(s).includes(term);
  const out = [];

  const td = tripsData();
  if (td) {
    for (const t of td.trips) {
      if (has(t.cod) || has(t.cliente) || has(t.motorista) || has(t.viatura) || has(t.rota)) {
        out.push({ kind: "Viagem", title: t.cod || "(sem código)",
          sub: [t.dataTxt, t.cliente, t.motorista, t.viatura].filter(Boolean).join(" · "),
          act: () => { viagemNav.mode = "detalhe"; viagemNav.sel = t.cod;
                       gotoView("viagens", "viagens"); repaintViagens(); } });
      }
      if (out.length > 40) break;
    }
    for (const key of ["motorista", "cliente"]) {
      for (const e of entityStats(td.trips, key)) {
        if (!has(e.nome)) continue;
        out.push({ kind: key === "motorista" ? "Motorista" : "Cliente", title: e.nome,
          sub: `${e.trips.length} viage${e.trips.length === 1 ? "m" : "ns"}`,
          act: () => openEntity(key, e.nome) });
      }
    }
  }
  const vt = extractViaturas(state.data["Viaturas"]);
  if (vt) {
    for (const v of vt.items) {
      if (!has(v.mat)) continue;
      out.push({ kind: "Viatura", title: v.mat,
        sub: v.consumoSeco != null ? `Consumo esperado ${fmtNumRaw(String(v.consumoSeco))} l/100km` : "",
        act: () => openEntity("viatura", v.mat) });
    }
  }

  if (!out.length) {
    searchResults.innerHTML = `<div class="state"><div class="icon">🤔</div>
      <h3>Nada encontrado</h3><p>Não há resultados para «${esc(q)}».</p></div>`;
    return;
  }
  searchActions = out.slice(0, 40);
  searchResults.innerHTML = `<div class="card">` + searchActions.map((r, i) => `
    <div class="sr-item" data-sr="${i}">
      <span class="sr-kind">${esc(r.kind)}</span>
      <div class="sr-main">
        <div class="sr-title">${esc(r.title)}</div>
        ${r.sub ? `<div class="sr-sub">${esc(r.sub)}</div>` : ""}
      </div>
      <span style="color:var(--ink-muted)">›</span>
    </div>`).join("") + `</div>`;
}
let searchActions = [];

document.getElementById("searchBtn").addEventListener("click", openSearch);
document.getElementById("searchClose").addEventListener("click", closeSearch);
searchInput.addEventListener("input", () => renderSearch(searchInput.value));
searchResults.addEventListener("click", e => {
  const item = e.target.closest("[data-sr]");
  if (!item) return;
  const r = searchActions[+item.dataset.sr];
  closeSearch();
  if (r) { r.act(); window.scrollTo({ top: 0 }); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !searchOverlay.hidden) closeSearch();
});
/* período escolhido no topo do painel */
document.addEventListener("change", e => {
  const sel = e.target.closest("[data-period-select]");
  if (sel) { state.period = sel.value; repaintActive(); }
});

/* abre a ficha de um motorista / cliente / viatura */
function openEntity(key, nome) {
  entityNav[key] = nome;
  const target = key === "viatura" ? ["viaturas", "viaturas"]
    : key === "cliente" ? ["pessoas", "clientes"] : ["pessoas", "motoristas"];
  ensureGroupLoaded(target[0]);
  gotoView(target[0], target[1]);
  repaintView(target[1]);
  window.scrollTo({ top: 0 });
}

function paint(view) {
  const panel = document.getElementById("view-" + view.id);
  if (!panel) return;
  const rows = state.data[resolveSheet(view)];
  try {
    panel.innerHTML = (RENDERERS[view.render] || renderAuto)(rows);
  } catch (err) {
    console.error("render", view.id, err);
    // nunca deixar um separador em branco
    panel.innerHTML = rows ? renderAuto(rows) : emptyState("Sem dados para mostrar.");
  }
}

function setUpdated() {
  const metas = Object.values(state.meta);
  if (!metas.length) { updatedEl.textContent = ""; return; }
  const anyCache = metas.some(m => m.fromCache);
  const t = new Date(Math.min(...metas.map(m => m.time)));
  const stamp = t.toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit" }) +
    " " + t.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });
  updatedEl.innerHTML = anyCache
    ? `<span class="stale">Sem ligação — a mostrar dados guardados de ${stamp}</span>`
    : `Atualizado em ${stamp}`;
}

/* Carrega um conjunto de folhas (uma vez cada) e guarda-as no estado.
   Só se carrega o que a área aberta precisa — a app arranca mais depressa. */
async function loadSheets(sheetNames, force) {
  const todo = [...new Set(sheetNames)].filter(s => s && (force || !state.data[s]));
  if (!todo.length) return;
  const results = await Promise.all(todo.map(sheet =>
    loadSheet(sheet, force).then(r => ({ sheet, ...r })).catch(err => ({ sheet, err }))));
  for (const r of results) {
    if (r.err) {
      console.error("load", r.sheet, r.err);
      delete state.meta[r.sheet];
      state.errors[r.sheet] = true;
    } else {
      state.data[r.sheet] = r.rows;
      state.meta[r.sheet] = { fromCache: r.fromCache, time: r.time };
      delete state.errors[r.sheet];
    }
  }
}
/* Uma vista só está disponível se a folha carregada tiver a assinatura
   esperada no cabeçalho. Assim, uma folha apagada ou reestruturada faz
   desaparecer o sub-separador em vez de mostrar os dados de outra folha
   (o Google devolve a 1.ª folha do ficheiro quando o nome não existe). */
function viewAvailable(v) {
  const rows = state.data[resolveSheet(v)];
  if (!rows || !v.expect) return true;   // ainda não carregou, ou sem assinatura
  return rows.slice(0, 12).some(r => r.some(c => v.expect.test(String(c || "").trim())));
}

/* Se a folha principal de uma vista não bater certo, busca os nomes
   alternativos (ex.: o nome antigo do livro dos investidores). */
async function loadAlternates(views, force) {
  const faltam = [];
  for (const v of views) {
    if (!v.alt || !v.alt.length) continue;
    if (viewAvailable(v) && state.data[resolveSheet(v)]) continue;
    for (const a of v.alt) if (force || !state.data[a]) faltam.push(a);
  }
  if (faltam.length) await loadSheets(faltam, force);
}

/* mostra/esconde os sub-separadores conforme as folhas existentes */
function refreshSubtabs(groupId) {
  const g = NAV.find(x => x.id === groupId);
  if (!g || g.views.length < 2) return;
  const bar = document.querySelector(`.subtabs[data-group="${groupId}"]`);
  const disponiveis = g.views.filter(viewAvailable);
  if (bar) {
    bar.querySelectorAll("button[data-view]").forEach(b => {
      b.hidden = !disponiveis.some(v => v.id === b.dataset.view);
    });
    bar.hidden = disponiveis.length < 2;
  }
  /* se a vista aberta deixou de existir, abre a primeira disponível */
  if (disponiveis.length && !disponiveis.some(v => v.id === state.activeView[groupId])) {
    state.activeView[groupId] = disponiveis[0].id;
  }
  g.views.forEach(v => {
    const el = document.getElementById("view-" + v.id);
    if (el) el.style.display = v.id === state.activeView[groupId] ? "" : "none";
  });
  if (bar) bar.querySelectorAll("button[data-view]").forEach(b =>
    b.classList.toggle("on", b.dataset.view === state.activeView[groupId]));
}

/* pinta pela ordem de ALL_VIEWS → cores dos sócios estáveis entre visitas */
function paintViewsFor(sheetNames) {
  const set = new Set(sheetNames);
  for (const view of ALL_VIEWS) {
    if (!set.has(view.sheet)) continue;
    const el = document.getElementById("view-" + view.id);
    if (!el) continue;
    if (state.errors[view.sheet]) el.innerHTML = errorState(view.id);
    else if (state.data[view.sheet] && viewAvailable(view)) paint(view);
  }
  NAV.forEach(g => refreshSubtabs(g.id));
}

async function ensureGroupLoaded(groupId, force) {
  const g = NAV.find(x => x.id === groupId);
  if (!g || g.soon) return;
  const sheets = groupSheets(g);
  if (!sheets.some(s => force || !state.data[s])) return;
  await loadSheets(sheets, force);
  await loadAlternates(g.views, force);
  paintViewsFor([...sheets, ...g.views.flatMap(v => v.alt || [])]);
  setUpdated();
}

async function refreshAll(force) {
  refreshBtn.classList.add("spinning");
  const g = NAV.find(x => x.id === state.activeGroup);
  const sheets = [...new Set([
    ...RESUMO_SHEETS,                 // o dashboard cruza várias folhas
    ...(g ? groupSheets(g) : []),     // a área aberta
    ...Object.keys(state.data),       // e tudo o que já tinha sido carregado
  ])];
  await loadSheets(sheets, force);
  await loadAlternates(ALL_VIEWS, force);
  paintViewsFor([...sheets, ...ALL_VIEWS.flatMap(v => v.alt || [])]);
  setUpdated();
  refreshBtn.classList.remove("spinning");
}

refreshBtn.addEventListener("click", () => refreshAll(true));
/* sino: leva às próximas ações do painel */
document.getElementById("alertBtn").addEventListener("click", () => {
  gotoView("resumo");
  setTimeout(() => document.getElementById("acoes")?.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refreshAll(false); // reabrir a app → dados frescos
});

/* app instalável e a abrir offline */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

refreshAll(false);
</script>
