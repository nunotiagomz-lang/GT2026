/* --- medidor semicircular (utilização da frota) --- */
function medidorHTML(pct) {
  const r = 24, L = Math.PI * r, f = Math.max(0, Math.min(1, pct / 100));
  const cor = pct >= 60 ? "var(--good)" : pct >= 30 ? "var(--warning)" : "var(--serious)";
  const ang = Math.PI * (1 - f);
  const px = 30 + r * Math.cos(ang), py = 30 - r * Math.sin(ang);
  return `<svg viewBox="0 0 60 34" width="66" height="37" role="img" aria-label="${Math.round(pct)}%">
    <path d="M6 30a24 24 0 0 1 48 0" fill="none" stroke="var(--track)" stroke-width="7" stroke-linecap="round"/>
    ${f > 0 ? `<path d="M6 30a24 24 0 0 1 48 0" fill="none" stroke="${cor}" stroke-width="7" stroke-linecap="round"
       stroke-dasharray="${(L * f).toFixed(2)} ${L.toFixed(2)}"/>` : ""}
    <line x1="30" y1="30" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="var(--ink-2)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="2.6" fill="var(--ink-2)"/>
  </svg>`;
}

/* --- evolução financeira: barras de receitas e despesas + linha do resultado.
   Um só eixo (tudo em MZN). Barras ≤ 24px, cantos de 4px só na ponta,
   2px de intervalo; a coluna inteira de cada mês é a área de toque. --- */
function evolucaoHTML(meses) {
  const head = `<div class="card-t">${svgIc("barras")}<h3>Evolução Financeira</h3></div>`;
  const legenda = `<div class="legenda" style="margin:0 0 8px">
      <span><i style="background:var(--s1)"></i>Receitas</span>
      <span><i style="background:var(--s2)"></i>Despesas</span>
      <span><i style="background:var(--s7);height:3px;width:12px;border-radius:2px"></i>Resultado</span></div>`;
  if (meses.length < 1) return `<div class="card">${head}
    <div class="vazio-mini">Ainda sem receitas nem despesas lançadas no livro geral. Os investimentos e os
      adiantamentos não entram aqui — não são operação.</div></div>`;

  const W = 340, H = 196, padL = 44, padR = 6, padT = 8, padB = 22;
  const vals = meses.flatMap(m => [m.receitas, m.despesas, m.resultado]);
  const maxV = Math.max(0, ...vals), minV = Math.min(0, ...vals);
  const passo = passoRedondo(Math.max(maxV - minV, 1), 4);
  const topo = Math.ceil(maxV / passo) * passo || passo, base = Math.floor(minV / passo) * passo;
  const plotH = H - padT - padB, plotW = W - padL - padR;
  const y = v => padT + (topo - v) / (topo - base) * plotH;
  const y0 = y(0);

  let grelha = "";
  for (let v = base; v <= topo + 1e-6; v += passo) {
    grelha += `<line x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"
      stroke="${v === 0 ? "#2b3c5a" : "var(--hairline)"}" stroke-width="1"/>
      <text x="${padL - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${eixoRot(v, passo)}</text>`;
  }
  const gw = plotW / meses.length;
  const barW = Math.max(4, Math.min(24, (gw - 16) / 2));
  const barra = (x, v, cor) => {
    if (!v) return "";
    const yt = y(Math.abs(v)), h = y0 - yt, r = Math.min(4, h);
    return `<path d="M${x.toFixed(1)} ${y0.toFixed(1)}V${(yt + r).toFixed(1)}Q${x.toFixed(1)} ${yt.toFixed(1)} ${(x + r).toFixed(1)} ${yt.toFixed(1)}H${(x + barW - r).toFixed(1)}Q${(x + barW).toFixed(1)} ${yt.toFixed(1)} ${(x + barW).toFixed(1)} ${(yt + r).toFixed(1)}V${y0.toFixed(1)}Z" fill="${cor}"/>`;
  };
  let barras = "", alvos = "", rotulos = "";
  const pts = [];
  meses.forEach((m, i) => {
    const cx = padL + gw * i + gw / 2;
    barras += barra(cx - barW - 1, m.receitas, "var(--s1)") + barra(cx + 1, m.despesas, "var(--s2)");
    pts.push([cx, y(m.resultado)]);
    rotulos += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(m.rotulo)}</text>`;
    alvos += `<rect class="marca" x="${(cx - gw / 2).toFixed(1)}" y="${padT}" width="${gw.toFixed(1)}" height="${plotH}" fill="transparent"
      data-tip="${esc(m.rotulo)}&#10;Receitas: ${fmtMZN(m.receitas)} MZN&#10;Despesas: ${fmtMZN(m.despesas)} MZN&#10;Resultado: ${fmtMZN(m.resultado)} MZN"/>`;
  });
  const linha = pts.length > 1 ? `<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("")}"
      fill="none" stroke="var(--s7)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : "";
  const marcas = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--s7)" stroke="var(--surface)" stroke-width="2"/>`).join("");

  const tabela = `<details class="tabela-ver"><summary>Ver tabela</summary>
    <table><thead><tr><th>Mês</th><th class="num">Receitas</th><th class="num">Despesas</th><th class="num">Resultado</th></tr></thead><tbody>
    ${meses.map(m => `<tr><td>${esc(m.rotulo)}</td><td class="num">${fmtMZN(m.receitas)}</td><td class="num">${fmtMZN(m.despesas)}</td><td class="num">${fmtMZN(m.resultado)}</td></tr>`).join("")}
    </tbody></table></details>`;

  return `<div class="card">${head}${legenda}
    <svg class="eixo" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Receitas, despesas e resultado por mês">
      ${grelha}${barras}${linha}${marcas}${rotulos}${alvos}
    </svg>${tabela}</div>`;
}

/* --- anel com o total ao centro e a legenda em tabela (≤ 6 fatias) --- */
function anelHTML(titulo, icone, fatias, vazio, goto) {
  const total = fatias.reduce((a, f) => a + f.valor, 0);
  const head = `<div class="card-t">${svgIc(icone)}<h3>${esc(titulo)}</h3></div>`;
  if (!total) return `<div class="card">${head}<div class="vazio-mini">${vazio}</div></div>`;
  const R = 50, C = 2 * Math.PI * R, S = 132;
  let off = 0;
  const arcos = fatias.map(f => {
    const frac = f.valor / total;
    const len = Math.max(frac * C - (fatias.length > 1 ? 2 : 0), 0.8);   // 2px de intervalo
    const a = `<circle class="marca" cx="${S / 2}" cy="${S / 2}" r="${R}" fill="none" stroke="${f.cor}" stroke-width="15"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      transform="rotate(-90 ${S / 2} ${S / 2})"
      data-tip="${esc(f.nome)}&#10;${fmtMZN(f.valor)} MZN · ${fmtNumRaw((frac * 100).toFixed(1))}%"/>`;
    off += frac * C;
    return a;
  }).join("");
  return `<div class="card${goto ? " goto" : ""}"${goto ? ` data-goto="${goto}" style="cursor:pointer"` : ""}>${head}
    <div style="display:flex;justify-content:center">
      <svg viewBox="0 0 ${S} ${S}" width="140" height="140" role="img" aria-label="${esc(titulo)}">
        ${arcos}
        <text x="${S / 2}" y="${S / 2 + 2}" text-anchor="middle" font-size="17" font-weight="780" fill="var(--ink)">${fmtMZN(total)}</text>
        <text x="${S / 2}" y="${S / 2 + 17}" text-anchor="middle" font-size="9.5" font-weight="650" fill="var(--ink-muted)">MZN</text>
      </svg>
    </div>
    <table class="leg-tab"><tbody>
      ${fatias.map(f => `<tr><td><i style="background:${f.cor}"></i>${esc(f.nome)}</td>
        <td class="n p">${fmtNumRaw((f.valor / total * 100).toFixed(0))}%</td><td class="n">${fmtMZN(f.valor)}</td></tr>`).join("")}
    </tbody></table>
  </div>`;
}

/* cores das categorias: fixas por categoria (pela ordem de todo o histórico),
   para não mudarem quando se troca o período */
function coresCategorias(movs) {
  const tot = new Map();
  for (const m of movs) if (m.categoria) tot.set(m.categoria, (tot.get(m.categoria) || 0) + m.valor);
  const ordem = [...tot.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
  const mapa = new Map();
  ordem.slice(0, 7).forEach((c, i) => mapa.set(c, CORES_CAT[i]));
  return c => mapa.get(c) || "var(--ink-muted)";
}
function fatiasPorCategoria(movs, cor) {
  const porCat = new Map();
  for (const m of movs) {
    const c = m.categoria || "Sem categoria";
    porCat.set(c, (porCat.get(c) || 0) + m.valor);
  }
  const todas = [...porCat.entries()].map(([nome, valor]) => ({ nome, valor, cor: cor(nome) }))
    .sort((a, b) => b.valor - a.valor);
  const top = todas.slice(0, 5);
  const resto = todas.slice(5).reduce((a, x) => a + x.valor, 0);
  if (resto) top.push({ nome: "Outras", valor: resto, cor: "var(--ink-muted)" });
  return top;
}

/* --- linha de tendência (uma série: sem legenda, o título diz o que é) --- */
function tendenciaHTML(pontos, cor) {
  if (pontos.length < 2) return "";
  const W = 170, H = 62, p = 5;
  const max = Math.max(...pontos.map(x => x.v), 1);
  const xs = i => p + i * (W - 2 * p) / (pontos.length - 1);
  const ys = v => H - p - v / max * (H - 2 * p - 4);
  const d = pontos.map((x, i) => (i ? "L" : "M") + xs(i).toFixed(1) + " " + ys(x.v).toFixed(1)).join("");
  const u = pontos.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="Viagens por mês" style="display:block;margin-top:6px">
    <path d="${d}L${xs(u).toFixed(1)} ${H}L${xs(0).toFixed(1)} ${H}Z" fill="${cor}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${pontos.map((x, i) => `<circle class="marca" cx="${xs(i).toFixed(1)}" cy="${ys(x.v).toFixed(1)}" r="${i === u ? 4 : 10}"
      fill="${i === u ? cor : "transparent"}" ${i === u ? 'stroke="var(--surface)" stroke-width="2"' : ""}
      data-tip="${esc(x.rot)}&#10;${x.v} viage${x.v === 1 ? "m" : "ns"}"/>`).join("")}
  </svg>`;
}

/* ---- o painel ---- */
function renderResumo(rows) {
  const geral = extractGeral(state.data["Movimentos Geral"]) || [];
  const td = tripsData();
  const socios = sociosContas() || [];
  const investidores = (investorRows() && extractMovs(investorRows())) || [];
  const frota = extractViaturas(state.data["Viaturas"]);
  socios.forEach(s => socioColor(s.nome));

  const geralPeriodo = geral.filter(m => inPeriod(m.date, state.period));
  const viagens = td ? tripsInPeriod(td) : [];
  const lim = periodBounds(state.period);

  const conta = movs => {
    const receitas = movs.filter(ehReceita).reduce((a, m) => a + m.valor, 0);
    const despesas = movs.filter(ehDespesa).reduce((a, m) => a + m.valor, 0);
    return { receitas, despesas, resultado: receitas - despesas };
  };
  const atual = conta(geralPeriodo);
  const anterior = lim ? conta(geral.filter(m => entre(m.date, lim.iniAnt, lim.fimAnt))) : null;
  const viagensAnt = lim && td ? td.trips.filter(t => entre(t.date, lim.iniAnt, lim.fimAnt)) : null;

  const emCaixa = geral.filter(m => /caixa|banco/i.test(deaccent(m.meio)));
  const saldoTesouraria = emCaixa.reduce((a, m) => a + (m.entrada ? m.valor : -m.valor), 0);
  const totalInvestido = investidores.reduce((a, m) =>
    classeAdiant(m.tipo) ? a : a + (saidaParaSocio(m.tipo) ? -m.total : m.total), 0);
  const emFalta = socios.filter(s => s.saldo != null && s.saldo < -0.5);
  const valorEmFalta = emFalta.reduce((a, s) => a - s.saldo, 0);
  const adiant = adiantamentosSocios();

  if (!geral.length && !viagens.length && !socios.length && !(td && td.trips.length)) {
    return heroHTML(rotuloPeriodo([])) + emptyState("Ainda sem dados para o painel.",
      "Assim que houver lançamentos nas folhas de contas e viagens, aparecem aqui resumidos.");
  }

  let html = heroHTML(rotuloPeriodo([...geral.map(m => m.date), ...(td ? td.trips.map(t => t.date) : [])]));

  /* ---------- 1. receitas · despesas · resultado ---------- */
  const margemPct = atual.receitas > 0 ? atual.resultado / atual.receitas * 100 : null;
  html += `<div class="grelha g3">` +
    kcHTML({ rotulo: "Receitas", icone: "receitas", cor: "var(--s1)", valor: fmtMZN(atual.receitas),
      trend: anterior ? trendHTML(tendencia(atual.receitas, anterior.receitas)) : "", goto: "contas:correntes" }) +
    kcHTML({ rotulo: "Despesas", icone: "despesas", cor: "var(--s2)", valor: fmtMZN(atual.despesas),
      trend: anterior ? trendHTML(tendencia(atual.despesas, anterior.despesas), false) : "", goto: "contas:correntes" }) +
    kcHTML({ rotulo: "Resultado", icone: "resultado", cor: "var(--s7)",
      valor: `<span style="color:${atual.resultado > 0 ? "var(--good-text)" : atual.resultado < 0 ? "var(--serious)" : "var(--ink)"}">${atual.resultado > 0 ? "+" : ""}${fmtMZN(atual.resultado)}</span>`,
      sub: `Margem: <b style="color:var(--ink)">${margemPct == null ? "—" : fmtNumRaw(margemPct.toFixed(1)) + "%"}</b>`,
      goto: "contas:correntes" }) +
  `</div>`;

  /* ---------- 2. caixa · contribuições · viagens · frota ---------- */
  const usoFrota = (() => {
    if (!frota || !frota.items.length) return null;
    const norm = x => String(x || "").toLowerCase().replace(/[\s\-_.]/g, "");
    const usadas = new Set();
    for (const t of viagens) for (const c of t.row) {
      const n = norm(c);
      if (n) for (const v of frota.items) if (norm(v.mat) === n) usadas.add(v.mat);
    }
    const iEst = findCol(frota.cols, /^estado/i, /situa[çc][ãa]o/i);
    return { total: frota.items.length, usadas, iEst, pct: usadas.size / frota.items.length * 100 };
  })();

  html += `<div class="grelha g4">` +
    ktHTML({ rotulo: "Em caixa e banco", icone: "carteira", goto: "contas:correntes",
      corpo: `<div class="val"${saldoTesouraria < 0 ? ' style="color:var(--serious)"' : ""}>${fmtMZN(saldoTesouraria)}${MZN}</div>
        ${emCaixa.length ? "" : `<div class="sub">sem movimentos de caixa ou banco</div>`}` }) +
    ktHTML({ rotulo: "Contribuições em falta", icone: "pessoas", goto: "contas:investimentos:socios",
      corpo: emFalta.length
        ? `<div class="val" style="color:var(--serious)">${emFalta.length} sócio${emFalta.length > 1 ? "s" : ""}</div>
           <div class="sub" style="display:flex;align-items:center">${fmtMZN(valorEmFalta)} MZN<span class="mais">›</span></div>`
        : `<div class="val" style="color:var(--good-text)">Em dia</div><div class="sub">${socios.length ? "todos os sócios" : "sem sócios"}</div>` }) +
    ktHTML({ rotulo: "Viagens no período", icone: "estrada", goto: "viagens:viagens",
      corpo: `<div class="val">${viagens.length}${(() => {
          const p = viagensAnt ? tendencia(viagens.length, viagensAnt.length) : null;
          return p == null ? "" : ` <small style="color:${p >= 0 ? "var(--good-text)" : "var(--serious)"};font-weight:700">${p >= 0 ? "+" : "−"}${fmtNumRaw(Math.abs(p).toFixed(0))}%</small>`;
        })()}</div>
        <div class="sub">${fmtMZN(viagens.reduce((a, t) => a + (t.km || 0), 0))} km</div>` }) +
    ktHTML({ rotulo: "Utilização da frota", icone: "conta", goto: "viaturas:viaturas",
      corpo: usoFrota
        ? `<div class="gauge"><div class="val">${fmtNumRaw(usoFrota.pct.toFixed(0))}%</div>${medidorHTML(usoFrota.pct)}</div>
           <div class="sub">${usoFrota.usadas.size} de ${usoFrota.total} viaturas com viagens</div>`
        : `<div class="val">—</div><div class="sub">sem folha de viaturas</div>` }) +
  `</div>`;

  /* ---------- 3. evolução financeira · despesas por categoria ---------- */
  const corCat = coresCategorias(geral.filter(ehDespesa));
  const despesasP = geralPeriodo.filter(ehDespesa);
  const invP = geralPeriodo.filter(m => m.tipo === "Investimento");
  const corInv = coresCategorias(geral.filter(m => m.tipo === "Investimento"));
  /* sem despesas no período mas com investimento: o investimento ocupa o lugar
     do anel vazio, em vez de ficar lá em baixo */
  const invEmCima = !despesasP.length && invP.length > 0;
  html += `<div class="grelha gc">` + evolucaoHTML(porMes(geral, 6)) +
    (invEmCima
      ? anelHTML("Investimento por Categoria", "moedas", fatiasPorCategoria(invP, corInv), "", "contas:correntes")
      : anelHTML("Despesas por Categoria", "moedas", fatiasPorCategoria(despesasP, corCat),
          "Sem despesas lançadas neste período.", "contas:correntes")) + `</div>`;

  /* ---------- 4. frota · viagens ---------- */
  let frotaHTML = "";
  if (frota && frota.items.length) {
    let partes;
    if (usoFrota.iEst >= 0) {
      const grupo = e => {
        const s = deaccent(e);
        if (/manut|oficina|avaria|repar/.test(s)) return 1;
        if (/inativ|parad|vendid|abatid|fora/.test(s)) return 2;
        return 0;
      };
      const n = [0, 0, 0];
      frota.items.forEach(v => n[grupo((v.row[usoFrota.iEst] || ""))]++);
      partes = [
        { nome: "Em operação", n: n[0], cor: "var(--good)" },
        { nome: "Em manutenção", n: n[1], cor: "var(--warning)" },
        { nome: "Inativo", n: n[2], cor: "var(--ink-muted)" }];
    } else {
      partes = [
        { nome: "Com viagens no período", n: usoFrota.usadas.size, cor: "var(--good)" },
        { nome: "Sem viagens no período", n: usoFrota.total - usoFrota.usadas.size, cor: "var(--ink-muted)" }];
    }
    const tot = frota.items.length;
    frotaHTML = `<div class="card goto" data-goto="viaturas:viaturas" style="cursor:pointer">
      <div class="card-t">${svgIc("camiao")}<h3>Frota</h3></div>
      <div style="font-size:24px;font-weight:780">${tot} <span style="font-size:14px;font-weight:600;color:var(--ink-2)">${tot === 1 ? "viatura" : "viaturas"}</span></div>
      <div style="display:flex;gap:2px;height:8px;margin-top:10px">
        ${partes.filter(p => p.n).map(p => `<i class="marca" style="flex:${p.n};background:${p.cor};border-radius:999px"
          data-tip="${esc(p.nome)}&#10;${p.n} de ${tot}"></i>`).join("")}
      </div>
      <div class="estado-lista">${partes.map(p => `<div><i style="background:${p.cor}"></i>${esc(p.nome)}<b>${p.n}</b></div>`).join("")}</div>
    </div>`;
  }
  let viagensHTML = "";
  if (td && td.trips.length) {
    const porM = new Map();
    for (const t of td.trips) if (t.date) {
      const k = t.date.getFullYear() * 12 + t.date.getMonth();
      porM.set(k, (porM.get(k) || 0) + 1);
    }
    const chaves = [...porM.keys()].sort((a, b) => a - b);
    const pontos = [];
    if (chaves.length) for (let k = Math.max(chaves[0], chaves[chaves.length - 1] - 5); k <= chaves[chaves.length - 1]; k++) {
      pontos.push({ v: porM.get(k) || 0, rot: MESES_CAP[k % 12] + " " + Math.floor(k / 12) });
    }
    const p = viagensAnt ? tendencia(viagens.length, viagensAnt.length) : null;
    viagensHTML = `<div class="card goto" data-goto="viagens:viagens" style="cursor:pointer">
      <div class="card-t">${svgIc("estrada")}<h3>Viagens &amp; Operação</h3></div>
      <div style="font-size:24px;font-weight:780">${viagens.length} <span style="font-size:14px;font-weight:600;color:var(--ink-2)">viage${viagens.length === 1 ? "m" : "ns"}</span></div>
      ${p == null ? `<div class="sub" style="font-size:12px;color:var(--ink-2);margin-top:4px">${fmtMZN(viagens.reduce((a, t) => a + (t.km || 0), 0))} km no período</div>`
        : `<div style="font-size:12px;margin-top:4px;color:${p >= 0 ? "var(--good-text)" : "var(--serious)"};font-weight:700">${p >= 0 ? "+" : "−"}${fmtNumRaw(Math.abs(p).toFixed(0))}% <span style="color:var(--ink-2);font-weight:500">vs período anterior</span></div>`}
      ${tendenciaHTML(pontos, "var(--s3)")}
    </div>`;
  }
  if (frotaHTML || viagensHTML) html += `<div class="grelha ${frotaHTML && viagensHTML ? "g2" : "gc"}">${frotaHTML}${viagensHTML}</div>`;

  /* ---------- 5. a pagar / a receber · indicadores de gestão ---------- */
  /* o que os clientes devem não depende do período: é tudo o que está em aberto */
  const todas = td ? td.trips : [];
  const aReceberClientes = todas.reduce((a, t) => a + (t.pendente || 0), 0);
  const viagensPorReceber = todas.filter(t => t.pendente > 0.5);
  const recibosPorEntregar = todas.flatMap(t => t.recibosPendentes || []);
  const km = viagens.reduce((a, t) => a + (t.km || 0), 0);
  const codsP = new Set(viagens.map(t => t.cod));
  const custoTrips = viagens.reduce((a, t) => a + (t.despesa || 0), 0);
  const recTrips = viagens.reduce((a, t) => a + (t.receita || 0), 0);
  const custo = custoTrips || geralPeriodo.filter(m => ehDespesa(m) && codsP.has(m.viagem)).reduce((a, m) => a + m.valor, 0);
  const receita = recTrips || geralPeriodo.filter(m => ehReceita(m) && codsP.has(m.viagem)).reduce((a, m) => a + m.valor, 0);
  const indicador = (rot, v, unidade) => `<div><div class="rot">${rot}</div>
    <div class="val">${v == null ? "—" : v}${v != null && unidade ? ` <small>${unidade}</small>` : ""}</div></div>`;
  const mrg = receita > 0 ? (receita - custo) / receita * 100 : null;
  html += `<div class="grelha g2l">
    <div class="card">
      <div class="card-t">${svgIc("documento")}<h3>A Pagar / Receber</h3></div>
      <div class="pr receber goto" data-goto="viagens:viagens">
        <span class="icone" style="--cor:var(--good)">${svgIc("receber")}</span>A receber · clientes
        <b>${fmtMZN(aReceberClientes)} <small style="color:var(--ink-muted)">MZN</small></b><span style="color:var(--ink-muted)">›</span></div>
      ${adiant.sociosDevem > 0.5 ? `<div class="pr receber goto" data-goto="contas:investimentos:adiantamentos">
        <span class="icone" style="--cor:var(--good)">${svgIc("receber")}</span>A receber · sócios
        <b>${fmtMZN(adiant.sociosDevem)} <small style="color:var(--ink-muted)">MZN</small></b><span style="color:var(--ink-muted)">›</span></div>` : ""}
      <div class="pr pagar goto" data-goto="contas:investimentos:adiantamentos">
        <span class="icone" style="--cor:var(--s2)">${svgIc("pagar")}</span>A pagar · sócios
        <b>${fmtMZN(adiant.empresaDeve)} <small style="color:var(--ink-muted)">MZN</small></b><span style="color:var(--ink-muted)">›</span></div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:8px">Clientes: valor combinado das viagens menos o já recebido · sócios: adiantamentos</div>
    </div>
    <div class="card">
      <div class="card-t">${svgIc("barras")}<h3>Indicadores de Gestão</h3></div>
      <div class="ind">
        ${indicador("Margem", mrg == null ? null : fmtNumRaw(mrg.toFixed(1)) + "%")}
        ${indicador("Custo por km", km && custo ? fmtNumRaw((custo / km).toFixed(2)) : null, "MZN")}
        ${indicador("Receita por km", km && receita ? fmtNumRaw((receita / km).toFixed(2)) : null, "MZN")}
      </div>
      <div style="font-size:11px;color:var(--ink-muted);margin-top:10px;text-align:center">
        ${km ? `${fmtMZN(km)} km em ${viagens.length} viage${viagens.length === 1 ? "m" : "ns"}` : "sem quilómetros no período"}${!receita ? " · sem receitas de viagens lançadas" : ""}</div>
    </div>
  </div>`;

  /* ---------- 6. próximas ações ---------- */
  const acoes = [];
  if (emCaixa.length && saldoTesouraria < 0) acoes.push({ goto: "contas:correntes", ic: "alerta", cor: "var(--critical)",
    txt: `Tesouraria negativa (${fmtMZN(saldoTesouraria)} MZN)`, selo: "Urgente", cls: "urgente" });
  const negativas = viagens.filter(t => { const m = tripMargin(t); return m != null && m < 0; });
  if (negativas.length) acoes.push({ goto: "viagens:viagens", ic: "alerta", cor: "var(--serious)",
    txt: `Rever ${negativas.length} viage${negativas.length > 1 ? "ns" : "m"} com margem negativa (${fmtMZN(negativas.reduce((a, t) => a - tripMargin(t), 0))} MZN)`,
    selo: "Atenção", cls: "atencao" });
  if (emFalta.length) acoes.push({ goto: "contas:investimentos:socios", ic: "alerta", cor: "var(--serious)",
    txt: `Regularizar contribuições dos sócios (${fmtMZN(valorEmFalta)} MZN)`, selo: "Pendente", cls: "atencao" });
  if (viagensPorReceber.length) acoes.push({ goto: "viagens:viagens", ic: "relogio", cor: "var(--accent)",
    txt: `Receber ${viagensPorReceber.length} viage${viagensPorReceber.length > 1 ? "ns" : "m"} (${fmtMZN(aReceberClientes)} MZN)`,
    selo: "Pendente", cls: "" });
  if (recibosPorEntregar.length) acoes.push({ goto: "viagens:viagens", ic: "alerta", cor: "var(--warning)",
    txt: `${recibosPorEntregar.length} recibo${recibosPorEntregar.length > 1 ? "s" : ""} do motorista por entregar (${fmtMZN(recibosPorEntregar.reduce((a, m) => a + m.valor, 0))} MZN)`,
    selo: "Pendente", cls: "atencao" });
  const fats = faturasComEstado() || [];
  const vencidasF = fats.filter(f => f.estado === "vencida");
  if (vencidasF.length) acoes.unshift({ goto: "faturacao:faturas:receber", ic: "alerta", cor: "var(--critical)",
    txt: `Cobrar ${vencidasF.length} fatura${vencidasF.length > 1 ? "s" : ""} vencida${vencidasF.length > 1 ? "s" : ""} (${fmtMZN(vencidasF.reduce((a, f) => a + f.pendente, 0))} MZN)`,
    selo: "Urgente", cls: "urgente" });
  const porFaturar = todas.filter(t => !t.faturaNum && (t.combinado || t.recebido));
  if (porFaturar.length) acoes.push({ goto: "faturacao:faturas:faturar", ic: "documento", cor: "var(--accent)",
    txt: `Faturar ${porFaturar.length} viage${porFaturar.length > 1 ? "ns" : "m"} (${fmtMZN(porFaturar.reduce((a, t) => a + (t.combinado || 0), 0))} MZN)`,
    selo: "Pendente", cls: "" });
  if (adiant.sociosDevem > 0.5) acoes.push({ goto: "contas:investimentos:adiantamentos", ic: "relogio", cor: "var(--accent)",
    txt: `Receber adiantamentos dos sócios (${fmtMZN(adiant.sociosDevem)} MZN)`, selo: "Pendente", cls: "" });
  if (adiant.empresaDeve > 0.5) acoes.push({ goto: "contas:investimentos:adiantamentos", ic: "relogio", cor: "var(--accent)",
    txt: `Devolver adiantamentos aos sócios (${fmtMZN(adiant.empresaDeve)} MZN)`, selo: "Pendente", cls: "" });
  const ponto = document.getElementById("alertDot");
  if (ponto) ponto.hidden = !acoes.length;
  html += `<div class="card" id="acoes">
    <div class="card-t">${svgIc("lista")}<h3>Próximas Ações</h3>${acoes.length ? `<span class="extra">${acoes.length}</span>` : ""}</div>
    <div class="acoes">${acoes.length ? acoes.map(a => `<div class="acao goto" data-goto="${a.goto}">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="${a.cor}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC[a.ic]}</svg>
        <span class="txt">${a.txt}</span><span class="selo ${a.cls}">${a.selo}</span>
        <span class="seta">${svgIc("seta", 'style="width:16px;height:16px"')}</span></div>`).join("")
      : `<div class="acao"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="var(--good)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${IC.ok}</svg>
          <span class="txt">Tudo em ordem — sem ações pendentes.</span></div>`}
    </div></div>`;

  /* ---------- 7. investimento por categoria (fora do resultado) ---------- */
  if (invP.length && !invEmCima) {
    html += anelHTML("Investimento por Categoria", "moedas", fatiasPorCategoria(invP, corInv), "",
      "contas:correntes");
  }

  /* ---------- 8. custo das viagens ---------- */
  const daEstrada = geralPeriodo.filter(m => ehDespesa(m) && m.viagem && m.categoria);
  if (daEstrada.length >= 2) {
    html += segbarHTML(fatiasPorCategoria(daEstrada, corCat), "Custo das viagens");
  }

  /* ---------- 9. mapa de calor: categoria × mês ---------- */
  const meses = porMes(geral, 6);
  const topCats = fatiasPorCategoria(despesasP, corCat).filter(f => f.nome !== "Outras").map(f => f.nome);
  if (topCats.length >= 2 && meses.length >= 2) {
    const matriz = {}; let maior = 0;
    topCats.forEach(n => (matriz[n] = {}));
    for (const m of geral) {
      if (!ehDespesa(m) || !m.date || topCats.indexOf(m.categoria) < 0) continue;
      const k = m.date.getFullYear() * 12 + m.date.getMonth();
      matriz[m.categoria][k] = (matriz[m.categoria][k] || 0) + m.valor;
      maior = Math.max(maior, matriz[m.categoria][k]);
    }
    html += heatmapHTML(topCats, meses, matriz, maior);
  }

  /* ---------- 10. sócios ---------- */
  if (socios.length) {
    html += `<div class="card">
        <div class="card-t">${svgIc("pessoas")}<h3>Sócios</h3>
          ${totalInvestido ? `<span class="extra">investido: <b style="color:var(--ink)">${fmtMZN(totalInvestido)} MZN</b></span>` : ""}</div>
        <div class="glance">` + socios.map(s => {
          const credor = s.saldo != null && s.saldo > 0.5;
          const emDia = s.saldo != null && Math.abs(s.saldo) <= 0.5;
          const cor = credor ? "var(--good-text)" : emDia ? "var(--ink)" : "var(--serious)";
          return `<div class="goto glance-item" data-goto="contas:investimentos:socios" style="cursor:pointer">
            <div class="avatar" style="background:${socioColor(s.nome)};width:38px;height:38px;font-size:14px">${esc(s.nome.slice(0, 2).toUpperCase())}</div>
            <div class="g-name">${esc(s.nome)}</div>
            <div class="g-saldo" style="color:${cor}">${fmtMZN(s.saldo)}</div>
          </div>`;
        }).join("") + `</div>
        <div style="font-size:10.5px;color:var(--ink-muted);text-align:center;margin-top:8px">
          Saldo de capital em MZN · positivo = a receber · negativo = falta contribuir</div>
      </div>`;
  }

  /* ---------- 11. últimos movimentos ---------- */
  if (geral.length) {
    html += `<div class="card"><div class="card-t">${svgIc("lista")}<h3>Últimos movimentos</h3></div>` +
      geral.slice(-4).reverse().map(m => `<div class="mov">
        <div class="m-main">
          <div class="m-item" style="font-size:13px">${esc(m.desc || m.categoria || "(sem descrição)")}</div>
          <div class="m-date">${[m.data, m.tipo, m.categoria].filter(Boolean).map(esc).join(" · ")}</div>
        </div>
        <div class="m-side">
          <div class="m-val" style="font-size:13px;color:${m.entrada ? "var(--good-text)" : "var(--ink)"}">
            ${m.entrada ? "+" : "−"}${fmtMZN(m.valor)}</div>
        </div>
      </div>`).join("") +
      `<div class="goto" data-goto="contas:correntes" style="text-align:center;padding:10px 0 2px;font-size:13px;font-weight:650;color:var(--accent-text);cursor:pointer">Ver todos os movimentos ›</div>
    </div>`;
  }
  return html;
}

let movFilter = "Todos";   // sócio
let movTipo = "Todos";     // Investimento / Despesa / Suprimento / Recebimento
let movCat = null;         // categoria escolhida na vista Categorias

function renderMovimentos(rows) {
  const movs = extractMovs(rows);
  if (movs == null) return renderAuto(rows);
  if (!movs.length) return emptyState("Ainda não há movimentos registados.");

  /* sócios presentes, pela ordem da folha de contas correntes */
  const ordem = socioNames();
  const presentes = [...new Set(movs.flatMap(m => m.pagadores.map(p => p.por)))];
  const socios = [...ordem.filter(n => presentes.includes(n)),
                  ...presentes.filter(n => !ordem.includes(n))];
  socios.forEach(socioColor); // fixa a ordem das cores

  const shown = movs.filter(m =>
    (movFilter === "Todos" || m.pagadores.some(p => p.por === movFilter)) &&
    (movTipo === "Todos" || tipoNorm(m.tipo) === movTipo) &&
    (!movCat || m.categoria === movCat));
  /* com filtro de sócio ativo, conta apenas a parte desse sócio */
  const valorDe = m => movFilter === "Todos" ? m.total
    : (m.pagadores.find(p => p.por === movFilter)?.val ?? 0);
  const total = shown.reduce((s, m) => s + valorDe(m), 0);

  const chips = ["Todos", ...socios].map(s =>
    `<button class="${movFilter === s ? "on" : ""}" data-socio="${esc(s)}">
       ${s !== "Todos" ? `<span class="dot" style="background:${socioColor(s)}"></span>` : ""}${esc(s)}
     </button>`).join("");

  const tipos = movs.hasTipo
    ? [...new Set(movs.map(m => tipoNorm(m.tipo)).filter(Boolean))] : [];
  const tipoChips = tipos.length ? `<div class="filters" id="movTipos">
    ${["Todos", ...tipos].map(t => `<button class="${movTipo === t ? "on" : ""}" data-tipo="${esc(t)}">
      ${t !== "Todos" && TIPO_COR[t] ? `<span class="dot" style="background:${TIPO_COR[t]}"></span>` : ""}${esc(t)}
    </button>`).join("")}</div>` : "";

  const catAtiva = movCat ? `<div class="card" style="display:flex;align-items:center;gap:8px;padding:10px 14px">
      <span style="font-size:12px;color:var(--ink-2)">Categoria:</span>
      <b style="font-size:13px;flex:1">${esc(movCat)}</b>
      <button data-cat-clear class="chip" style="cursor:pointer;font-size:12px;padding:6px 11px">Limpar ✕</button>
    </div>` : "";

  const list = shown.map(m => {
    const v = valorDe(m);
    const tn = tipoNorm(m.tipo);
    const payers = m.pagadores.map(p =>
      `<span class="chip" style="${movFilter === p.por ? "border-color:" + socioColor(p.por) : ""}">
        <span class="dot" style="background:${socioColor(p.por)}"></span>${esc(p.por)}${m.pagadores.length > 1 ? ` · ${fmtMZN(p.val)}` : ""}
      </span>`).join("");
    const marcas = [
      tn ? `<span class="chip" style="font-size:10.5px;padding:3px 7px">${TIPO_COR[tn] ? `<span class="dot" style="background:${TIPO_COR[tn]}"></span>` : ""}${esc(tn)}</span>` : "",
      m.categoria ? `<span class="chip" style="font-size:10.5px;padding:3px 7px">${esc(m.categoria)}</span>` : "",
      m.viagem ? `<span class="chip" data-viagem-cod="${esc(m.viagem)}" style="font-size:10.5px;padding:3px 7px;cursor:pointer;border-color:var(--accent);color:var(--accent-text)">${esc(m.viagem)} ›</span>` : "",
    ].filter(Boolean).join("");
    return `<div class="mov" style="flex-wrap:wrap">
      <div class="m-main">
        <div class="m-item">${esc(m.item)}</div>
        ${m.desc ? `<div class="m-desc">${esc(m.desc)}</div>` : ""}
        ${m.data ? `<div class="m-date">${esc(m.data)}</div>` : ""}
      </div>
      <div class="m-side">
        <div class="m-val">${fmtMZN(v)} <small style="font-weight:600;color:var(--ink-muted)">MZN</small></div>
        ${v !== m.total ? `<div style="font-size:11px;color:var(--ink-muted);margin-top:2px">de ${fmtMZN(m.total)} no total</div>` : ""}
      </div>
      <div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px;margin-top:7px">${marcas}${payers}</div>
    </div>`;
  }).join("");

  const rotulo = [movFilter !== "Todos" && movFilter, movTipo !== "Todos" && movTipo]
    .filter(Boolean).join(" · ");

  return `<div class="filters" id="movFilters">${chips}</div>${tipoChips}${catAtiva}
    <div class="card" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <span style="font-size:12px;color:var(--ink-2)">${shown.length} movimento${shown.length === 1 ? "" : "s"}${rotulo ? " · " + esc(rotulo) : ""}</span>
      <b style="font-size:16px;font-variant-numeric:tabular-nums">${fmtMZN(total)} <small style="font-size:11px;color:var(--ink-muted)">MZN</small></b>
    </div>
    ${shown.length ? `<div class="card">${list}</div>` : emptyState("Sem movimentos com estes filtros.")}
    ${!movs.hasTipo ? `<p style="font-size:11px;color:var(--ink-muted);text-align:center;margin:4px 8px 8px;line-height:1.5">
      Acrescenta as colunas <b>Tipo</b> (Investimento / Despesa / Suprimento) e <b>Categoria</b>
      a esta folha para separares o que é investimento do que é despesa.</p>` : ""}`;
}

/* =====================================================================
   CONTAS — duas vistas: Investimentos (sócios) e Movimentos Correntes
   ===================================================================== */
const contasNav = { investimentos: "socios", correntes: "movimentos", faturas: "faturas" };

/* seletor interno de uma vista (pílulas) */
function pillBar(grupo, opcoes, ativa) {
  return `<div class="filters" data-pills="${esc(grupo)}">
    ${opcoes.map(o => `<button class="${o.id === ativa ? "on" : ""}" data-pill="${esc(o.id)}">${esc(o.label)}</button>`).join("")}
  </div>`;
}

/* --- Investimentos: tudo o que diz respeito aos sócios --- */
function renderInvestimentos(rows) {
  const sub = contasNav.investimentos;
  const bar = pillBar("investimentos", [
    { id: "socios", label: "Capital" },
    { id: "adiantamentos", label: "Adiantamentos" },
    { id: "movimentos", label: "Movimentos" },
    { id: "acertos", label: "Acertos" },
  ], sub);

  if (sub === "adiantamentos") return bar + renderAdiantamentos(rows);

  if (sub === "socios") {
    const socRows = state.data["Sócios - Contas Correntes"];
    return bar + (socRows ? renderSocios(socRows)
      : emptyState("Sem folha de sócios.", "A folha «Sócios - Contas Correntes» ainda não foi carregada."));
  }
  if (sub === "acertos") {
    const acRows = state.data["Acertos entre Sócios"];
    return bar + (acRows ? renderAcertos(acRows)
      : emptyState("Sem acertos registados."));
  }
  return bar + renderMovimentos(rows);
}

/* --- Movimentos Correntes: contabilidade e tesouraria da empresa --- */
let geralTipo = "Todos";
let geralCat = null;

function renderCorrentes(rows) {
  const sub = contasNav.correntes;
  const bar = pillBar("correntes", [
    { id: "movimentos", label: "Movimentos" },
    { id: "categorias", label: "Categorias" },
  ], sub);

  const movs = extractGeral(rows);
  if (!movs) return bar + emptyState("Folha «Movimentos Geral» por criar.",
    "É a folha onde entram todos os movimentos da empresa. O formulário de Lançamento de Contas cria as linhas por ti.");
  if (!movs.length) return bar + emptyState("Ainda não há movimentos lançados.");

  const noPeriodo = movs.filter(m => inPeriod(m.date, state.period));
  return bar + periodBar() +
    (sub === "categorias" ? geralCategoriasHTML(noPeriodo) : geralMovimentosHTML(movs, noPeriodo));
}

function geralMovimentosHTML(movs, noPeriodo) {
  const shown = noPeriodo.filter(m =>
    (geralTipo === "Todos" || m.tipo === geralTipo) &&
    (!geralCat || m.categoria === geralCat));

  const entradas = shown.filter(m => m.entrada).reduce((a, m) => a + m.valor, 0);
  const saidas = shown.filter(m => !m.entrada).reduce((a, m) => a + m.valor, 0);
  const saldo = entradas - saidas;

  const tipos = [...new Set(noPeriodo.map(m => m.tipo).filter(Boolean))];
  const tipoChips = tipos.length ? `<div class="filters" data-geral-tipos>
    ${["Todos", ...tipos].map(t => `<button class="${geralTipo === t ? "on" : ""}" data-gtipo="${esc(t)}">
      ${t !== "Todos" && TIPO_COR[t] ? `<span class="dot" style="background:${TIPO_COR[t]}"></span>` : ""}${esc(t)}
    </button>`).join("")}</div>` : "";

  const catAtiva = geralCat ? `<div class="card" style="display:flex;align-items:center;gap:8px;padding:10px 14px">
      <span style="font-size:12px;color:var(--ink-2)">Categoria:</span>
      <b style="font-size:13px;flex:1">${esc(geralCat)}</b>
      <button data-gcat-clear class="chip" style="cursor:pointer;font-size:12px;padding:6px 11px">Limpar ✕</button>
    </div>` : "";

  const tesouraria = `<div class="card">
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <div><div style="font-size:11px;color:var(--ink-muted)">Entradas</div>
        <b style="font-size:17px;color:var(--good-text)">${fmtMZN(entradas)}</b></div>
      <div><div style="font-size:11px;color:var(--ink-muted)">Saídas</div>
        <b style="font-size:17px;color:var(--serious)">${fmtMZN(saidas)}</b></div>
      <div><div style="font-size:11px;color:var(--ink-muted)">Saldo</div>
        <b style="font-size:17px;color:${saldo >= 0 ? "var(--ink)" : "var(--serious)"}">${fmtMZN(saldo)}</b></div>
      <div style="margin-left:auto;align-self:flex-end;font-size:11.5px;color:var(--ink-muted)">
        ${shown.length} movimento${shown.length === 1 ? "" : "s"}</div>
    </div>
  </div>`;

  const list = shown.map(m => {
    const marcas = [
      m.tipo ? `<span class="chip" style="font-size:10.5px;padding:3px 7px">${TIPO_COR[m.tipo] ? `<span class="dot" style="background:${TIPO_COR[m.tipo]}"></span>` : ""}${esc(m.tipo)}</span>` : "",
      m.categoria ? `<span class="chip" style="font-size:10.5px;padding:3px 7px">${esc(m.categoria)}</span>` : "",
      m.meio ? `<span class="chip" style="font-size:10.5px;padding:3px 7px">${esc(m.meio)}</span>` : "",
      m.viagem ? `<span class="chip" data-viagem-cod="${esc(m.viagem)}" style="font-size:10.5px;padding:3px 7px;cursor:pointer;border-color:var(--accent);color:var(--accent-text)">${esc(m.viagem)} ›</span>` : "",
    ].filter(Boolean).join("");
    return `<div class="mov" style="flex-wrap:wrap">
      <div class="m-main">
        <div class="m-item">${esc(m.desc || m.categoria || "(sem descrição)")}</div>
        ${m.quem ? `<div class="m-desc">${esc(m.quem)}</div>` : ""}

      </div>

  return tipoChips + catAtiva + tesouraria +
    (shown.length ? `<div class="card">${list}</div>` : emptyState("Sem movimentos com estes filtros."));
}

function geralCategoriasHTML(movs) {
  const saidas = movs.filter(m => !m.entrada);
  if (!saidas.length) return emptyState("Sem saídas no período.");
  const porCat = new Map();
  for (const m of saidas) {
    const c = m.categoria || "Sem categoria";
    if (!porCat.has(c)) porCat.set(c, { total: 0, n: 0 });
    const e = porCat.get(c);
    e.total += m.valor; e.n++;
  }
  const lista = [...porCat.entries()].sort((a, b) => b[1].total - a[1].total);
  const maior = lista[0][1].total || 1;
  const soma = lista.reduce((a, [, e]) => a + e.total, 0);

      <b style="font-size:16px;font-variant-numeric:tabular-nums">${fmtMZN(soma)} <small style="font-size:11px;color:var(--ink-muted)">MZN</small></b>
    </div>
    <div class="card">` + lista.map(([c, e], i) => `
      <div data-gcat="${esc(c)}" style="cursor:pointer;padding:9px 0;${i < lista.length - 1 ? "border-bottom:1px solid var(--hairline)" : ""}">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px">

  if (!movs.length) return emptyState("Ainda não há movimentos registados.");

  if (!movs.hasCat && !movs.hasTipo) {
    return `<div class="state">
      <div class="icon">🏷️</div>

         (Camião, Combustível, Portagens, Motorista, Manutenção…).</p>

  /* por tipo */
  if (movs.hasTipo) {
    const porTipo = new Map();
    for (const m of movs) {

    html += `<div class="section-title">Por tipo</div><div class="card">` +

            <b style="font-weight:650">${esc(t)}</b></span>
          <b style="font-variant-numeric:tabular-nums;white-space:nowrap">${fmtMZN(v)} <small style="font-weight:600;color:var(--ink-muted)">MZN</small></b>
        </div>
        <div class="bar" style="height:6px;margin-top:6px"><i style="width:${v / soma * 100}%;background:${TIPO_COR[t] || "var(--accent)"}"></i></div>
      </div>`).join("") + `</div>`;
  }

  /* por categoria */
  if (movs.hasCat) {
    const porCat = new Map();
    for (const m of movs) {
      const c = m.categoria || "Sem categoria";
      if (!porCat.has(c)) porCat.set(c, { total: 0, n: 0 });
      const e = porCat.get(c);
      e.total += m.total; e.n++;
    }

/* --- Adiantamentos e devoluções ---
   Saldo de cada sócio, nos dois sentidos: positivo = a empresa deve-lhe,
   negativo = ele deve à empresa. Tudo desde o início (o pendente é
   cumulativo, por isso o filtro de período não se aplica aqui). */
function adiantamentosSocios(rows) {
  const fonte = rows || investorRows();
  const movs = (fonte && extractMovs(fonte)) || [];
  const por = new Map();
  const linhas = [];
  for (const m of movs) {
    const cl = classeAdiant(m.tipo);
    if (!cl) continue;
    linhas.push({ ...m, classe: cl });
    for (const p of m.pagadores) {
      if (!por.has(p.por)) por.set(p.por, { nome: p.por, do: 0, despesa: 0, devDo: 0, ao: 0, devAo: 0 });
      por.get(p.por)[cl] += p.val;
    }
  }
  const ordem = socioNames();
  const socios = [...por.values()].map(e => ({ ...e,
    saldo: e.do + e.despesa + e.devDo - e.ao - e.devAo }))
    .sort((a, b) => (ordem.indexOf(a.nome) + 1 || 99) - (ordem.indexOf(b.nome) + 1 || 99));
  return {
    socios, linhas,
    empresaDeve: socios.reduce((a, s) => a + Math.max(0, s.saldo), 0),
    sociosDevem: socios.reduce((a, s) => a + Math.max(0, -s.saldo), 0),
  };
}

/* --- Viagens: lista → detalhe → abastecimentos ---
   A folha "Viagens" tem uma linha por viagem. A lista mostra os campos
   principais; tocar numa viagem abre o detalhe completo, e daí o botão
   "Abastecimentos" abre a folha com o código da viagem no ficheiro
   "Planilha de Abastecimentos CNET". */
const viagemNav = { mode: "lista", sel: null };
const abastCache = {};

/* Código canónico da viagem. A coluna "VF" pode conter só o número (50)
   ou já o código completo (VF50); em ambos os casos fica "VF50", que é
   como as folhas da planilha de abastecimentos estão nomeadas. */
function tripCode(raw) {
  const s = String(raw || "").trim();
  if (!s) return "";
  const m = s.match(/^(?:vf[\s\-_]*)?0*(\d+)$/i);
  return m ? "VF" + m[1] : s;
}

function extractViagens(rows) {
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 8); i++) {
    if (rows[i].some(c => /c[óo]digo|^\s*vf\s*$/i.test(c || ""))) { h = i; break; }
  }
  if (h < 0) {
    let best = 0;
    rows.slice(0, 8).forEach((r, i) => {
      const filled = r.filter(c => c && c.trim()).length;
      if (filled > best) { best = filled; h = i; }
    });
    if (best < 2) return null;
  }
  const cols = rows[h].map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  if (!cols.length) return null;
  /* coluna do código: cabeçalho "VF" ou "Código"; senão, a coluna cujos
     valores têm o formato VF+número (os códigos são sempre VF##) */
  let iCod = cols.find(c => /^vf$/i.test(c.name) || /c[óo]digo/i.test(c.name))?.i;
  if (iCod == null) {
    for (const c of cols) {
      const vals = rows.slice(h + 1, h + 6).map(r => (r[c.i] || "").trim()).filter(Boolean);
      if (vals.length && vals.every(v => /^vf[-\s]?\d+/i.test(v))) { iCod = c.i; break; }
    }
  }
  if (iCod == null) iCod = cols[0].i;
  const trips = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const raw = (r[iCod] || "").trim();
    if (/^TOTAL/i.test(raw)) continue;
    if (!raw && r.filter(c => c && c.trim()).length < 2) continue;
    trips.push({ cod: tripCode(raw), row: r });
  }
  return { cols, iCod, trips };
}

/* Campos preferidos na lista, por ordem. Cada campo tem as suas alternativas
   também por ordem: as ancoradas primeiro, porque uma folha com "Tipo Viatura"
   (trailer/rígido) antes da "Viatura" mostrava o tipo em vez da matrícula. */
const VG_PRIOR = [
  [/data|partida/i],
  [/^matr[íi]cula/i, /^viatura/i, /^ve[íi]culo/i, /matr[íi]cula|viatura/i],
  [/^motorista/i, /motorista|condutor/i],
  [/^(trajec?to|rota|percurso|itiner)/i, /^destino/i, /^prov[íìi]ncia/i,
   /rota|origem|destino|percurso|prov[íìi]ncia/i],
  [/^cliente/i, /cliente/i],
  [/^estado/i, /estado|situa/i],
];

/* ---------- utilitários de colunas e datas ---------- */
function findCol(cols, ...patterns) {
  for (const p of patterns) {
    const c = cols.find(c => p.test(c.name));
    if (c) return c.i;
  }
  return -1;
}
function parseDate(s) {
  const m = String(s || "").trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (!m) return null;
  let y = +m[3]; if (y < 100) y += 2000;
  const d = new Date(y, +m[2] - 1, +m[1]);
  return isNaN(d.getTime()) ? null : d;
}

const PERIODS = [
  { id: "all", label: "Tudo" },
  { id: "m",   label: "Este mês" },
  { id: "3m",  label: "3 meses" },
  { id: "y",   label: "Este ano" },
];
function inPeriod(d, period) {
  if (period === "all" || !d) return true;
  const now = new Date();
  if (period === "m")  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  if (period === "y")  return d.getFullYear() === now.getFullYear();
  if (period === "3m") { const lim = new Date(now); lim.setMonth(lim.getMonth() - 3); return d >= lim; }
  return true;
}

/* ---------- viagens enriquecidas (base de toda a área operacional) ---------- */
function tripsData() {
  const rows = state.data["Viagens"];
  if (!rows) return null;
  const vg = extractViagens(rows);
  if (!vg) return null;
  const C = vg.cols;
  const ix = {
    data:      findCol(C, /^partida$/i, /data.*partida/i, /^data$/i, /data/i),
    motorista: findCol(C, /motorista|condutor/i),
    /* ancorado no início: há folhas com "Tipo Viatura" (trailer/rígido) antes
       da coluna "Viatura" com a matrícula — sem isto vinha o tipo, não a chapa */
    viatura:   findCol(C, /^matr[íi]cula/i, /^viatura/i, /^ve[íi]culo/i,
                          /matr[íi]cula|viatura|ve[íi]culo|camia/i),
    cliente:   findCol(C, /cliente/i),
    /* trajecto: uma coluna própria se existir, senão Destino (+ Província) */
    rota:      findCol(C, /^(trajec?to|rota|percurso|itiner)/i, /^destino/i,
                          /prov[íìi]ncia/i, /rota|percurso|destino/i),
    provincia: findCol(C, /^prov[íìi]ncia/i),
    km:        findCol(C, /^km$/i, /km\s*(percorrid|total|viagem)/i, /quil[óo]metr/i),
    combinado: findCol(C, /valor\s*combinado|^rate|tarifa|pre[çc]o\s*(acordado|combinado)/i),
    fatura:    findCol(C, /^(factura|fatura)/i),
    receita:   findCol(C, /receita|frete|faturad/i, /valor\s*(da\s*)?(viagem|servi|frete)/i),
    despesa:   findCol(C, /despesas?\s*total/i, /^despesas?/i),
    saldoMot:  findCol(C, /saldo\s*final\s*motorista/i, /saldo\s*motorista/i),
    estado:    findCol(C, /estado|situa/i),
  };
  const get = (r, i) => i >= 0 ? (r[i] || "").trim() : "";
  const num = (r, i) => i >= 0 ? parseNum(r[i]) : null;
  const trips = vg.trips.map((t, idx) => ({
    idx, cod: t.cod, row: t.row,
    dataTxt:   get(t.row, ix.data),
    date:      parseDate(get(t.row, ix.data)),
    motorista: get(t.row, ix.motorista),
    viatura:   get(t.row, ix.viatura),
    cliente:   get(t.row, ix.cliente),
    rota:      (function () {
                 const r = get(t.row, ix.rota), pr = get(t.row, ix.provincia);
                 return pr && pr !== r ? (r ? r + ", " + pr : pr) : r;
               })(),
    estado:    get(t.row, ix.estado),
    km:        num(t.row, ix.km),
    combinado: num(t.row, ix.combinado),
    faturaCol: get(t.row, ix.fatura),
    receitaCol: num(t.row, ix.receita),
    despesaCol: num(t.row, ix.despesa),
    saldoMot:  num(t.row, ix.saldoMot),
  }));
  ligarAoLivroGeral(trips);
  return { cols: C, ix, trips,
    hasReceita: ix.combinado >= 0 || ix.receita >= 0 || trips.some(t => t.recebido > 0),
    hasKm: ix.km >= 0 };
}

/* Cada viagem vê os movimentos do livro geral com o seu VF:
   - recebido = recebimentos; pendente = combinado − recebido;
   - custos   = despesas (se houver no livro; senão a coluna «Despesas Total»);
   - recibos  = despesas que precisam de recibo e o estado de cada uma.
   A receita da viagem é o valor combinado (o que se vai faturar); sem ele,
   a coluna de receita da folha; sem ela, o que já se recebeu. */
const RE_PRECISA_RECIBO = /combust|manuten|portage|estadia|alojament|hotel|pernoit|parque|oficina|pneu/;
function precisaRecibo(m) {
  const c = deaccent(m.categoria);
  return !/diari/.test(c) && RE_PRECISA_RECIBO.test(c);
}
function ligarAoLivroGeral(trips) {
  const geral = extractGeral(state.data["Movimentos Geral"]) || [];
  const faturas = new Map((extractFaturas(state.data["Faturas"]) || []).map(f => [f.vf, f]));
  const porVF = new Map();
  for (const m of geral) if (m.viagem) {
    if (!porVF.has(m.viagem)) porVF.set(m.viagem, []);
    porVF.get(m.viagem).push(m);
  }
  for (const t of trips) {
    const movs = porVF.get(tripCode(t.cod)) || [];
    const receb = movs.filter(m => m.entrada && /receb/i.test(m.tipo));
    const desp = movs.filter(ehDespesa);
    t.movs = movs;
    t.recebimentos = receb;
    t.recebido = receb.reduce((a, m) => a + m.valor, 0);
    t.custos = desp;
    const custoLivro = desp.reduce((a, m) => a + m.valor, 0);
    t.despesa = custoLivro || t.despesaCol;
    /* fatura: da folha Faturas, ou só o nº na coluna Factura da viagem.
       Sem valor combinado, a viagem fica com o valor da fatura. */
    t.fatura = faturas.get(tripCode(t.cod)) || null;
    t.faturaNum = t.fatura ? t.fatura.numero : (t.faturaCol || "");
    if (t.combinado == null && t.fatura) t.combinado = t.fatura.valor;
    t.receita = t.combinado ?? t.receitaCol ?? (t.recebido || null);
    t.pendente = t.combinado != null ? Math.max(0, t.combinado - t.recebido) : null;
    t.estadoPag = t.combinado == null
      ? (t.recebido > 0 ? "recebido" : "sem")
      : t.recebido >= t.combinado - 0.5 ? "pago" : t.recebido > 0 ? "parcial" : "receber";
    /* recibos: só as despesas que os precisam (as diárias não têm) e que já
       têm o estado marcado — as antigas, sem coluna Recibo, não contam */
    const comRecibo = desp.filter(m => precisaRecibo(m) && m.recibo);
    t.recibosEntregues = comRecibo.filter(m => /entregue/i.test(m.recibo));
    t.recibosPendentes = comRecibo.filter(m => /por\s*entregar|pendente|^n[ãa]o/i.test(deaccent(m.recibo)));
  }
}
const ESTADO_PAG = {
  pago:     { rot: "Concluído",   cls: "good",    cor: "var(--good)" },
  parcial:  { rot: "Parcial",     cls: "atencao", cor: "var(--warning)" },
  receber:  { rot: "Por receber", cls: "",        cor: "var(--serious)" },
  recebido: { rot: "Recebido",    cls: "",        cor: "var(--accent)" },
  sem:      { rot: "Sem valor combinado", cls: "", cor: "var(--ink-muted)" },
};
/* viagens dentro do período escolhido */
function tripsInPeriod(td) {
  return td.trips.filter(t => inPeriod(t.date, state.period));
}
function tripMargin(t) {
  if (t.receita == null) return null;
  return t.receita - (t.despesa || 0);
}

/* agrupa viagens por motorista / cliente / viatura */
function entityStats(trips, key) {
  const map = new Map();
  for (const t of trips) {
    const v = (t[key] || "").trim();
    if (!v) continue;
    if (!map.has(v)) map.set(v, { nome: v, trips: [], receita: 0, despesa: 0, km: 0 });
    const e = map.get(v);
    e.trips.push(t);
    e.receita += t.receita || 0;
    e.despesa += t.despesa || 0;
    e.km += t.km || 0;
  }
  return [...map.values()].sort((a, b) => b.trips.length - a.trips.length);
}

/* ---------- acertos entre sócios ---------- */
function extractAcertos(rows) {
  if (!rows) return [];
  const h = findHeaderRow(rows, "Data");
  if (h < 0) return [];
  const cols = rows[h].map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  const iDe = findCol(cols, /^de\b|quem\s*pagou/i);
  const iPara = findCol(cols, /^para\b|quem\s*recebeu/i);
  const iVal = findCol(cols, /^valor/i, /montante/i);
  if (iDe < 0 || iPara < 0 || iVal < 0) return [];
  const out = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const val = parseNum(r[iVal]);
    const de = (r[iDe] || "").trim(), para = (r[iPara] || "").trim();
    if (val == null || val === 0 || !de || !para) continue;
    out.push({ de, para, val });
  }
  return out;
}

/* devoluções de capital e dividendos saem do sócio: contam ao contrário */
function saidaParaSocio(tipo) {
  if (classeAdiant(tipo)) return false;      // adiantamentos têm conta própria
  return /devolu|dividend|reembols|levantament|retirad/.test(deaccent(tipo));
}

/* ---------- contas correntes dos sócios ----------
   Calculadas a partir da soma do livro «Movimentos dos Investidores»
   (o livro geral da empresa não entra aqui):
     pago  = soma da coluna do sócio
     quota = total investido × participação do sócio
     saldo = pago + acertos − quota
   Saldo positivo = pôs mais do que lhe cabia e é credor. */
function sociosContas() {
  const base = extractSocios(state.data["Sócios - Contas Correntes"]);
  if (!base || !base.length) return null;
  const movs = extractMovs(investorRows());
  if (!movs || !movs.length) return base;   // sem movimentos, fica o que a folha diz

  /* participação: da folha; se faltar a algum, divide-se por igual */
  const fracoes = base.map(s => {
    const p = parseNum(s.part);
    return p != null && p > 0 ? p / 100 : null;
  });
  const porIgual = fracoes.some(f => f == null);

  const pago = new Map(base.map(s => [s.nome, 0]));
  let total = 0;
  for (const m of movs) {
    if (classeAdiant(m.tipo)) continue;     // adiantamentos não são capital
    const sinal = saidaParaSocio(m.tipo) ? -1 : 1;
    for (const p of m.pagadores) {
      if (!pago.has(p.por)) continue;       // pagador que não é sócio
      pago.set(p.por, pago.get(p.por) + sinal * p.val);
      total += sinal * p.val;
    }
  }

  /* acertos: quem pagou fica com mais crédito, quem recebeu com menos */
  const ajuste = new Map(base.map(s => [s.nome, 0]));
  for (const a of extractAcertos(state.data["Acertos entre Sócios"])) {
    if (ajuste.has(a.de)) ajuste.set(a.de, ajuste.get(a.de) + a.val);
    if (ajuste.has(a.para)) ajuste.set(a.para, ajuste.get(a.para) - a.val);
  }

  return base.map((s, i) => {
    const fr = porIgual ? 1 / base.length : fracoes[i];
    const quota = total * fr;
    const pg = pago.get(s.nome) || 0;
    const aj = ajuste.get(s.nome) || 0;
    return { ...s, pago: pg, quota, ajuste: aj, saldo: pg + aj - quota,
             total, calculado: true };
  });
}

/* ---------- livro geral (contabilidade e tesouraria) ----------
   Uma linha por movimento, com um valor único. O sentido (entrada ou
   saída de dinheiro) vem da coluna própria, se existir, senão do tipo. */
function extractGeral(rows) {
  if (!rows) return null;
  const h = findHeaderRow(rows, "Data");
  if (h < 0) return null;
  const cols = rows[h].map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  if (!cols.length) return null;
  const ix = {
    data:    findCol(cols, /^data$/i, /data/i),
    tipo:    findCol(cols, /^tipo$/i),
    cat:     findCol(cols, /categoria/i),
    desc:    findCol(cols, /descri/i, /^item$/i, /nota/i),
    valor:   findCol(cols, /^valor/i, /montante/i),
    sentido: findCol(cols, /sentido|natureza|entrada/i),
    meio:    findCol(cols, /^meio/i, /forma\s*de\s*pagamento/i, /^conta$/i),
    quem:    findCol(cols, /pago\s*por|respons|contraparte|fornecedor/i),
    vf:      findCol(cols, /^\s*(vf|viagem)\s*$/i),
    recibo:  findCol(cols, /^recibo/i),
  };
  const get = (r, i) => i >= 0 ? (r[i] || "").trim() : "";
  const movs = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const valor = ix.valor >= 0 ? parseNum(r[ix.valor]) : null;
    if (valor == null || valor === 0) continue;
    const desc = get(r, ix.desc);
    if (/^TOTAL/i.test(desc)) continue;
    const tipo = tipoNorm(get(r, ix.tipo));
    const sTxt = deaccent(get(r, ix.sentido));
    /* entrada = dinheiro que chega; saída = dinheiro que sai */
    const cl = classeAdiant(tipo);
    const entrada = sTxt ? /entrada|receb|credito|\+/.test(sTxt)
                         : cl ? ADIANT_DO_SOCIO[cl]
                         : (tipo === "Suprimento" || tipo === "Recebimento");
    movs.push({
      data: get(r, ix.data), date: parseDate(get(r, ix.data)),
      tipo, categoria: get(r, ix.cat), desc,
      valor: Math.abs(valor), entrada,
      meio: get(r, ix.meio), quem: get(r, ix.quem),
      viagem: ix.vf >= 0 ? tripCode(get(r, ix.vf)) : "",
      recibo: get(r, ix.recibo),
    });
  }
  movs.hasTipo = ix.tipo >= 0 && movs.some(m => m.tipo);
  movs.hasCat = ix.cat >= 0 && movs.some(m => m.categoria);
  movs.hasMeio = ix.meio >= 0 && movs.some(m => m.meio);
  return movs;
}

/* ---------- viaturas (folha própria) ---------- */
function extractViaturas(rows) {
  if (!rows) return null;
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 8); i++) {
    if (rows[i].some(c => /matr[íi]cula|viatura/i.test(c || ""))) { h = i; break; }
  }
  if (h < 0) {
    let best = 0;
    rows.slice(0, 8).forEach((r, i) => {
      const filled = r.filter(c => c && c.trim()).length;
      if (filled > best) { best = filled; h = i; }
    });
    if (best < 2) return null;
  }
  const cols = rows[h].map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  if (!cols.length) return null;
  const iMat = findCol(cols, /matr[íi]cula/i, /viatura/i) >= 0
    ? findCol(cols, /matr[íi]cula/i, /viatura/i) : cols[0].i;
  const iSeco = findCol(cols, /consumo.*seco/i);
  const iCarr = findCol(cols, /consumo.*carreg/i);
  const iCons = iSeco >= 0 ? iSeco : findCol(cols, /consumo/i);
  const items = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const mat = (r[iMat] || "").trim();
    if (!mat || /^TOTAL/i.test(mat)) continue;
    items.push({
      mat, row: r,
      consumoSeco: iCons >= 0 ? parseNum(r[iCons]) : null,
      consumoCarr: iCarr >= 0 ? parseNum(r[iCarr]) : null,
    });
  }
  return { cols, iMat, items };
}
/* consumo esperado de uma matrícula (l/100km), se a folha Viaturas o tiver */
function viaturaInfo(mat) {
  const vt = extractViaturas(state.data["Viaturas"]);
  if (!vt) return null;
  const norm = s => String(s || "").toLowerCase().replace(/[\s\-_]/g, "");
  return vt.items.find(v => norm(v.mat) === norm(mat)) || null;
}

/* célula numérica = valor; datas (com / ou -) e texto ficam como estão */
function isNumericCell(raw) {
  const n = parseNum(raw);
  return n != null && /\d/.test(raw) && !/[a-zA-ZÀ-ú]{3,}/.test(raw) && !/[\/:]|\d-\d/.test(raw);
}
/* como fmtMZN, mas preserva as casas decimais quando o original as tem
   (ex.: preço/litro 78,5 não pode virar 79) */
function fmtNumRaw(raw) {
  const n = parseNum(raw);
  if (n == null) return esc(raw);
  if (!/[.,]\d/.test(String(raw).replace(/[\s ]/g, ""))) return fmtMZN(n);
  const [int, dec] = Math.abs(n).toFixed(2).split(".");
  const decTrim = dec.replace(/0+$/, "");
  return (n < 0 ? "−" : "") + int.replace(/\B(?=(\d{3})+(?!\d))/g, " ") +
         (decTrim ? "," + decTrim : "");
}
function fmtCell(raw) {
  return isNumericCell(raw) ? fmtNumRaw(raw) : esc(raw);
}

/* barra de período, partilhada pelas vistas operacionais */
function periodBar() {

  </div>`;
}
