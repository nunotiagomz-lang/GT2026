<!DOCTYPE html>
<html lang="pt" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>CNET Logistics, Lda · Gestão</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* Tema azul-marinho (sempre escuro, como o painel de referência).
     As cores das séries são os passos escuros da paleta de dados,
     revalidados contra ESTA superfície (#0f1b2e): banda de luminosidade,
     croma, separação para daltonismo (ΔE ≥ 8) e contraste ≥ 3:1. */
  :root {
    color-scheme: dark;
    --page:           #08111f;
    --surface:        #0f1b2e;   /* cartões */
    --surface-2:      #152540;   /* dentro dos cartões */
    --ink:            #f2f5fa;   /* 15.8:1 */
    --ink-2:          #aab6c8;   /*  8.4:1 */
    --ink-muted:      #7d8ba1;   /*  5.0:1 */
    --hairline:       #1e2d47;
    --border:         rgba(140,175,230,0.14);
    --track:          #1b2b45;
    --accent:         #3987e5;
    --accent-soft:    #184f95;
    --accent-text:    #6aa8f0;   /* azul para TEXTO: 7.0:1 no cartão, 6.2:1 no elevado */
    --good:           #0ca30c;
    --good-text:      #0ca30c;   /* 5.2:1 */
    --warning:        #fab219;
    --serious:        #ec835a;   /* texto negativo: 6.5:1 */
    --critical:       #d03b3b;   /* só marcas, nunca texto pequeno */
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --heat-0: var(--track);
    --heat-1: #104281; --heat-2: #1c5cab; --heat-3: #2a78d6;
    --heat-4: #5598e7; --heat-5: #9ec5f4;
    --raio: 16px;
    --sombra: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.25);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(120% 60% at 85% -10%, rgba(57,135,229,0.16), transparent 60%),
      radial-gradient(90% 50% at -10% 30%, rgba(144,133,233,0.08), transparent 60%),
      var(--page);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100dvh;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--page) 82%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--hairline);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 13px; flex: none;
    border: 1.5px solid rgba(255,255,255,0.55);
    object-fit: cover; display: block; background: #091f48;
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { font-size: clamp(15.5px, 4.4vw, 18px); font-weight: 750; line-height: 1.15; letter-spacing: -0.01em;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand p  { font-size: 12px; color: var(--ink-2); line-height: 1.3;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .refresh-btn {
    flex: none; width: 40px; height: 40px; border-radius: 50%; position: relative;
    border: 1px solid var(--border); background: rgba(15,27,46,0.7); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
  }
  .refresh-btn .ponto {
    position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--critical); box-shadow: 0 0 0 2px var(--page);
  }
  .refresh-btn .ponto[hidden] { display: none; }
  .refresh-btn:active { background: var(--track); }
  .refresh-btn svg { width: 18px; height: 18px; }
  .refresh-btn.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .updated-bar {
    text-align: center; font-size: 11px; color: var(--ink-muted);
    padding: 6px 16px 0;
  }
  .updated-bar .stale { color: var(--serious); }

  /* ---------- Layout ---------- */
  main { padding: 12px 14px 24px; max-width: 980px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; animation: fadein .18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0) 40%), var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--raio);
    box-shadow: var(--sombra);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-muted);
    margin: 18px 2px 8px;
  }
  .section-title:first-child { margin-top: 4px; }

  /* ---------- Esqueleto de carregamento ---------- */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

  /* ---------- Progress bars ---------- */
  .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); min-width: 2px; }
  .bar-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); margin-top: 6px; }

  /* ---------- Chips / status ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; line-height: 1;
    padding: 4px 8px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--ink-2); background: var(--surface-2);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-muted); flex: none; }
  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
  .status.good     { color: var(--good-text); }
  .status.warn     { color: var(--serious); }
  .status.neutral  { color: var(--ink-2); }

  /* ---------- Sub-tabs (topo de uma secção) ---------- */
  .subtabs {
    display: flex; gap: 2px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    border-bottom: 1px solid var(--hairline);
    margin: 0 0 12px; padding: 0 2px;
  }
  .subtabs::-webkit-scrollbar { display: none; }
  .subtabs button {
    flex: none; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 650;
    color: var(--ink-muted); padding: 10px 12px 9px;
    border-bottom: 2.5px solid transparent; margin-bottom: -1px;
    touch-action: manipulation; white-space: nowrap;
  }
  .subtabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .subtabs button:focus-visible, .filters button:focus-visible, nav button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .subtabs[hidden], .subtabs button[hidden] { display: none; }

  /* ---------- Pesquisa global ---------- */
  .search-overlay {
    position: fixed; inset: 0; z-index: 60; background: var(--page);
    display: flex; flex-direction: column;
  }
  .search-overlay[hidden] { display: none; }
  .search-head {
    display: flex; gap: 8px; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .search-head input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 16px; /* 16px evita zoom no iOS */
    padding: 10px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  .search-head input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search-head button {
    flex: none; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 650; color:var(--accent-text);
    padding: 8px 4px; touch-action: manipulation;
  }
  .search-body { flex: 1; overflow-y: auto; padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }
  .sr-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 2px; border-bottom: 1px solid var(--hairline); cursor: pointer;
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-kind {
    flex: none; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink-muted);
    border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px;
  }
  .sr-main { flex: 1; min-width: 0; }
  .sr-title { font-size: 14px; font-weight: 650; }
  .sr-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  /* ---------- Dashboard: gráficos ---------- */
  .viz-head { display: flex; justify-content: space-between; align-items: baseline;
              gap: 10px; margin-bottom: 10px; }
  .viz-head .t { font-size: 12.5px; font-weight: 650; color: var(--ink); }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; }
  .legenda > span { display: inline-flex; align-items: center; gap: 6px;
                    font-size: 11.5px; color: var(--ink-2); }
  .legenda i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .legenda b { color: var(--ink); font-variant-numeric: tabular-nums; }
  svg .marca { cursor: pointer; }
  .heat text { font-size: 8.5px; fill: var(--ink-muted); }
  .escala { display: flex; align-items: center; gap: 6px; margin-top: 8px;
            font-size: 10.5px; color: var(--ink-muted); }
  .escala i { width: 20px; height: 8px; border-radius: 2px; }
  .segbar { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .segbar > i { display: block; height: 100%; }

  /* valores ao toque */
  .viz-tip {
    position: fixed; z-index: 70; pointer-events: none;
    background: #f2f5fa; color: #08111f;
    font-size: 12px; font-weight: 600; line-height: 1.35;
    padding: 7px 10px; border-radius: 9px; max-width: 62vw;
    box-shadow: 0 4px 14px rgba(0,0,0,.22);
  }
  .viz-tip[hidden] { display: none; }

  /* ---------- Filter row ---------- */
  .filters {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filters button {
    flex: none; font-size: 13px; font-weight: 600; padding: 7px 14px;
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; touch-action: manipulation;
  }
  .filters button .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .filters button.on {
    background: linear-gradient(180deg, #2f7ad6, #1c5cab); color: #fff; border-color: rgba(120,170,240,0.5);
    box-shadow: 0 4px 14px rgba(57,135,229,0.30); }

  /* ---------- Movement rows ---------- */
  .mov {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 2px; border-bottom: 1px solid var(--hairline);
  }
  .mov:last-child { border-bottom: none; }
  .mov .m-main { flex: 1; min-width: 0; }
  .mov .m-item { font-size: 14px; font-weight: 650; line-height: 1.3; }
  .mov .m-desc { font-size: 12px; color: var(--ink-2); line-height: 1.35; margin-top: 2px; }
  .mov .m-date { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }
  .mov .m-side { text-align: right; flex: none; }
  .mov .m-val { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mov .m-payer { margin-top: 5px; }

  /* ---------- Plano rows ---------- */
  .inv { padding: 13px 2px; border-bottom: 1px solid var(--hairline); }
  .inv:last-child { border-bottom: none; }
  .inv .i-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .inv .i-name { font-size: 14px; font-weight: 650; line-height: 1.3; }
  .inv .i-tipo { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .inv .i-nums { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-top: 7px; font-variant-numeric: tabular-nums; }
  .inv .i-nums b { color: var(--ink); font-weight: 700; }

  /* ---------- Sócio cards ---------- */
  .socio { display: flex; flex-direction: column; gap: 2px; }
  .socio-head { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    color: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 15px;
  }
  .socio-head .s-name { font-size: 16px; font-weight: 700; }
  .socio-head .s-part { font-size: 12px; color: var(--ink-muted); }
  .socio-head .s-saldo { margin-left: auto; text-align: right; }
  .socio-head .s-saldo .v { font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .socio-nums { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-top: 8px; font-variant-numeric: tabular-nums; }

  /* ---------- Sócios num relance (dashboard) ---------- */
  .glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .glance-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .glance-item .g-name { font-size: 12px; font-weight: 650; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .glance-item .g-saldo { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Generic table ---------- */
  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em;
       text-transform: uppercase; color: var(--ink-muted);
       padding: 8px 10px 6px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--hairline);
       color: var(--ink); vertical-align: top; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }

  /* ---------- Empty / error states ---------- */
  .state { text-align: center; padding: 42px 20px; color: var(--ink-2); }
  .state .icon { font-size: 34px; margin-bottom: 10px; }
  .state h3 { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .state p { font-size: 13px; line-height: 1.5; max-width: 420px; margin: 0 auto; }
  .state .hint { margin-top: 12px; font-size: 12px; color: var(--ink-muted); }
  .retry {
    margin-top: 16px; font-size: 14px; font-weight: 650;
    padding: 10px 22px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; touch-action: manipulation;
  }

  /* ---------- Skeleton ---------- */
  .skel { border-radius: 10px; background: var(--track); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  /* ---------- Bottom nav ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: color-mix(in srgb, #0b1628 90%, transparent);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex; gap: 2px;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav button {
    flex: 1; min-width: 0; border: 1px solid transparent; background: none; cursor: pointer;
    padding: 7px 2px 6px; color: var(--ink-2); border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: inherit; font-size: 10.5px; font-weight: 600; touch-action: manipulation;
  }
  nav button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 389px) {
    header { gap: 6px; padding-left: 12px; padding-right: 12px; }
    .logo { width: 40px; height: 40px; border-radius: 11px; }
    .refresh-btn { width: 36px; height: 36px; }
    .refresh-btn svg { width: 17px; height: 17px; }
    .brand h1 { font-size: 15px; }
    .brand p { font-size: 11px; }
    nav { gap: 0; padding-left: 3px; padding-right: 3px; }
    nav button { font-size: 9.5px; padding-left: 0; padding-right: 0; letter-spacing: -0.01em; }
  }
  nav button svg { width: 22px; height: 22px; }
  nav button.on {
    color: #8fc0ff;
    background: linear-gradient(180deg, rgba(57,135,229,0.30), rgba(57,135,229,0.10));
    border-color: rgba(120,170,240,0.35);
  }

  footer { text-align: center; font-size: 11px; color: var(--ink-muted); padding: 8px 16px 20px; }

  /* =========== Painel de gestão (dashboard) =========== */
  .hero {
    position: relative; overflow: hidden; border-radius: 20px;
    padding: 18px 18px 20px; margin: 2px 0 14px; min-height: 150px;
    background:
      radial-gradient(70% 90% at 92% 105%, rgba(236,131,90,0.42), transparent 60%),
      radial-gradient(60% 80% at 70% 0%, rgba(57,135,229,0.22), transparent 70%),
      linear-gradient(160deg, #0f1f38, #0a1527 70%);
    border: 1px solid var(--border);
  }
  .hero .deco { position: absolute; right: -6px; bottom: 0; width: 58%; max-width: 360px;
                height: auto; pointer-events: none; opacity: .95; }
  .hero > *:not(.deco) { position: relative; }
  .hero .ola { font-size: 14px; color: var(--ink-2); padding-top: 6px; }
  .hero h2 { font-size: clamp(24px, 7vw, 32px); font-weight: 800; letter-spacing: -0.02em;
             line-height: 1.1; margin-top: 18px; max-width: 80%; }
  /* o texto acaba onde o camião começa (a decoração ocupa os 58% da direita) */
  .hero p { font-size: 13px; color: var(--ink-2); margin-top: 6px; max-width: 44%; line-height: 1.4; }
  .periodo {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    margin-top: 14px; padding: 9px 14px; border-radius: 12px;
    background: rgba(8,17,31,0.72); border: 1px solid rgba(140,175,230,0.25);
    font-size: 13px; font-weight: 650; color: var(--ink);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .periodo svg { width: 17px; height: 17px; flex: none; }
  .periodo select {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0;
    font-size: 16px; cursor: pointer;   /* 16px: o iOS não faz zoom */
  }
  .periodo:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* como no modelo: o período fica no canto superior direito do topo */
  .hero > .periodo { position: absolute; top: 14px; right: 14px; margin-top: 0; padding: 8px 12px; }
  .hero { min-height: 172px; }

  .grelha { display: grid; gap: 10px; margin-bottom: 10px; }
  .grelha > .card { margin-bottom: 0; min-width: 0; }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g2l { grid-template-columns: 1fr; }
  @media (min-width: 560px) { .g2l { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .gc { grid-template-columns: 1fr; }
  @media (max-width: 379px) { .g3 { grid-template-columns: 1fr 1fr; } .g3 > :first-child { grid-column: 1 / -1; }
                              .g2 { grid-template-columns: 1fr; } }
  @media (min-width: 640px) { .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
                              .gc { grid-template-columns: 1.45fr 1fr; } }

  /* cartão de indicador principal (receitas / despesas / resultado) */
  .kc { padding: 13px 13px 12px; }
  .kc .topo { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  @media (min-width: 640px) { .kc .topo { flex-direction: row; align-items: center; gap: 10px; } }
  .icone {
    width: 36px; height: 36px; border-radius: 11px; flex: none;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--cor, var(--accent)) 22%, transparent);
    border: 1px solid color-mix(in srgb, var(--cor, var(--accent)) 40%, transparent);
    color: var(--cor, var(--accent));
  }
  .icone svg { width: 19px; height: 19px; }
  .kc .rot { font-size: 12.5px; color: var(--ink-2); font-weight: 600; min-width: 0;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kc .val { font-size: clamp(17px, 5.2vw, 24px); font-weight: 780; letter-spacing: -0.02em;
             margin-top: 6px; line-height: 1.1; overflow-wrap: anywhere; }
  .kc .val small, .kt .val small { font-size: 11px; font-weight: 650; color: var(--ink-muted); margin-left: 3px; letter-spacing: 0; }
  .k-trend { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px; font-weight: 700; }
  .k-trend .q { color: var(--ink-muted); font-weight: 500; }
  .kc .k-trend { margin-top: 6px; font-size: 11px; }

<script>
"use strict";

/* =====================================================================
   CONFIGURAÇÃO
   Cada entrada de NAV é um separador em baixo. `views` são os

   acrescentar uma entrada em NAV; render: "auto" mostra a folha como

   ===================================================================== */
const SHEET_ID = "1iLkuI2Lom-klgfCtcrfSJMvbitZpXpWGPzoSQjZ0G1I";

/* Ficheiro "Planilha de Abastecimentos CNET" no Drive: uma folha por viagem,
   com o nome igual ao código da viagem (ex.: vf15). Colocar aqui o ID
   do ficheiro (partilhado como "qualquer pessoa com o link — leitor"). */
const ABASTECIMENTOS_ID = "1bpq6tAXb40dbZ0G945FxKanbIipnRDStO_nhYuuaxKo";

const NAV = [
  { id: "resumo", label: "Dashboard",
    icon: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h4.5v-6h4v6h4.5V10"/>',
    views: [
      { id: "resumo", sheet: "Resumo", label: "Dashboard", render: "resumo" },
    ] },
  /* (os ids dos grupos ficam os antigos: atalhos guardados continuam a funcionar) */
  { id: "viagens", label: "Operações",
    icon: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 17V7a2 2 0 0 1 2-2h5v12"/><path d="M13 9h4l3 4v4h-2"/><path d="M8 19h8"/>',
    needs: ["Viaturas", "Movimentos Geral", "Faturas"],   // consumo esperado; recebimentos, custos e recibos
    views: [
      { id: "viagens", sheet: "Viagens", label: "Viagens", render: "viagens", expect: /^vf$|c[óo]digo/i },
    ] },
  /* Financeiro: o livro de movimentos de dinheiro, visto de várias maneiras.
     `expect` é a assinatura do cabeçalho da folha — se deixar de bater
     certo (folha apagada ou reestruturada), o sub-separador desaparece
     em vez de mostrar os dados de outra folha. */
  { id: "contas", label: "Financeiro",
    icon: '<ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 10v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4"/><path d="M5 14v4c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6v-4"/>',
    needs: ["Sócios - Contas Correntes", "Acertos entre Sócios"],
    views: [
      /* contabilidade e tesouraria de toda a empresa */
      { id: "correntes", sheet: "Movimentos Geral", label: "Movimentos Correntes",
        render: "correntes", expect: /^data$/i },
      /* tudo o que passa pelos sócios: capital, adiantamentos e devoluções.
         (o id fica "investimentos" para não partir atalhos já guardados) */
      { id: "investimentos", sheet: "Movimentos dos Investidores", label: "Movimentos Sócios",
        alt: ["Movimentos Investimentos"], render: "investimentos", expect: /^data$/i },
    ] },
  { id: "viaturas", label: "Frota",
    icon: '<rect x="3" y="8" width="12" height="8" rx="1.5"/><path d="M15 11h3.5l2.5 3v2h-2"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
    needs: ["Viagens", "Movimentos Geral", "Faturas"],    // viagens de cada viatura
    views: [
      { id: "viaturas", sheet: "Viaturas", label: "Viaturas", render: "viaturas", expect: /matr[íi]cula|viatura/i },
    ] },
  /* Pessoas: fichas derivadas das viagens */
  { id: "pessoas", label: "Pessoas",
    icon: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c2.4.1 4.3 1.7 4.9 4.8"/>',
    needs: ["Viaturas", "Movimentos Geral", "Faturas"],
    views: [
      { id: "motoristas", sheet: "Viagens", label: "Motoristas", render: "motoristas", expect: /^vf$|c[óo]digo/i },
      { id: "clientes",   sheet: "Viagens", label: "Clientes",   render: "clientes",   expect: /^vf$|c[óo]digo/i },
    ] },
  /* Faturação: as faturas são emitidas noutro lado e REGISTADAS aqui (uma
     viagem por fatura, valores sem IVA). Sem `expect`: a vista valida a folha
     ela própria e, se ainda não existir, mostra as viagens por faturar. */
  { id: "faturacao", label: "Faturação",
    icon: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
    needs: ["Viagens", "Movimentos Geral", "Viaturas"],
    views: [
      { id: "faturas", sheet: "Faturas", label: "Faturação", render: "faturas" },
    ] },
  /* Áreas futuras: soon:true mostra "Em breve" e não carrega dados. */
];
const ALL_VIEWS = NAV.flatMap(g => g.views);
/* folhas de que cada área precisa: as das suas vistas + as que cruza (needs) */
function groupSheets(g) {
  return [...new Set([...g.views.map(v => v.sheet), ...(g.needs || [])].filter(Boolean))];
}
/* o Resumo cruza dados de várias áreas */
const RESUMO_SHEETS = ["Resumo", "Movimentos dos Investidores", "Movimentos Geral",
                       "Sócios - Contas Correntes", "Viagens", "Viaturas", "Faturas"];

/* Cores fixas por sócio (ordem fixa — nunca reciclar) */
const SOCIO_COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)",
                      "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
const socioColorIndex = new Map();
function socioColor(name) {
  const key = (name || "").trim();
  if (!socioColorIndex.has(key)) socioColorIndex.set(key, socioColorIndex.size % SOCIO_COLORS.length);
  return SOCIO_COLORS[socioColorIndex.get(key)];
}

/* =====================================================================
   DADOS — cada folha é lida do Google Sheets em CSV.
   Requer partilha "Qualquer pessoa com o link → Leitor".
   ?src=<base-url> permite testar com CSVs locais (<base>/<folha>.csv).
   ===================================================================== */
const SRC_OVERRIDE = new URLSearchParams(location.search).get("src");

function csvUrl(sheetName) {
  if (SRC_OVERRIDE) return SRC_OVERRIDE.replace(/\/$/, "") + "/" + encodeURIComponent(sheetName) + ".csv";
  return "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
         "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName) +
         "&t=" + Date.now();  // evita cache
}

/* Parser CSV (RFC 4180: aspas, vírgulas e quebras de linha em células) */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

/* Números em formato PT: "1 422 500", "25,0%", "(7 545)", "-" */
function parseNum(v) {
  if (v == null) return null;
  let s = String(v).replace(/[\s  ]/g, "").replace(/(MZN|MT)/gi, "");
  if (s === "" || s === "-" || s === "—") return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.startsWith("-")) { neg = true; s = s.slice(1); }
  const pct = s.endsWith("%");
  if (pct) s = s.slice(0, -1);
  // vírgula = decimal; ponto pode ser milhares ou decimal
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return (neg ? -n : n);
}

/* milhares separados por espaço, como no Excel: 2 500 / 1 422 500 */
function fmtMZN(n) {
  if (n == null || isNaN(n)) return "—";
  const abs = String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (n < 0 ? "−" : "") + abs;
}
function fmtPct(n) { return n == null ? "—" : String(Math.round(n)) + "%"; }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* Encontra a linha de cabeçalho cuja 1.ª célula preenchida é `firstCol` */
function findHeaderRow(rows, firstCol) {
  const want = firstCol.toLowerCase();
  for (let i = 0; i < rows.length; i++) {
    const first = (rows[i].find(c => c && c.trim()) || "").trim().toLowerCase();
    if (first === want) return i;
  }
  return -1;
}
function colIndex(header, name) {
  const want = name.toLowerCase();
  return header.findIndex(h => (h || "").trim().toLowerCase().includes(want));
}
function isRowEmpty(r) { return !r || r.every(c => !c || !c.trim()); }

/* ---------- fetch com cache local (funciona offline) ---------- */
const CACHE_PREFIX = "nl_sheet_";

async function loadSheet(sheetName, force) {
  const key = CACHE_PREFIX + sheetName;
  try {
    const res = await fetch(csvUrl(sheetName), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (/<html/i.test(text.slice(0, 300))) throw new Error("acesso negado");
    const rows = parseCSV(text);
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), rows })); } catch (e) {}
    return { rows, fromCache: false, time: Date.now() };
  } catch (err) {
    const cached = localStorage.getItem(key);
    if (cached && !force) {
      const { t, rows } = JSON.parse(cached);
      return { rows, fromCache: true, time: t };
    }
    throw err;
  }
}

/* =====================================================================
   EXTRATORES — transformam as linhas CSV de cada folha em dados
   estruturados (reutilizados pelos renders e pelo dashboard do Resumo)
   ===================================================================== */
/* nomes dos sócios, lidos da folha "Sócios - Contas Correntes" */
function socioNames() {
  const sr = state.data["Sócios - Contas Correntes"] || null;
  const s = sr ? extractSocios(sr) : null;
  return s ? s.map(x => x.nome) : [];
}

function extractMovs(rows) {
  const h = findHeaderRow(rows, "Data");
  if (h < 0) return null;
  const header = rows[h];
  const iData = colIndex(header, "data"), iItem = colIndex(header, "item"),
        iDesc = colIndex(header, "descrição") >= 0 ? colIndex(header, "descrição") : colIndex(header, "descricao"),
        iVal = colIndex(header, "valor"), iPor = colIndex(header, "pago por"),
        iTipo = colIndex(header, "tipo"),
        iCat = colIndex(header, "categoria"),
        iVF = header.findIndex(h => /^\s*(vf|viagem)\s*$/i.test((h || "").trim()));

  /* Formato novo: uma coluna por sócio com o valor pago por esse sócio
     nessa linha (permite vários pagadores num movimento). As colunas são
     detetadas pelos nomes dos sócios; "Quota X" / "Verificação" ficam de fora. */
  const names = socioNames();
  const socioCols = [];
  header.forEach((cell, i) => {
    const t = (cell || "").trim();
    if (!t || /quota|verifica|%/i.test(t)) return;
    const match = names.find(n =>
      t.toLowerCase() === n.toLowerCase() || t.toLowerCase().includes(n.toLowerCase()));
    if (match) socioCols.push({ name: match, i });
  });

  const movs = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const item = (r[iItem] || "").trim();
    const base = {
      data: (r[iData] || "").trim(),
      item,
      desc: iDesc >= 0 ? (r[iDesc] || "").trim() : "",
      tipoLido: iTipo >= 0 ? (r[iTipo] || "").trim() : "",
      categoria: iCat >= 0 ? (r[iCat] || "").trim() : "",
      viagem: iVF >= 0 ? tripCode((r[iVF] || "").trim()) : "",
    };
    /* neste livro, uma linha sem tipo sempre contou como investimento */
    base.tipo = base.tipoLido || "Investimento";
    if (socioCols.length) {
      if (!item || /^TOTAL/.test(item)) continue; // ignora vazias e linhas de totais
      const pagadores = [];
      for (const c of socioCols) {
        const val = parseNum(r[c.i]);
        if (val != null && val !== 0) pagadores.push({ por: c.name, val });
      }
      if (pagadores.length) movs.push({ ...base,
        total: pagadores.reduce((a, p) => a + p.val, 0), pagadores });
    } else {
      /* formato antigo: coluna única "Valor Pago" + "Pago por" */
      const val = parseNum(r[iVal]);
      const por = (r[iPor] || "").trim();
      if (val == null || val === 0 || !por) continue; // ignora linhas de fórmula vazias
      movs.push({ ...base, total: val, pagadores: [{ por, val }] });
    }
  }
  /* as colunas Tipo/Categoria são opcionais: só existem se estiverem preenchidas */
  movs.hasTipo = iTipo >= 0 && movs.some(m => m.tipoLido);
  movs.hasCat = iCat >= 0 && movs.some(m => m.categoria);
  return movs;
}
/* ---------- adiantamentos entre os sócios e a empresa ----------
   Dinheiro que tem de voltar, nos dois sentidos. Fica FORA do capital
   (não conta para quotas nem para o investido) e fora do resultado
   (não é receita nem despesa) — mas mexe na tesouraria. */
const ADIANT_NOME = {
  do:      "Adiantamento do sócio",   // sócio → empresa: a empresa fica a dever
  despesa: "Despesa paga pelo sócio", // pagou do bolso uma despesa da empresa
  devDo:   "Devolução do sócio",      // sócio devolve o que tinha levado
  ao:      "Adiantamento ao sócio",   // empresa → sócio: o sócio fica a dever
  devAo:   "Devolução ao sócio",      // empresa devolve o que o sócio adiantou
};
/* efeito no saldo do sócio: positivo = a empresa deve-lhe */
const ADIANT_SINAL = { do: 1, despesa: 1, devDo: 1, ao: -1, devAo: -1 };
/* do ponto de vista da empresa: dinheiro que chega (do sócio) ou que sai */
const ADIANT_DO_SOCIO = { do: true, despesa: true, devDo: true, ao: false, devAo: false };

function classeAdiant(tipo) {
  const s = deaccent(tipo).replace(/\s+/g, " ").trim();
  if (!s) return null;
  if (/^adiantamento (do|pelo|de) socio/.test(s)) return "do";
  if (/^adiantamento (ao|para o|a) socio/.test(s)) return "ao";
  if (/^(devolucao|reembolso) ao socio/.test(s)) return "devAo";
  if (/^(devolucao|reembolso) (do|pelo) socio/.test(s)) return "devDo";
  if (/^despesa (paga )?(pelo|do) socio/.test(s)) return "despesa";
  return null;
}
/* financiamento: entra ou sai dinheiro, mas não é operação */
function ehFinanciamento(tipo) {
  return tipo === "Suprimento" || !!classeAdiant(tipo) || saidaParaSocio(tipo);
}
const ehReceita = m => m.entrada && !ehFinanciamento(m.tipo);
const ehDespesa = m => !m.entrada && m.tipo !== "Investimento" && !ehFinanciamento(m.tipo);

/* normaliza o tipo para uma das famílias conhecidas */
function tipoNorm(t) {
  const a = classeAdiant(t);
  if (a) return ADIANT_NOME[a];
  const s = deaccent(t);
  /* antes do suprimento: "Devolução de capital" não é uma entrada */
  if (/devolu|dividend|reembols|levantament|retirad/.test(s)) return String(t).trim();
  if (/investiment|capex|imobiliz/.test(s)) return "Investimento";
  if (/despesa|custo|opex|gasto/.test(s)) return "Despesa";
  if (/supriment|entrada|aporte|capital/.test(s)) return "Suprimento";
  if (/recebiment|receita|faturad/.test(s)) return "Recebimento";
  return t.trim() || "";
}
const TIPO_COR = {
  "Investimento": "var(--s1)", "Despesa": "var(--s2)",
  "Suprimento": "var(--s3)", "Recebimento": "var(--s6)",
  "Adiantamento do sócio": "var(--s4)", "Despesa paga pelo sócio": "var(--s4)",
  "Devolução do sócio": "var(--s4)",
  "Adiantamento ao sócio": "var(--s5)", "Devolução ao sócio": "var(--s5)",
};

function extractPlano(rows) {
  const h = findHeaderRow(rows, "Item");
  if (h < 0) return null;
  const header = rows[h];
  const iItem = colIndex(header, "item"), iTipo = colIndex(header, "tipo"),
        iTot = colIndex(header, "valor total"), iPago = colIndex(header, "já pago") >= 0 ? colIndex(header, "já pago") : colIndex(header, "pago"),
        iFalta = colIndex(header, "falta"), iSit = colIndex(header, "situação") >= 0 ? colIndex(header, "situação") : colIndex(header, "situacao");
  const items = [], totals = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const name = (r[iItem] || "").trim();
    if (!name) continue;
    const rec = {
      name, tipo: (r[iTipo] || "").trim(),
      total: parseNum(r[iTot]), pago: parseNum(r[iPago]), falta: parseNum(r[iFalta]),
      sit: iSit >= 0 ? (r[iSit] || "").trim() : ""
    };
    // linhas de totais começam por TOTAL/DESPESA em maiúsculas ("Despesas Extras" é um item)
    if (/^(TOTAL|DESPESAS?)(\s|$)/.test(name)) {
      const nums = r.map(parseNum).filter(n => n != null);
      totals.push({ name, total: rec.total, pago: rec.pago, falta: rec.falta, nums });
    } else items.push(rec);
  }
  return { items, totals };
}

function extractSocios(rows) {
  const h = findHeaderRow(rows, "Sócio");
  if (h < 0) return null;
  const header = rows[h];
  const iNome = colIndex(header, "sócio") >= 0 ? colIndex(header, "sócio") : colIndex(header, "socio"),
        iPart = colIndex(header, "participação") >= 0 ? colIndex(header, "participação") : colIndex(header, "participacao"),
        iPago = colIndex(header, "pago"), iQuota = colIndex(header, "quota"),
        iSaldo = colIndex(header, "saldo"), iSit = colIndex(header, "situação") >= 0 ? colIndex(header, "situação") : colIndex(header, "situacao");
  const socios = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const nome = (r[iNome] || "").trim();
    if (!nome || /^total/i.test(nome)) continue;
    socios.push({
      nome, part: (r[iPart] || "").trim(),
      pago: parseNum(r[iPago]), quota: parseNum(r[iQuota]),
      saldo: parseNum(r[iSaldo]), sit: iSit >= 0 ? (r[iSit] || "").trim() : ""
    });
  }
  return socios;
}

/* Qual a folha que uma vista está mesmo a usar. `alt` permite nomes
   antigos: se a folha principal não existir (ou não tiver o cabeçalho
   esperado), tenta os nomes alternativos. */
function resolveSheet(view) {
  const ok = name => {
    const rows = state.data[name];
    if (!rows) return false;
    if (!view.expect) return true;
    return rows.slice(0, 12).some(r => r.some(c => view.expect.test(String(c || "").trim())));
  };
  if (ok(view.sheet)) return view.sheet;
  for (const a of view.alt || []) if (ok(a)) return a;
  return view.sheet;
}
/* dados já carregados de outra view (null se ainda não disponíveis) */
function sheetRows(viewId) {
  const v = ALL_VIEWS.find(x => x.id === viewId);
  return v ? (state.data[resolveSheet(v)] || null) : null;
}
/* linhas do livro dos investidores, com o nome antigo como salvaguarda
   (resolveSheet valida o cabeçalho, por isso a folha errada que o Google
   devolve quando o nome não existe é descartada) */
function investorRows() {
  const v = ALL_VIEWS.find(x => x.id === "investimentos");
  return v ? (state.data[resolveSheet(v)] || null) : null;
}

/* =====================================================================
   RESUMO — o dashboard da empresa
   Tudo calculado a partir dos livros e das viagens. Cada secção só
   aparece se houver dados, e o filtro de período no topo manda em tudo.
   Os gráficos são SVG feito à mão (sem bibliotecas, funciona offline);
   qualquer marca com `data-tip` mostra os valores ao toque.

const MESES_CURTOS = ["jan", "fev", "mar", "abr", "mai", "jun",
                      "jul", "ago", "set", "out", "nov", "dez"];

/* --- período atual e o anterior equivalente, para as tendências --- */
function periodBounds(period, ref) {
  const hoje = ref || new Date();
  const d = (a, m, dia) => new Date(a, m, dia == null ? 1 : dia);
  if (period === "m") {
    const ini = d(hoje.getFullYear(), hoje.getMonth());
    return { ini, fim: d(hoje.getFullYear(), hoje.getMonth() + 1),
             iniAnt: d(hoje.getFullYear(), hoje.getMonth() - 1), fimAnt: ini };
  }
  if (period === "y") {
    const ini = d(hoje.getFullYear(), 0);
    return { ini, fim: d(hoje.getFullYear() + 1, 0),
             iniAnt: d(hoje.getFullYear() - 1, 0), fimAnt: ini };
  }
  if (period === "3m") {
    const fim = new Date(hoje); fim.setDate(fim.getDate() + 1);
    const ini = new Date(fim); ini.setMonth(ini.getMonth() - 3);
    const iniAnt = new Date(ini); iniAnt.setMonth(iniAnt.getMonth() - 3);
    return { ini, fim, iniAnt, fimAnt: ini };
  }
  return null;   // "Tudo" não tem período anterior com que comparar
}
function entre(data, ini, fim) { return data && data >= ini && data < fim; }

/* variação face ao período anterior */
function tendencia(atual, anterior) {
  if (anterior == null || !isFinite(anterior) || Math.abs(anterior) < 1) return null;
  return (atual - anterior) / Math.abs(anterior) * 100;
}
function trendHTML(pct, bomSeSobe) {
  if (pct == null) return "";
  const sobe = pct >= 0;
  const bom = bomSeSobe === false ? !sobe : sobe;
  const cor = Math.abs(pct) < 0.5 ? "var(--ink-muted)" : bom ? "var(--good-text)" : "var(--serious)";
  return `<div class="k-trend" style="color:${cor}">
    ${Math.abs(pct) < 0.5 ? "→" : sobe ? "↑" : "↓"} ${fmtNumRaw(Math.abs(pct).toFixed(1))}%
    <span class="q">vs período anterior</span></div>`;
}

/* --- mapa de calor: categoria (linhas) × mês (colunas) --- */
function heatmapHTML(cats, meses, matriz, maior) {
  if (!cats.length || meses.length < 2) return "";
  const cel = 26, gap = 3, rotW = 74;
  const W = rotW + meses.length * (cel + gap);
  const H = 16 + cats.length * (cel + gap);
  const tom = v => {
    if (!v) return "var(--heat-0)";
    const f = v / maior;
    return `var(--heat-${f > .75 ? 5 : f > .5 ? 4 : f > .25 ? 3 : f > .08 ? 2 : 1})`;
  };
  let corpo = "";
  cats.forEach((c, r) => {
    const yy = 16 + r * (cel + gap);
    corpo += `<text x="0" y="${yy + cel / 2 + 3}">${esc(c.length > 12 ? c.slice(0, 11) + "…" : c)}</text>`;
    meses.forEach((m, k) => {
      const v = matriz[c][m.chave] || 0;
      corpo += `<rect class="marca" x="${rotW + k * (cel + gap)}" y="${yy}"
        width="${cel}" height="${cel}" rx="4" fill="${tom(v)}"
        data-tip="${esc(c)} · ${esc(m.rotulo)}&#10;${v ? fmtMZN(v) + " MZN" : "sem despesas"}"/>`;
    });
  });
  const cabecalho = meses.map((m, k) =>
    `<text x="${rotW + k * (cel + gap) + cel / 2}" y="9" text-anchor="middle">${esc(m.rotulo)}</text>`).join("");

  return `<div class="card">
    <div class="viz-head"><span class="t">Despesas por categoria e mês</span></div>
    <div class="tablewrap">
      <svg class="heat" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"
           role="img" aria-label="Despesas por categoria e mês">${cabecalho}${corpo}</svg>
    </div>
    <div class="escala"><span>menos</span>
      ${[1, 2, 3, 4, 5].map(n => `<i style="background:var(--heat-${n})"></i>`).join("")}
      <span>mais</span></div>
  </div>`;
}

/* --- barra segmentada (composição) --- */
function segbarHTML(partes, titulo) {
  const total = partes.reduce((a, p) => a + p.valor, 0);
  if (!total) return "";
  return `<div class="card">
    <div class="viz-head"><span class="t">${esc(titulo)}</span>
      <span style="font-size:11.5px;color:var(--ink-muted)">${fmtMZN(total)} MZN</span></div>
    <div class="segbar">
      ${partes.map(p => `<i class="marca" style="width:${(p.valor / total * 100).toFixed(1)}%;background:${p.cor}"
        data-tip="${esc(p.nome)}&#10;${fmtMZN(p.valor)} MZN · ${fmtNumRaw((p.valor / total * 100).toFixed(1))}%"></i>`).join("")}
    </div>
    <div class="legenda">
      ${partes.map(p => `<span><i style="background:${p.cor}"></i>${esc(p.nome)}
        <b>${fmtNumRaw((p.valor / total * 100).toFixed(0))}%</b></span>`).join("")}
    </div>
  </div>`;
}

/* agrupa o livro geral por mês */
function porMes(movs, n) {
  const mapa = new Map();
  for (const m of movs) {
    if (!m.date) continue;
    /* mesma regra dos indicadores: o investimento e os suprimentos são
       financiamento, não operação — senão a compra do camião esmaga o resto */
    const receita = ehReceita(m);
    const despesa = ehDespesa(m);
    if (!receita && !despesa) continue;
    const chave = m.date.getFullYear() * 12 + m.date.getMonth();
    if (!mapa.has(chave)) mapa.set(chave, { chave, receitas: 0, despesas: 0,
      mes: m.date.getMonth(), ano: m.date.getFullYear() });
    const e = mapa.get(chave);
    if (receita) e.receitas += m.valor; else e.despesas += m.valor;
  }
  const lista = [...mapa.values()].sort((a, b) => a.chave - b.chave).slice(-(n || 6));
  const varios = lista.length > 1 && lista[0].ano !== lista[lista.length - 1].ano;
  lista.forEach(m => {
    m.resultado = m.receitas - m.despesas;
    m.rotulo = MESES_CURTOS[m.mes] + (varios ? "/" + String(m.ano).slice(2) : "");
  });
  return lista;
}

/* valores dos eixos: 0 · 20 mil · 40 mil (por extenso abaixo de 10 mil) */
function eixoRot(v, passo) {
  if (v === 0) return "0";
  if (Math.abs(passo) >= 10000 || Math.abs(v) >= 100000) {
    const m = v / 1000;
    return (v < 0 ? "−" : "") + fmtNumRaw(String(Math.abs(Math.round(m * 10) / 10)).replace(".", ",")) + " mil";
  }
  return fmtMZN(v);
}
function passoRedondo(alcance, n) {
  const bruto = alcance / (n || 4);
  const p = Math.pow(10, Math.floor(Math.log10(bruto || 1)));
  const f = bruto / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

/* --- rótulo do período (ex.: "Ago – Nov 2026") --- */
const MESES_CAP = MESES_CURTOS.map(m => m[0].toUpperCase() + m.slice(1));
function rotuloPeriodo(datas) {
  const hoje = new Date();
  const mm = d => MESES_CAP[d.getMonth()];
  const intervalo = (a, b) => a.getFullYear() === b.getFullYear()
    ? (a.getMonth() === b.getMonth() ? `${mm(b)} ${b.getFullYear()}` : `${mm(a)} – ${mm(b)} ${b.getFullYear()}`)
    : `${mm(a)} ${a.getFullYear()} – ${mm(b)} ${b.getFullYear()}`;
  if (state.period === "m") return intervalo(hoje, hoje);
  if (state.period === "y") return `Jan – ${mm(hoje)} ${hoje.getFullYear()}`;
  if (state.period === "3m") {
    const ini = new Date(hoje); ini.setMonth(ini.getMonth() - 3);
    return intervalo(ini, hoje);
  }
  const validas = datas.filter(Boolean);
  if (!validas.length) return "Desde o início";
  const ini = new Date(Math.min(...validas)), fim = new Date(Math.max(...validas, hoje));
  return intervalo(ini, fim);
}
