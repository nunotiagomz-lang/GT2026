<!DOCTYPE html>
<html lang="pt" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Nova Logística, Lda · Plano de Investimento</title>
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface:        #fcfcfb;
    --ink:            #0b0b0b;
    --ink-2:          #52514e;
    --ink-muted:      #898781;
    --hairline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --track:          #f0efec;
    --accent:         #2a78d6;   /* categorical slot 1 (blue) */
    --accent-soft:    #cde2fb;
    --good:           #0ca30c;
    --good-text:      #006300;
    --warning:        #fab219;
    --serious:        #ec835a;
    --critical:       #d03b3b;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface:        #1a1a19;
      --ink:            #ffffff;
      --ink-2:          #c3c2b7;
      --ink-muted:      #898781;
      --hairline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --track:          #383835;
      --accent:         #3987e5;
      --accent-soft:    #184f95;
      --good-text:      #0ca30c;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--ink);
    min-height: 100dvh;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--page) 88%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--hairline);
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 10px; flex: none;
    background: #fff; border: 1px solid var(--border);
    object-fit: contain; display: block;
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { font-size: 16px; font-weight: 700; line-height: 1.15; }
  .brand p  { font-size: 12px; color: var(--ink-2); line-height: 1.3;
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .refresh-btn {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
  }
  .refresh-btn:active { background: var(--track); }
  .refresh-btn svg { width: 18px; height: 18px; }
  .refresh-btn.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .updated-bar {
    text-align: center; font-size: 11px; color: var(--ink-muted);
    padding: 6px 16px 0;
  }
  .updated-bar .stale { color: var(--serious); }

  /* ---------- Layout ---------- */
  main { padding: 12px 14px 24px; max-width: 720px; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; animation: fadein .18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-muted);
    margin: 18px 2px 8px;
  }
  .section-title:first-child { margin-top: 4px; }

  /* ---------- Stat tiles ---------- */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 14px;
  }
  .tile.wide { grid-column: 1 / -1; }
  .tile .t-label { font-size: 12px; color: var(--ink-2); line-height: 1.25; margin-bottom: 5px; }
  .tile .t-value { font-size: 22px; font-weight: 750; letter-spacing: -0.01em; line-height: 1.1; }
  .tile .t-value small { font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-left: 3px; }
  .tile .t-sub { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }

  /* ---------- Progress bars ---------- */
  .bar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); min-width: 2px; }
  .bar-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-2); margin-top: 6px; }

  /* ---------- Chips / status ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; line-height: 1;
    padding: 4px 8px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--ink-2); background: var(--track);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-muted); flex: none; }
  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
  .status.good     { color: var(--good-text); }
  .status.warn     { color: var(--serious); }
  .status.neutral  { color: var(--ink-2); }

  /* ---------- Sub-tabs (topo de uma secção) ---------- */
  .subtabs {
    display: flex; gap: 2px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
    border-bottom: 1px solid var(--hairline);
    margin: 0 0 12px; padding: 0 2px;
  }
  .subtabs::-webkit-scrollbar { display: none; }
  .subtabs button {
    flex: none; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: 650;
    color: var(--ink-muted); padding: 10px 12px 9px;
    border-bottom: 2.5px solid transparent; margin-bottom: -1px;
    touch-action: manipulation; white-space: nowrap;
  }
  .subtabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .subtabs[hidden], .subtabs button[hidden] { display: none; }

  /* ---------- Pesquisa global ---------- */
  .search-overlay {
    position: fixed; inset: 0; z-index: 60; background: var(--page);
    display: flex; flex-direction: column;
  }
  .search-overlay[hidden] { display: none; }
  .search-head {
    display: flex; gap: 8px; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  .search-head input {
    flex: 1; min-width: 0; font-family: inherit; font-size: 16px; /* 16px evita zoom no iOS */
    padding: 10px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
  }
  .search-head input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search-head button {
    flex: none; border: none; background: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 650; color: var(--accent);
    padding: 8px 4px; touch-action: manipulation;
  }
  .search-body { flex: 1; overflow-y: auto; padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }
  .sr-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 2px; border-bottom: 1px solid var(--hairline); cursor: pointer;
  }
  .sr-item:last-child { border-bottom: none; }
  .sr-kind {
    flex: none; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink-muted);
    border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px;
  }
  .sr-main { flex: 1; min-width: 0; }
  .sr-title { font-size: 14px; font-weight: 650; }
  .sr-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  /* ---------- Filter row ---------- */
  .filters {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filters button {
    flex: none; font-size: 13px; font-weight: 600; padding: 7px 14px;
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; touch-action: manipulation;
  }
  .filters button .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .filters button.on { background: var(--ink); color: var(--page); border-color: var(--ink); }

  /* ---------- Movement rows ---------- */
  .mov {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 2px; border-bottom: 1px solid var(--hairline);
  }
  .mov:last-child { border-bottom: none; }
  .mov .m-main { flex: 1; min-width: 0; }
  .mov .m-item { font-size: 14px; font-weight: 650; line-height: 1.3; }
  .mov .m-desc { font-size: 12px; color: var(--ink-2); line-height: 1.35; margin-top: 2px; }
  .mov .m-date { font-size: 11px; color: var(--ink-muted); margin-top: 4px; }
  .mov .m-side { text-align: right; flex: none; }
  .mov .m-val { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mov .m-payer { margin-top: 5px; }

  /* ---------- Plano rows ---------- */
  .inv { padding: 13px 2px; border-bottom: 1px solid var(--hairline); }
  .inv:last-child { border-bottom: none; }
  .inv .i-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .inv .i-name { font-size: 14px; font-weight: 650; line-height: 1.3; }
  .inv .i-tipo { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .inv .i-nums { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-top: 7px; font-variant-numeric: tabular-nums; }
  .inv .i-nums b { color: var(--ink); font-weight: 700; }

  /* ---------- Sócio cards ---------- */
  .socio { display: flex; flex-direction: column; gap: 2px; }
  .socio-head { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: none;
    color: #fff; display: grid; place-items: center;
    font-weight: 800; font-size: 15px;
  }
  .socio-head .s-name { font-size: 16px; font-weight: 700; }
  .socio-head .s-part { font-size: 12px; color: var(--ink-muted); }
  .socio-head .s-saldo { margin-left: auto; text-align: right; }
  .socio-head .s-saldo .v { font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .socio-nums { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-top: 8px; font-variant-numeric: tabular-nums; }

  /* ---------- Sócios num relance (dashboard) ---------- */
  .glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .glance-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .glance-item .g-name { font-size: 12px; font-weight: 650; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .glance-item .g-saldo { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- Generic table ---------- */
  .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .05em;
       text-transform: uppercase; color: var(--ink-muted);
       padding: 8px 10px 6px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--hairline);
       color: var(--ink); vertical-align: top; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }

  /* ---------- Empty / error states ---------- */
  .state { text-align: center; padding: 42px 20px; color: var(--ink-2); }
  .state .icon { font-size: 34px; margin-bottom: 10px; }
  .state h3 { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .state p { font-size: 13px; line-height: 1.5; max-width: 420px; margin: 0 auto; }
  .state .hint { margin-top: 12px; font-size: 12px; color: var(--ink-muted); }
  .retry {
    margin-top: 16px; font-size: 14px; font-weight: 650;
    padding: 10px 22px; border-radius: 999px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; touch-action: manipulation;
  }

  /* ---------- Skeleton ---------- */
  .skel { border-radius: 10px; background: var(--track); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  /* ---------- Bottom nav ---------- */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--hairline);
    display: flex;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: none; background: none; cursor: pointer;
    padding: 8px 2px 7px; color: var(--ink-muted);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: inherit; font-size: 10px; font-weight: 600; touch-action: manipulation;
  }
  nav button svg { width: 22px; height: 22px; }
  nav button.on { color: var(--accent); }

  footer { text-align: center; font-size: 11px; color: var(--ink-muted); padding: 8px 16px 20px; }
</style>
</head>
<body>

<header>
  <img class="logo" src="assets/logo-mark.png" alt="Nova Logística">
  <div class="brand">
    <h1>Nova Logística, Lda</h1>
    <p>Gestão · Transportes e Logística</p>
  </div>
  <button class="refresh-btn" id="searchBtn" aria-label="Procurar" title="Procurar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
  </button>
  <button class="refresh-btn" id="refreshBtn" aria-label="Atualizar dados" title="Atualizar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
    </svg>
  </button>
</header>

<div class="search-overlay" id="searchOverlay" hidden>
  <div class="search-head">
    <input id="searchInput" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Viagem, motorista, viatura, cliente…" aria-label="Procurar">
    <button id="searchClose">Fechar</button>
  </div>
  <div class="search-body" id="searchResults"></div>
</div>

<div class="updated-bar" id="updatedBar"></div>

<main id="main"></main>

<nav id="nav"></nav>

<script>
"use strict";

/* =====================================================================
   CONFIGURAÇÃO
   Cada entrada de NAV é um separador em baixo. `views` são os
   sub-separadores mostrados no topo dessa secção (com uma só view,
   a barra de sub-separadores não aparece).
   Para adicionar uma área nova (ex.: Faturação, Vendas, RH), basta
   acrescentar uma entrada em NAV; render: "auto" mostra a folha como
   tabela sem programação extra.
   ===================================================================== */
const SHEET_ID = "1iLkuI2Lom-klgfCtcrfSJMvbitZpXpWGPzoSQjZ0G1I";

/* Ficheiro "planilha de abastecimentos" no Drive: uma folha por viagem,
   com o nome igual ao código da viagem (ex.: vf15). Colocar aqui o ID
   do ficheiro (partilhado como "qualquer pessoa com o link — leitor"). */
const ABASTECIMENTOS_ID = "1bpq6tAXb40dbZ0G945FxKanbIipnRDStO_nhYuuaxKo";

const NAV = [
  { id: "resumo", label: "Resumo",
    icon: '<path d="M3 12h5l2-7 4 14 2-7h5"/>',
    views: [
      { id: "resumo", sheet: "Resumo", label: "Resumo", render: "resumo" },
    ] },
  { id: "viagens", label: "Viagens",
    icon: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 17V7a2 2 0 0 1 2-2h5v12"/><path d="M13 9h4l3 4v4h-2"/><path d="M8 19h8"/>',
    needs: ["Viaturas"],   // consumo esperado por matrícula
    views: [
      { id: "viagens",    sheet: "Viagens", label: "Viagens",    render: "viagens",    expect: /^vf$|c[óo]digo/i },
      { id: "motoristas", sheet: "Viagens", label: "Motoristas", render: "motoristas", expect: /^vf$|c[óo]digo/i },
      { id: "clientes",   sheet: "Viagens", label: "Clientes",   render: "clientes",   expect: /^vf$|c[óo]digo/i },
    ] },
  { id: "viaturas", label: "Viaturas",
    icon: '<rect x="3" y="8" width="12" height="8" rx="1.5"/><path d="M15 11h3.5l2.5 3v2h-2"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
    needs: ["Viagens"],    // viagens de cada viatura
    views: [
      { id: "viaturas", sheet: "Viaturas", label: "Viaturas", render: "viaturas", expect: /matr[íi]cula|viatura/i },
    ] },
  /* Contas: o livro de movimentos de dinheiro, visto de várias maneiras.
     `expect` é a assinatura do cabeçalho da folha — se deixar de bater
     certo (folha apagada ou reestruturada), o sub-separador desaparece
     em vez de mostrar os dados de outra folha. */
  { id: "contas", label: "Contas",
    icon: '<path d="M4 6h16v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 6V5a1 1 0 0 1 1-1h11"/><path d="M8 11h8M8 15h5"/>',
    views: [
      { id: "movimentos", sheet: "Movimentos Investimentos",  label: "Movimentos", render: "movimentos",  expect: /^data$/i },
      { id: "categorias", sheet: "Movimentos Investimentos",  label: "Categorias", render: "categorias",  expect: /^data$/i },
      { id: "socios",     sheet: "Sócios - Contas Correntes", label: "Sócios",     render: "socios",      expect: /^s[óo]cio$/i },
      { id: "plano",      sheet: "Investimentos Iniciais",    label: "Plano",      render: "plano",       expect: /^item$/i },
      { id: "acertos",    sheet: "Acertos entre Sócios",      label: "Acertos",    render: "acertos",     expect: /^data$/i },
    ] },
  /* Áreas futuras: soon:true mostra "Em breve" e não carrega dados.
     Para ativar, remover soon e preencher views com as folhas do Excel:
     views: [{ id: "faturas", sheet: "Faturas", label: "Faturas", render: "auto" }] */
  { id: "faturacao", label: "Faturação", soon: true, views: [],
    icon: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>' },
];
const ALL_VIEWS = NAV.flatMap(g => g.views);
/* folhas de que cada área precisa: as das suas vistas + as que cruza (needs) */
function groupSheets(g) {
  return [...new Set([...g.views.map(v => v.sheet), ...(g.needs || [])].filter(Boolean))];
}
/* o Resumo cruza dados de várias áreas */
const RESUMO_SHEETS = ["Resumo", "Movimentos Investimentos", "Sócios - Contas Correntes",
                       "Investimentos Iniciais", "Viagens"];

/* Cores fixas por sócio (ordem fixa — nunca reciclar) */
const SOCIO_COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)",
                      "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
const socioColorIndex = new Map();
function socioColor(name) {
  const key = (name || "").trim();
  if (!socioColorIndex.has(key)) socioColorIndex.set(key, socioColorIndex.size % SOCIO_COLORS.length);
  return SOCIO_COLORS[socioColorIndex.get(key)];
}

/* =====================================================================
   DADOS — cada folha é lida do Google Sheets em CSV.
   Requer partilha "Qualquer pessoa com o link → Leitor".
   ?src=<base-url> permite testar com CSVs locais (<base>/<folha>.csv).
   ===================================================================== */
const SRC_OVERRIDE = new URLSearchParams(location.search).get("src");

function csvUrl(sheetName) {
  if (SRC_OVERRIDE) return SRC_OVERRIDE.replace(/\/$/, "") + "/" + encodeURIComponent(sheetName) + ".csv";
  return "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
         "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName) +
         "&t=" + Date.now();  // evita cache
}

/* Parser CSV (RFC 4180: aspas, vírgulas e quebras de linha em células) */
function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

/* Números em formato PT: "1 422 500", "25,0%", "(7 545)", "-" */
function parseNum(v) {
  if (v == null) return null;
  let s = String(v).replace(/[\s  ]/g, "").replace(/(MZN|MT)/gi, "");
  if (s === "" || s === "-" || s === "—") return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.startsWith("-")) { neg = true; s = s.slice(1); }
  const pct = s.endsWith("%");
  if (pct) s = s.slice(0, -1);
  // vírgula = decimal; ponto pode ser milhares ou decimal
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return (neg ? -n : n);
}

/* milhares separados por espaço, como no Excel: 2 500 / 1 422 500 */
function fmtMZN(n) {
  if (n == null || isNaN(n)) return "—";
  const abs = String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (n < 0 ? "−" : "") + abs;
}
function fmtPct(n) { return n == null ? "—" : String(Math.round(n)) + "%"; }

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* Encontra a linha de cabeçalho cuja 1.ª célula preenchida é `firstCol` */
function findHeaderRow(rows, firstCol) {
  const want = firstCol.toLowerCase();
  for (let i = 0; i < rows.length; i++) {
    const first = (rows[i].find(c => c && c.trim()) || "").trim().toLowerCase();
    if (first === want) return i;
  }
  return -1;
}
function colIndex(header, name) {
  const want = name.toLowerCase();
  return header.findIndex(h => (h || "").trim().toLowerCase().includes(want));
}
function isRowEmpty(r) { return !r || r.every(c => !c || !c.trim()); }

/* ---------- fetch com cache local (funciona offline) ---------- */
const CACHE_PREFIX = "nl_sheet_";

async function loadSheet(sheetName, force) {
  const key = CACHE_PREFIX + sheetName;
  try {
    const res = await fetch(csvUrl(sheetName), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (/<html/i.test(text.slice(0, 300))) throw new Error("acesso negado");
    const rows = parseCSV(text);
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), rows })); } catch (e) {}
    return { rows, fromCache: false, time: Date.now() };
  } catch (err) {
    const cached = localStorage.getItem(key);
    if (cached && !force) {
      const { t, rows } = JSON.parse(cached);
      return { rows, fromCache: true, time: t };
    }
    throw err;
  }
}

/* =====================================================================
   EXTRATORES — transformam as linhas CSV de cada folha em dados
   estruturados (reutilizados pelos renders e pelo dashboard do Resumo)
   ===================================================================== */
/* nomes dos sócios, lidos da folha "Sócios - Contas Correntes" */
function socioNames() {
  const sr = state.data["Sócios - Contas Correntes"] || null;
  const s = sr ? extractSocios(sr) : null;
  return s ? s.map(x => x.nome) : [];
}

function extractMovs(rows) {
  const h = findHeaderRow(rows, "Data");
  if (h < 0) return null;
  const header = rows[h];
  const iData = colIndex(header, "data"), iItem = colIndex(header, "item"),
        iDesc = colIndex(header, "descrição") >= 0 ? colIndex(header, "descrição") : colIndex(header, "descricao"),
        iVal = colIndex(header, "valor"), iPor = colIndex(header, "pago por"),
        iTipo = colIndex(header, "tipo"),
        iCat = colIndex(header, "categoria"),
        iVF = header.findIndex(h => /^\s*(vf|viagem)\s*$/i.test((h || "").trim()));

  /* Formato novo: uma coluna por sócio com o valor pago por esse sócio
     nessa linha (permite vários pagadores num movimento). As colunas são
     detetadas pelos nomes dos sócios; "Quota X" / "Verificação" ficam de fora. */
  const names = socioNames();
  const socioCols = [];
  header.forEach((cell, i) => {
    const t = (cell || "").trim();
    if (!t || /quota|verifica|%/i.test(t)) return;
    const match = names.find(n =>
      t.toLowerCase() === n.toLowerCase() || t.toLowerCase().includes(n.toLowerCase()));
    if (match) socioCols.push({ name: match, i });
  });

  const movs = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const item = (r[iItem] || "").trim();
    const base = {
      data: (r[iData] || "").trim(),
      item,
      desc: iDesc >= 0 ? (r[iDesc] || "").trim() : "",
      tipo: iTipo >= 0 ? (r[iTipo] || "").trim() : "",
      categoria: iCat >= 0 ? (r[iCat] || "").trim() : "",
      viagem: iVF >= 0 ? tripCode((r[iVF] || "").trim()) : "",
    };
    if (socioCols.length) {
      if (!item || /^TOTAL/.test(item)) continue; // ignora vazias e linhas de totais
      const pagadores = [];
      for (const c of socioCols) {
        const val = parseNum(r[c.i]);
        if (val != null && val !== 0) pagadores.push({ por: c.name, val });
      }
      if (pagadores.length) movs.push({ ...base,
        total: pagadores.reduce((a, p) => a + p.val, 0), pagadores });
    } else {
      /* formato antigo: coluna única "Valor Pago" + "Pago por" */
      const val = parseNum(r[iVal]);
      const por = (r[iPor] || "").trim();
      if (val == null || val === 0 || !por) continue; // ignora linhas de fórmula vazias
      movs.push({ ...base, total: val, pagadores: [{ por, val }] });
    }
  }
  /* as colunas Tipo/Categoria são opcionais: só existem se estiverem preenchidas */
  movs.hasTipo = iTipo >= 0 && movs.some(m => m.tipo);
  movs.hasCat = iCat >= 0 && movs.some(m => m.categoria);
  return movs;
}
/* normaliza o tipo para uma das quatro famílias conhecidas */
function tipoNorm(t) {
  const s = deaccent(t);
  if (/investiment|capex|imobiliz/.test(s)) return "Investimento";
  if (/despesa|custo|opex|gasto/.test(s)) return "Despesa";
  if (/supriment|entrada|aporte|capital/.test(s)) return "Suprimento";
  if (/recebiment|receita|faturad/.test(s)) return "Recebimento";
  return t.trim() || "";
}
const TIPO_COR = {
  "Investimento": "var(--s1)", "Despesa": "var(--s2)",
  "Suprimento": "var(--s3)", "Recebimento": "var(--s6)",
};

function extractPlano(rows) {
  const h = findHeaderRow(rows, "Item");
  if (h < 0) return null;
  const header = rows[h];
  const iItem = colIndex(header, "item"), iTipo = colIndex(header, "tipo"),
        iTot = colIndex(header, "valor total"), iPago = colIndex(header, "já pago") >= 0 ? colIndex(header, "já pago") : colIndex(header, "pago"),
        iFalta = colIndex(header, "falta"), iSit = colIndex(header, "situação") >= 0 ? colIndex(header, "situação") : colIndex(header, "situacao");
  const items = [], totals = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const name = (r[iItem] || "").trim();
    if (!name) continue;
    const rec = {
      name, tipo: (r[iTipo] || "").trim(),
      total: parseNum(r[iTot]), pago: parseNum(r[iPago]), falta: parseNum(r[iFalta]),
      sit: iSit >= 0 ? (r[iSit] || "").trim() : ""
    };
    // linhas de totais começam por TOTAL/DESPESA em maiúsculas ("Despesas Extras" é um item)
    if (/^(TOTAL|DESPESAS?)(\s|$)/.test(name)) {
      const nums = r.map(parseNum).filter(n => n != null);
      totals.push({ name, total: rec.total, pago: rec.pago, falta: rec.falta, nums });
    } else items.push(rec);
  }
  return { items, totals };
}

function extractSocios(rows) {
  const h = findHeaderRow(rows, "Sócio");
  if (h < 0) return null;
  const header = rows[h];
  const iNome = colIndex(header, "sócio") >= 0 ? colIndex(header, "sócio") : colIndex(header, "socio"),
        iPart = colIndex(header, "participação") >= 0 ? colIndex(header, "participação") : colIndex(header, "participacao"),
        iPago = colIndex(header, "pago"), iQuota = colIndex(header, "quota"),
        iSaldo = colIndex(header, "saldo"), iSit = colIndex(header, "situação") >= 0 ? colIndex(header, "situação") : colIndex(header, "situacao");
  const socios = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const nome = (r[iNome] || "").trim();
    if (!nome || /^total/i.test(nome)) continue;
    socios.push({
      nome, part: (r[iPart] || "").trim(),
      pago: parseNum(r[iPago]), quota: parseNum(r[iQuota]),
      saldo: parseNum(r[iSaldo]), sit: iSit >= 0 ? (r[iSit] || "").trim() : ""
    });
  }
  return socios;
}

/* dados já carregados de outra view (null se ainda não disponíveis) */
function sheetRows(viewId) {
  const v = ALL_VIEWS.find(x => x.id === viewId);
  return v ? (state.data[v.sheet] || null) : null;
}

/* --- Resumo: dashboard geral ---
   Indicadores vêm da folha "Resumo"; alertas, sócios, últimos movimentos
   e próximos pagamentos são calculados das outras folhas já carregadas. */
function renderResumo(rows) {
  const pairs = [];
  for (const r of rows) {
    const cells = r.map(c => (c || "").trim()).filter(Boolean);
    if (cells.length >= 2) {
      const val = parseNum(cells[cells.length - 1]);
      if (val != null && !/^\d/.test(cells[0])) pairs.push([cells[0], val]);
    }
  }
  const find = re => { const p = pairs.find(([l]) => re.test(l)); return p ? p[1] : null; };
  const total  = find(/total\s+investimento/i);
  const pago   = find(/j[áa]\s*investido/i);
  const falta  = find(/falta\s*investir/i);
  const mensal = find(/despesa\s*recorrente/i);
  const alvo   = find(/contribui[çc][ãa]o\s*alvo/i);
  const pct = (total && pago != null) ? Math.max(0, Math.min(100, pago / total * 100)) : null;

  /* dados das outras folhas (podem ainda não estar carregados) */
  const movRows = sheetRows("movimentos"), socRows = sheetRows("socios"), plRows = sheetRows("plano");
  const movs   = movRows ? (extractMovs(movRows) || []) : [];
  const socios = socRows ? (extractSocios(socRows) || []) : [];
  const plano  = plRows ? extractPlano(plRows) : null;
  socios.forEach(s => socioColor(s.nome));

  let html = "";

  /* --- Alertas --- */
  const emFalta = socios.filter(s => s.saldo != null && s.saldo < 0);
  const totalEmFalta = emFalta.reduce((a, s) => a - s.saldo, 0);
  const porConfirmar = plano ? plano.items.filter(it => /confirmar/i.test(it.sit) && (it.falta || 0) > 0) : [];
  const valorPorConfirmar = porConfirmar.reduce((a, it) => a + (it.falta || 0), 0);
  const td = tripsData();
  const opTrips = td ? tripsInPeriod(td) : [];
  const negativas = opTrips.filter(t => { const m = tripMargin(t); return m != null && m < 0; });

  const alertas = [];
  if (negativas.length) alertas.push({ goto: "viagens:viagens",
    txt: `<b>${negativas.length} viage${negativas.length > 1 ? "ns" : "m"}</b> com margem negativa — <b>${fmtMZN(negativas.reduce((a, t) => a - tripMargin(t), 0))} MZN</b> de prejuízo` });
  if (emFalta.length) alertas.push({ goto: "contas:socios",
    txt: `<b>${emFalta.length} sócio${emFalta.length > 1 ? "s" : ""}</b> com contribuição em falta — total <b>${fmtMZN(totalEmFalta)} MZN</b>` });
  if (porConfirmar.length) alertas.push({ goto: "contas:plano",
    txt: `<b>${porConfirmar.length} ${porConfirmar.length > 1 ? "itens" : "item"}</b> do plano por confirmar — <b>${fmtMZN(valorPorConfirmar)} MZN</b> por pagar` });
  if (alertas.length) {
    html += `<div class="card" style="border-left:4px solid var(--serious);padding-left:13px">` +
      alertas.map((a, i) => `<div class="goto" data-goto="${a.goto}" style="display:flex;align-items:center;gap:8px;padding:6px 0;${i < alertas.length - 1 ? "border-bottom:1px solid var(--hairline);" : ""}cursor:pointer">
        <span style="color:var(--serious);font-weight:800">!</span>
        <span style="flex:1;font-size:13px;line-height:1.4">${a.txt}</span>
        <span style="color:var(--ink-muted)">›</span>
      </div>`).join("") + `</div>`;
  } else if (socios.length) {
    html += `<div class="card" style="display:flex;align-items:center;gap:8px">
      <span class="status good" style="font-size:13px">✓ Tudo em dia</span>
      <span style="font-size:12px;color:var(--ink-muted)">— sem contribuições em falta</span>
    </div>`;
  }

  /* --- Operação (viagens) --- */
  if (opTrips.length) {
    const rec = opTrips.reduce((a, t) => a + (t.receita || 0), 0);
    const des = opTrips.reduce((a, t) => a + (t.despesa || 0), 0);
    const km  = opTrips.reduce((a, t) => a + (t.km || 0), 0);
    const marg = td.hasReceita ? rec - des : null;
    html += `<div class="section-title">Operação</div>
      <div class="card goto" data-goto="viagens:viagens" style="cursor:pointer">
        <div style="display:flex;gap:18px;flex-wrap:wrap">
          <div><div style="font-size:11px;color:var(--ink-muted)">Viagens</div><b style="font-size:19px">${opTrips.length}</b></div>
          ${km ? `<div><div style="font-size:11px;color:var(--ink-muted)">Km</div><b style="font-size:19px">${fmtMZN(km)}</b></div>` : ""}
          ${marg != null ? `<div><div style="font-size:11px;color:var(--ink-muted)">Margem</div>
            <b style="font-size:19px;color:${marg >= 0 ? "var(--good-text)" : "var(--serious)"}">${fmtMZN(marg)}</b></div>` : ""}
          ${marg != null && km ? `<div><div style="font-size:11px;color:var(--ink-muted)">Margem/km</div><b style="font-size:19px">${fmtNumRaw((marg / km).toFixed(2))}</b></div>` : ""}
        </div>
        <div style="font-size:11.5px;color:var(--accent);font-weight:650;margin-top:10px">Ver viagens ›</div>
      </div>`;
  }

  /* --- Execução do investimento --- */
  if (total != null || pago != null) {
    html += `<div class="card">
      <div class="t-label" style="font-size:12px;color:var(--ink-2)">Execução do investimento</div>
      <div style="font-size:28px;font-weight:800;letter-spacing:-0.01em;margin-top:4px">
        ${pct != null ? fmtPct(pct) : "—"} <span style="font-size:13px;font-weight:600;color:var(--ink-muted)">realizado</span>
      </div>
      <div class="bar"><i style="width:${pct ?? 0}%"></i></div>
      <div class="bar-legend">
        <span>Investido: <b>${fmtMZN(pago)}</b> MZN</span>
        <span>Total: <b>${fmtMZN(total)}</b> MZN</span>
      </div>
    </div>`;
  }

  /* --- Indicadores --- */
  const acumulado = movs.length ? movs.reduce((a, m) => a + m.total, 0) : null;
  const ultimaData = [...movs].reverse().find(m => m.data)?.data;
  html += `<div class="tiles">
    ${tile("Já Investido (Pago)", pago, null, "MZN")}
    ${tile("Falta Investir", falta, null, "MZN")}
    ${tile("Total CAPEX Estimado", total, null, "MZN")}
    ${tile("Despesa Mensal (fase inicial)", mensal, null, "MZN")}
    ${acumulado != null ? tile("Investimento Acumulado (movimentos)", acumulado,
        ultimaData ? "Último movimento: " + ultimaData : null, "MZN") : ""}
    ${alvo != null ? tile("Contribuição Alvo por Sócio", alvo, "Participação igual · 25% por sócio", "MZN") : ""}
  </div>`;

  /* --- Sócios num relance --- */
  if (socios.length) {
    html += `<div class="section-title">Sócios</div>
    <div class="card"><div class="glance">` +
      socios.map(s => {
        const credor = s.saldo != null && s.saldo > 0;
        const emDia = s.saldo != null && s.saldo === 0;
        const cor = credor ? "var(--good-text)" : emDia ? "var(--ink)" : "var(--serious)";
        return `<div class="goto glance-item" data-goto="contas:socios">
          <div class="avatar" style="background:${socioColor(s.nome)};width:38px;height:38px;font-size:13px">${esc(s.nome.slice(0, 2).toUpperCase())}</div>
          <div class="g-name">${esc(s.nome)}</div>
          <div class="g-saldo" style="color:${cor}">${fmtMZN(s.saldo)}</div>
        </div>`;
      }).join("") + `</div>
      <div style="font-size:10.5px;color:var(--ink-muted);text-align:center;margin-top:8px">Saldo em MZN · verde = a receber · laranja = falta contribuir</div>
    </div>`;
  }

  /* --- Últimos movimentos --- */
  if (movs.length) {
    const ultimos = movs.slice(-3).reverse();
    html += `<div class="section-title">Últimos movimentos</div><div class="card">` +
      ultimos.map(m => `<div class="mov">
        <div class="m-main">
          <div class="m-item" style="font-size:13px">${esc(m.item)}</div>
          ${m.data ? `<div class="m-date">${esc(m.data)}</div>` : ""}
        </div>
        <div class="m-side">
          <div class="m-val" style="font-size:13px">${fmtMZN(m.total)}</div>
          <div style="font-size:11px;color:var(--ink-muted);margin-top:2px;text-align:right">
            ${m.pagadores.map(p => `<span class="dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${socioColor(p.por)};margin-right:3px"></span>${esc(p.por)}`).join(" ")}</div>
        </div>
      </div>`).join("") +
      `<div class="goto" data-goto="contas:movimentos" style="text-align:center;padding:10px 0 2px;font-size:13px;font-weight:650;color:var(--accent);cursor:pointer">Ver todos os movimentos ›</div>
    </div>`;
  }

  /* --- Próximos pagamentos (maiores valores em falta do plano) --- */
  if (plano) {
    const pendentes = plano.items.filter(it => (it.falta || 0) > 0)
      .sort((a, b) => b.falta - a.falta).slice(0, 4);
    if (pendentes.length) {
      const maxFalta = pendentes[0].falta;
      html += `<div class="section-title">Próximos pagamentos</div>
      <div class="card goto" data-goto="contas:plano" style="cursor:pointer">` +
        pendentes.map((it, i) => `<div style="padding:8px 0;${i < pendentes.length - 1 ? "border-bottom:1px solid var(--hairline)" : ""}">
          <div style="display:flex;justify-content:space-between;gap:10px;font-size:13px">
            <span style="flex:1;min-width:0">${esc(it.name)}</span>
            <b style="font-variant-numeric:tabular-nums;white-space:nowrap">${fmtMZN(it.falta)} <small style="font-weight:600;color:var(--ink-muted)">MZN</small></b>
          </div>
          <div class="bar" style="height:5px;margin-top:6px"><i style="width:${Math.max(3, it.falta / maxFalta * 100)}%"></i></div>
        </div>`).join("") + `</div>`;
    }
  }

  /* restantes indicadores da folha Resumo que não reconhecemos */
  const known = /total\s+investimento|j[áa]\s*investido|falta\s*investir|despesa\s*recorrente|contribui[çc][ãa]o\s*alvo/i;
  const extras = pairs.filter(([l]) => !known.test(l));
  if (extras.length) {
    html += `<div class="section-title">Outros indicadores</div><div class="card">` +
      extras.map(([l, v], i) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;${i < extras.length - 1 ? "border-bottom:1px solid var(--hairline);" : ""}font-size:13px">
        <span style="color:var(--ink-2)">${esc(l)}</span><b style="font-variant-numeric:tabular-nums;white-space:nowrap">${fmtMZN(v)}</b>
      </div>`).join("") + `</div>`;
  }
  return html || emptyState("Sem dados no Resumo");
}
function tile(label, value, sub, unit) {
  return `<div class="tile">
    <div class="t-label">${esc(label)}</div>
    <div class="t-value">${fmtMZN(value)}${unit ? `<small>${unit}</small>` : ""}</div>
    ${sub ? `<div class="t-sub">${esc(sub)}</div>` : ""}
  </div>`;
}

/* --- Movimentos: o livro de contas, filtrável por sócio, tipo e categoria --- */
let movFilter = "Todos";   // sócio
let movTipo = "Todos";     // Investimento / Despesa / Suprimento / Recebimento
let movCat = null;         // categoria escolhida na vista Categorias

function renderMovimentos(rows) {
  const movs = extractMovs(rows);
  if (movs == null) return renderAuto(rows);
  if (!movs.length) return emptyState("Ainda não há movimentos registados.");

  /* sócios presentes, pela ordem da folha de contas correntes */
  const ordem = socioNames();
  const presentes = [...new Set(movs.flatMap(m => m.pagadores.map(p => p.por)))];
  const socios = [...ordem.filter(n => presentes.includes(n)),
                  ...presentes.filter(n => !ordem.includes(n))];
  socios.forEach(socioColor); // fixa a ordem das cores

  const shown = movs.filter(m =>
    (movFilter === "Todos" || m.pagadores.some(p => p.por === movFilter)) &&
    (movTipo === "Todos" || tipoNorm(m.tipo) === movTipo) &&
    (!movCat || m.categoria === movCat));
  /* com filtro de sócio ativo, conta apenas a parte desse sócio */
  const valorDe = m => movFilter === "Todos" ? m.total
    : (m.pagadores.find(p => p.por === movFilter)?.val ?? 0);
  const total = shown.reduce((s, m) => s + valorDe(m), 0);

  const chips = ["Todos", ...socios].map(s =>
    `<button class="${movFilter === s ? "on" : ""}" data-socio="${esc(s)}">
       ${s !== "Todos" ? `<span class="dot" style="background:${socioColor(s)}"></span>` : ""}${esc(s)}
     </button>`).join("");

  const tipos = movs.hasTipo
    ? [...new Set(movs.map(m => tipoNorm(m.tipo)).filter(Boolean))] : [];
  const tipoChips = tipos.length ? `<div class="filters" id="movTipos">
    ${["Todos", ...tipos].map(t => `<button class="${movTipo === t ? "on" : ""}" data-tipo="${esc(t)}">
      ${t !== "Todos" && TIPO_COR[t] ? `<span class="dot" style="background:${TIPO_COR[t]}"></span>` : ""}${esc(t)}
    </button>`).join("")}</div>` : "";

  const catAtiva = movCat ? `<div class="card" style="display:flex;align-items:center;gap:8px;padding:10px 14px">
      <span style="font-size:12px;color:var(--ink-2)">Categoria:</span>
      <b style="font-size:13px;flex:1">${esc(movCat)}</b>
      <button data-cat-clear class="chip" style="cursor:pointer;font-size:12px;padding:6px 11px">Limpar ✕</button>
    </div>` : "";

  const list = shown.map(m => {
    const v = valorDe(m);
    const tn = tipoNorm(m.tipo);
    const payers = m.pagadores.map(p =>
      `<span class="chip" style="${movFilter === p.por ? "border-color:" + socioColor(p.por) : ""}">
        <span class="dot" style="background:${socioColor(p.por)}"></span>${esc(p.por)}${m.pagadores.length > 1 ? ` · ${fmtMZN(p.val)}` : ""}
      </span>`).join("");
    const marcas = [
      tn ? `<span class="chip" style="font-size:10.5px;padding:3px 7px;${TIPO_COR[tn] ? `border-color:${TIPO_COR[tn]};color:${TIPO_COR[tn]};background:transparent` : ""}">${esc(tn)}</span>` : "",
      m.categoria ? `<span class="chip" style="font-size:10.5px;padding:3px 7px">${esc(m.categoria)}</span>` : "",
      m.viagem ? `<span class="chip" data-viagem-cod="${esc(m.viagem)}" style="font-size:10.5px;padding:3px 7px;cursor:pointer;border-color:var(--accent);color:var(--accent)">${esc(m.viagem)} ›</span>` : "",
    ].filter(Boolean).join("");
    return `<div class="mov" style="flex-wrap:wrap">
      <div class="m-main">
        <div class="m-item">${esc(m.item)}</div>
        ${m.desc ? `<div class="m-desc">${esc(m.desc)}</div>` : ""}
        ${m.data ? `<div class="m-date">${esc(m.data)}</div>` : ""}
      </div>
      <div class="m-side">
        <div class="m-val">${fmtMZN(v)} <small style="font-weight:600;color:var(--ink-muted)">MZN</small></div>
        ${v !== m.total ? `<div style="font-size:11px;color:var(--ink-muted);margin-top:2px">de ${fmtMZN(m.total)} no total</div>` : ""}
      </div>
      <div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:5px;margin-top:7px">${marcas}${payers}</div>
    </div>`;
  }).join("");

  const rotulo = [movFilter !== "Todos" && movFilter, movTipo !== "Todos" && movTipo]
    .filter(Boolean).join(" · ");

  return `<div class="filters" id="movFilters">${chips}</div>${tipoChips}${catAtiva}
    <div class="card" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <span style="font-size:12px;color:var(--ink-2)">${shown.length} movimento${shown.length === 1 ? "" : "s"}${rotulo ? " · " + esc(rotulo) : ""}</span>
      <b style="font-size:16px;font-variant-numeric:tabular-nums">${fmtMZN(total)} <small style="font-size:11px;color:var(--ink-muted)">MZN</small></b>
    </div>
    ${shown.length ? `<div class="card">${list}</div>` : emptyState("Sem movimentos com estes filtros.")}
    ${!movs.hasTipo ? `<p style="font-size:11px;color:var(--ink-muted);text-align:center;margin:4px 8px 8px;line-height:1.5">
      Acrescenta as colunas <b>Tipo</b> (Investimento / Despesa / Suprimento) e <b>Categoria</b>
      a esta folha para separares o que é investimento do que é despesa.</p>` : ""}`;
}

/* --- Categorias: para onde foi o dinheiro --- */
function renderCategorias(rows) {
  const movs = extractMovs(rows);
  if (movs == null) return renderAuto(rows);
  if (!movs.length) return emptyState("Ainda não há movimentos registados.");

  if (!movs.hasCat && !movs.hasTipo) {
    return `<div class="state">
      <div class="icon">🏷️</div>
      <h3>Falta classificar os movimentos</h3>
      <p>Acrescenta à folha <b>Movimentos Investimentos</b> as colunas <b>Tipo</b>
         (Investimento, Despesa, Suprimento, Recebimento) e <b>Categoria</b>
         (Camião, Combustível, Portagens, Motorista, Manutenção…).</p>
      <p class="hint">Assim que as preencheres, esta vista mostra para onde foi o dinheiro,
         e podes tocar numa categoria para ver os movimentos dela.</p>
    </div>`;
  }

  let html = "";

  /* por tipo */
  if (movs.hasTipo) {
    const porTipo = new Map();
    for (const m of movs) {
      const t = tipoNorm(m.tipo) || "Sem tipo";
      porTipo.set(t, (porTipo.get(t) || 0) + m.total);
    }
    const lista = [...porTipo.entries()].sort((a, b) => b[1] - a[1]);
    const soma = lista.reduce((a, [, v]) => a + v, 0) || 1;
    html += `<div class="section-title">Por tipo</div><div class="card">` +
      lista.map(([t, v], i) => `<div data-tipo-goto="${esc(t)}" style="cursor:pointer;padding:9px 0;${i < lista.length - 1 ? "border-bottom:1px solid var(--hairline)" : ""}">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px">
          <span style="display:flex;align-items:center;gap:7px;min-width:0">
            <span class="dot" style="width:9px;height:9px;border-radius:50%;background:${TIPO_COR[t] || "var(--ink-muted)"};flex:none"></span>
            <b style="font-weight:650">${esc(t)}</b></span>
          <b style="font-variant-numeric:tabular-nums;white-space:nowrap">${fmtMZN(v)} <small style="font-weight:600;color:var(--ink-muted)">MZN</small></b>
        </div>
        <div class="bar" style="height:6px;margin-top:6px"><i style="width:${v / soma * 100}%;background:${TIPO_COR[t] || "var(--accent)"}"></i></div>
      </div>`).join("") + `</div>`;
  }

  /* por categoria */
  if (movs.hasCat) {
    const porCat = new Map();
    for (const m of movs) {
      const c = m.categoria || "Sem categoria";
      if (!porCat.has(c)) porCat.set(c, { total: 0, n: 0 });
      const e = porCat.get(c);
      e.total += m.total; e.n++;
    }
    const lista = [...porCat.entries()].sort((a, b) => b[1].total - a[1].total);
    const maior = lista[0][1].total || 1;
    html += `<div class="section-title">Por categoria</div><div class="card">` +
      lista.map(([c, e], i) => `<div data-cat="${esc(c)}" style="cursor:pointer;padding:9px 0;${i < lista.length - 1 ? "border-bottom:1px solid var(--hairline)" : ""}">
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:13.5px">
          <span style="min-width:0"><b style="font-weight:650">${esc(c)}</b>
            <span style="color:var(--ink-muted);font-size:11.5px"> · ${e.n} movimento${e.n === 1 ? "" : "s"}</span></span>
          <b style="font-variant-numeric:tabular-nums;white-space:nowrap">${fmtMZN(e.total)}</b>
        </div>
        <div class="bar" style="height:6px;margin-top:6px"><i style="width:${e.total / maior * 100}%"></i></div>
      </div>`).join("") + `</div>
      <p style="font-size:11px;color:var(--ink-muted);text-align:center;margin:2px 8px 8px">Toca numa categoria para ver os movimentos dela.</p>`;
  }
  return html;
}

/* --- Viagens: lista → detalhe → abastecimentos ---
   A folha "Viagens" tem uma linha por viagem. A lista mostra os campos
   principais; tocar numa viagem abre o detalhe completo, e daí o botão
   "Abastecimentos" abre a folha com o código da viagem no ficheiro
   "planilha de abastecimentos". */
const viagemNav = { mode: "lista", sel: null };
const abastCache = {};

/* Código canónico da viagem. A coluna "VF" pode conter só o número (50)
   ou já o código completo (VF50); em ambos os casos fica "VF50", que é
   como as folhas da planilha de abastecimentos estão nomeadas. */
function tripCode(raw) {
  const s = String(raw || "").trim();
  if (!s) return "";
  const m = s.match(/^(?:vf[\s\-_]*)?0*(\d+)$/i);
  return m ? "VF" + m[1] : s;
}

function extractViagens(rows) {
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 8); i++) {
    if (rows[i].some(c => /c[óo]digo|^\s*vf\s*$/i.test(c || ""))) { h = i; break; }
  }
  if (h < 0) {
    let best = 0;
    rows.slice(0, 8).forEach((r, i) => {
      const filled = r.filter(c => c && c.trim()).length;
      if (filled > best) { best = filled; h = i; }
    });
    if (best < 2) return null;
  }
  const cols = rows[h].map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  if (!cols.length) return null;
  /* coluna do código: cabeçalho "VF" ou "Código"; senão, a coluna cujos
     valores têm o formato VF+número (os códigos são sempre VF##) */
  let iCod = cols.find(c => /^vf$/i.test(c.name) || /c[óo]digo/i.test(c.name))?.i;
  if (iCod == null) {
    for (const c of cols) {
      const vals = rows.slice(h + 1, h + 6).map(r => (r[c.i] || "").trim()).filter(Boolean);
      if (vals.length && vals.every(v => /^vf[-\s]?\d+/i.test(v))) { iCod = c.i; break; }
    }
  }
  if (iCod == null) iCod = cols[0].i;
  const trips = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const raw = (r[iCod] || "").trim();
    if (/^TOTAL/i.test(raw)) continue;
    if (!raw && r.filter(c => c && c.trim()).length < 2) continue;
    trips.push({ cod: tripCode(raw), row: r });
  }
  return { cols, iCod, trips };
}

/* campos preferidos na lista (por ordem) */
const VG_PRIOR = [/data|partida/i, /matr[íi]cula|viatura/i, /motorista/i, /rota|origem|destino|percurso|prov[íi]ncia/i, /cliente/i, /estado|situa/i];

/* ---------- utilitários de colunas e datas ---------- */
function findCol(cols, ...patterns) {
  for (const p of patterns) {
    const c = cols.find(c => p.test(c.name));
    if (c) return c.i;
  }
  return -1;
}
function parseDate(s) {
  const m = String(s || "").trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (!m) return null;
  let y = +m[3]; if (y < 100) y += 2000;
  const d = new Date(y, +m[2] - 1, +m[1]);
  return isNaN(d.getTime()) ? null : d;
}

const PERIODS = [
  { id: "all", label: "Tudo" },
  { id: "m",   label: "Este mês" },
  { id: "3m",  label: "3 meses" },
  { id: "y",   label: "Este ano" },
];
function inPeriod(d, period) {
  if (period === "all" || !d) return true;
  const now = new Date();
  if (period === "m")  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  if (period === "y")  return d.getFullYear() === now.getFullYear();
  if (period === "3m") { const lim = new Date(now); lim.setMonth(lim.getMonth() - 3); return d >= lim; }
  return true;
}

/* ---------- viagens enriquecidas (base de toda a área operacional) ---------- */
function tripsData() {
  const rows = state.data["Viagens"];
  if (!rows) return null;
  const vg = extractViagens(rows);
  if (!vg) return null;
  const C = vg.cols;
  const ix = {
    data:      findCol(C, /^partida$/i, /data.*partida/i, /^data$/i, /data/i),
    motorista: findCol(C, /motorista|condutor/i),
    viatura:   findCol(C, /viatura|matr[íi]cula|ve[íi]culo|camia/i),
    cliente:   findCol(C, /cliente/i),
    rota:      findCol(C, /prov[íi]ncia|rota|percurso|destino/i),
    km:        findCol(C, /^km$/i, /km\s*(percorrid|total|viagem)/i, /quil[óo]metr/i),
    receita:   findCol(C, /receita|frete|faturad/i, /valor\s*(da\s*)?(viagem|servi|frete)/i),
    despesa:   findCol(C, /despesas?\s*total/i, /^despesas?/i),
    saldoMot:  findCol(C, /saldo\s*final\s*motorista/i, /saldo\s*motorista/i),
    estado:    findCol(C, /estado|situa/i),
  };
  const get = (r, i) => i >= 0 ? (r[i] || "").trim() : "";
  const num = (r, i) => i >= 0 ? parseNum(r[i]) : null;
  const trips = vg.trips.map((t, idx) => ({
    idx, cod: t.cod, row: t.row,
    dataTxt:   get(t.row, ix.data),
    date:      parseDate(get(t.row, ix.data)),
    motorista: get(t.row, ix.motorista),
    viatura:   get(t.row, ix.viatura),
    cliente:   get(t.row, ix.cliente),
    rota:      get(t.row, ix.rota),
    estado:    get(t.row, ix.estado),
    km:        num(t.row, ix.km),
    receita:   num(t.row, ix.receita),
    despesa:   num(t.row, ix.despesa),
    saldoMot:  num(t.row, ix.saldoMot),
  }));
  return { cols: C, ix, trips, hasReceita: ix.receita >= 0, hasKm: ix.km >= 0 };
}
/* viagens dentro do período escolhido */
function tripsInPeriod(td) {
  return td.trips.filter(t => inPeriod(t.date, state.period));
}
function tripMargin(t) {
  if (t.receita == null) return null;
  return t.receita - (t.despesa || 0);
}

/* agrupa viagens por motorista / cliente / viatura */
function entityStats(trips, key) {
  const map = new Map();
  for (const t of trips) {
    const v = (t[key] || "").trim();
    if (!v) continue;
    if (!map.has(v)) map.set(v, { nome: v, trips: [], receita: 0, despesa: 0, km: 0 });
    const e = map.get(v);
    e.trips.push(t);
    e.receita += t.receita || 0;
    e.despesa += t.despesa || 0;
    e.km += t.km || 0;
  }
  return [...map.values()].sort((a, b) => b.trips.length - a.trips.length);
}

/* ---------- viaturas (folha própria) ---------- */
function extractViaturas(rows) {
  if (!rows) return null;
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 8); i++) {
    if (rows[i].some(c => /matr[íi]cula|viatura/i.test(c || ""))) { h = i; break; }
  }
  if (h < 0) {
    let best = 0;
    rows.slice(0, 8).forEach((r, i) => {
      const filled = r.filter(c => c && c.trim()).length;
      if (filled > best) { best = filled; h = i; }
    });
    if (best < 2) return null;
  }
  const cols = rows[h].map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  if (!cols.length) return null;
  const iMat = findCol(cols, /matr[íi]cula/i, /viatura/i) >= 0
    ? findCol(cols, /matr[íi]cula/i, /viatura/i) : cols[0].i;
  const iSeco = findCol(cols, /consumo.*seco/i);
  const iCarr = findCol(cols, /consumo.*carreg/i);
  const iCons = iSeco >= 0 ? iSeco : findCol(cols, /consumo/i);
  const items = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i];
    if (isRowEmpty(r)) continue;
    const mat = (r[iMat] || "").trim();
    if (!mat || /^TOTAL/i.test(mat)) continue;
    items.push({
      mat, row: r,
      consumoSeco: iCons >= 0 ? parseNum(r[iCons]) : null,
      consumoCarr: iCarr >= 0 ? parseNum(r[iCarr]) : null,
    });
  }
  return { cols, iMat, items };
}
/* consumo esperado de uma matrícula (l/100km), se a folha Viaturas o tiver */
function viaturaInfo(mat) {
  const vt = extractViaturas(state.data["Viaturas"]);
  if (!vt) return null;
  const norm = s => String(s || "").toLowerCase().replace(/[\s\-_]/g, "");
  return vt.items.find(v => norm(v.mat) === norm(mat)) || null;
}

/* célula numérica = valor; datas (com / ou -) e texto ficam como estão */
function isNumericCell(raw) {
  const n = parseNum(raw);
  return n != null && /\d/.test(raw) && !/[a-zA-ZÀ-ú]{3,}/.test(raw) && !/[\/:]|\d-\d/.test(raw);
}
/* como fmtMZN, mas preserva as casas decimais quando o original as tem
   (ex.: preço/litro 78,5 não pode virar 79) */
function fmtNumRaw(raw) {
  const n = parseNum(raw);
  if (n == null) return esc(raw);
  if (!/[.,]\d/.test(String(raw).replace(/[\s ]/g, ""))) return fmtMZN(n);
  const [int, dec] = Math.abs(n).toFixed(2).split(".");
  const decTrim = dec.replace(/0+$/, "");
  return (n < 0 ? "−" : "") + int.replace(/\B(?=(\d{3})+(?!\d))/g, " ") +
         (decTrim ? "," + decTrim : "");
}
function fmtCell(raw) {
  return isNumericCell(raw) ? fmtNumRaw(raw) : esc(raw);
}

/* barra de período, partilhada pelas vistas operacionais */
function periodBar() {
  return `<div class="filters" data-periods>
    ${PERIODS.map(p => `<button class="${state.period === p.id ? "on" : ""}" data-period="${p.id}">${esc(p.label)}</button>`).join("")}
  </div>`;
}

/* cartão de uma viagem na lista */
function tripRowHTML(t, keyCols) {
  const margem = tripMargin(t);
  return `<div class="mov" data-viagem-cod="${esc(t.cod)}" style="cursor:pointer;align-items:center">
      <div class="m-main">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${t.cod ? `<span class="chip" style="background:var(--accent);color:#fff;border-color:transparent;font-size:12px;padding:5px 10px;font-weight:700">${esc(t.cod)}</span>` : ""}
          ${t.dataTxt ? `<span style="font-size:11.5px;color:var(--ink-muted)">${esc(t.dataTxt)}</span>` : ""}
          ${margem != null ? `<span class="status ${margem >= 0 ? "good" : "warn"}" style="font-size:11.5px;margin-left:auto">${margem >= 0 ? "+" : ""}${fmtMZN(margem)} MZN</span>` : ""}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:8px">
          ${keyCols.map(c => { const v = (t.row[c.i] || "").trim(); return v ? `
            <div style="font-size:12px;min-width:0"><span style="color:var(--ink-muted)">${esc(c.name)}</span><br><b>${fmtCell(v)}</b></div>` : ""; }).join("")}
        </div>
      </div>
      <div style="color:var(--ink-muted);font-size:20px;flex:none">›</div>
    </div>`;
}

function renderViagens() {
  const td = tripsData();
  if (!td || !td.trips.length) {
    viagemNav.mode = "lista";
    return emptyState("Ainda não há viagens registadas.",
      "As viagens que registares na folha 'Viagens' do Excel aparecem aqui automaticamente.");
  }
  if (viagemNav.mode !== "lista" && !td.trips.find(t => t.cod === viagemNav.sel)) {
    viagemNav.mode = "lista";
  }
  if (viagemNav.mode === "detalhe") return viagemDetalheHTML(td);
  if (viagemNav.mode === "abast") return abastHTML(td);

  const keyCols = [];
  for (const re of VG_PRIOR) {
    if (/data|partida/i.test(re.source)) continue; // a data já vai no topo do cartão
    const c = td.cols.find(c => re.test(c.name) && !keyCols.includes(c));
    if (c) keyCols.push(c);
    if (keyCols.length >= 4) break;
  }

  const shown = tripsInPeriod(td);
  if (!shown.length) {
    return periodBar() + emptyState("Sem viagens neste período.",
      "Escolhe outro período em cima para veres mais viagens.");
  }
  const receita = shown.reduce((a, t) => a + (t.receita || 0), 0);
  const despesa = shown.reduce((a, t) => a + (t.despesa || 0), 0);
  const margem = td.hasReceita ? receita - despesa : null;

  return periodBar() +
    `<div class="card" style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <span style="font-size:12px;color:var(--ink-2)">${shown.length} viage${shown.length === 1 ? "m" : "ns"}</span>
      ${margem != null
        ? `<b style="font-size:15px;font-variant-numeric:tabular-nums;color:${margem >= 0 ? "var(--good-text)" : "var(--serious)"}">${fmtMZN(margem)} <small style="font-size:11px;color:var(--ink-muted)">MZN margem</small></b>`
        : (despesa ? `<b style="font-size:15px;font-variant-numeric:tabular-nums">${fmtMZN(despesa)} <small style="font-size:11px;color:var(--ink-muted)">MZN despesas</small></b>` : "")}
    </div>
    <div class="card">${shown.map(t => tripRowHTML(t, keyCols)).join("")}</div>`;
}

/* ---------- fichas: motoristas, clientes, viaturas ---------- */
const entityNav = { motorista: null, cliente: null, viatura: null };

function entityListHTML(key, titleSing, emptyMsg) {
  const td = tripsData();
  if (!td || !td.trips.length) return emptyState(emptyMsg);
  const shown = tripsInPeriod(td);
  const ents = entityStats(shown, key);
  if (!ents.length) return periodBar() + emptyState(`Sem ${titleSing}s neste período.`);
  return periodBar() + `<div class="card">` + ents.map(e => {
    const margem = td.hasReceita ? e.receita - e.despesa : null;
    return `<div class="mov" data-entity="${esc(key)}" data-entity-name="${esc(e.nome)}" style="cursor:pointer;align-items:center">
      <div class="m-main">
        <div style="font-size:14px;font-weight:650">${esc(e.nome)}</div>
        <div style="font-size:12px;color:var(--ink-2);margin-top:3px">
          ${e.trips.length} viage${e.trips.length === 1 ? "m" : "ns"}${e.km ? ` · ${fmtMZN(e.km)} km` : ""}
        </div>
      </div>
      <div class="m-side">
        ${margem != null ? `<div class="m-val" style="font-size:13px;color:${margem >= 0 ? "var(--good-text)" : "var(--serious)"}">${fmtMZN(margem)}</div>`
                         : (e.despesa ? `<div class="m-val" style="font-size:13px">${fmtMZN(e.despesa)}</div>` : "")}
        <div style="color:var(--ink-muted);font-size:18px">›</div>
      </div>
    </div>`;
  }).join("") + `</div>`;
}

function entityDetailHTML(key, nome, backAttr) {
  const td = tripsData();
  const all = td ? td.trips.filter(t => (t[key] || "").trim() === nome) : [];
  const shown = all.filter(t => inPeriod(t.date, state.period));
  const receita = shown.reduce((a, t) => a + (t.receita || 0), 0);
  const despesa = shown.reduce((a, t) => a + (t.despesa || 0), 0);
  const km = shown.reduce((a, t) => a + (t.km || 0), 0);
  const margem = td && td.hasReceita ? receita - despesa : null;
  /* saldo do motorista: último valor conhecido nas viagens dele */
  const saldos = shown.map(t => t.saldoMot).filter(v => v != null);
  const saldo = key === "motorista" && saldos.length ? saldos[saldos.length - 1] : null;

  const vinfo = key === "viatura" ? viaturaInfo(nome) : null;

  return backBtn(backAttr, "Voltar") + periodBar() +
    `<div class="card">
      <div style="font-size:18px;font-weight:750;letter-spacing:-0.01em">${esc(nome)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px">
        <div><div style="font-size:11.5px;color:var(--ink-muted)">Viagens</div><b style="font-size:15px">${shown.length}</b></div>
        ${km ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Km</div><b style="font-size:15px">${fmtMZN(km)}</b></div>` : ""}
        ${despesa ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Despesas</div><b style="font-size:15px">${fmtMZN(despesa)}</b></div>` : ""}
        ${margem != null ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Margem</div><b style="font-size:15px;color:${margem >= 0 ? "var(--good-text)" : "var(--serious)"}">${fmtMZN(margem)}</b></div>` : ""}
        ${saldo != null ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Saldo do motorista</div><b style="font-size:15px;color:${saldo >= 0 ? "var(--ink)" : "var(--serious)"}">${fmtMZN(saldo)} MZN</b></div>` : ""}
        ${vinfo && vinfo.consumoSeco != null ? `<div><div style="font-size:11.5px;color:var(--ink-muted)">Consumo esperado</div><b style="font-size:15px">${fmtNumRaw(String(vinfo.consumoSeco))} l/100km</b></div>` : ""}
      </div>
    </div>
    ${vinfo ? viaturaFichaHTML(vinfo) : ""}
    <div class="section-title">Viagens</div>
    ${shown.length ? `<div class="card">${shown.map(t => tripRowHTML(t, [])).join("")}</div>`
                   : emptyState("Sem viagens neste período.")}`;
}

/* consumo real da viagem vs o esperado para a viatura */
function consumoHTML(t, header, dataRows) {
  const cols = header.map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  const iLitros = findCol(cols, /litros?/i);
  if (iLitros < 0) return "";
  const litros = dataRows.reduce((a, r) => a + (parseNum(r[iLitros]) || 0), 0);
  if (!litros) return "";

  /* km: da folha de viagens, ou pela diferença de leituras do conta-km */
  let km = t.km;
  if (km == null) {
    const iKm = findCol(cols, /^km$/i, /conta[\s-]?km|od[óo]metro|quil[óo]metr/i);
    if (iKm >= 0) {
      const leituras = dataRows.map(r => parseNum(r[iKm])).filter(v => v != null && v > 0);
      if (leituras.length >= 2) km = Math.max(...leituras) - Math.min(...leituras);
    }
  }
  if (!km) {
    return `<div class="card" style="font-size:12px;color:var(--ink-2)">
      Total de <b style="color:var(--ink)">${fmtNumRaw(String(litros))} litros</b> nesta viagem.
      Para calcular o consumo, acrescenta os <b style="color:var(--ink)">km</b> à folha de viagens
      (ou as leituras do conta-quilómetros aos abastecimentos).</div>`;
  }

  const real = litros / km * 100;               // l/100km
  const v = viaturaInfo(t.viatura);
  const esperado = v ? (v.consumoSeco ?? v.consumoCarr) : null;
  const desvio = esperado ? (real - esperado) / esperado * 100 : null;
  const mau = desvio != null && desvio > 10;

  return `<div class="card">
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <div><div style="font-size:11px;color:var(--ink-muted)">Consumo real</div>
        <b style="font-size:17px">${fmtNumRaw(real.toFixed(1))} <small style="font-size:11px;color:var(--ink-muted)">l/100km</small></b></div>
      ${esperado ? `<div><div style="font-size:11px;color:var(--ink-muted)">Esperado</div>
        <b style="font-size:17px">${fmtNumRaw(String(esperado))} <small style="font-size:11px;color:var(--ink-muted)">l/100km</small></b></div>` : ""}
      <div><div style="font-size:11px;color:var(--ink-muted)">Litros · Km</div>
        <b style="font-size:17px">${fmtNumRaw(String(litros))} · ${fmtMZN(km)}</b></div>
    </div>
    ${desvio != null ? `<div class="status ${mau ? "warn" : "good"}" style="margin-top:10px;font-size:12.5px">
      ${mau ? "!" : "✓"} ${desvio >= 0 ? "+" : ""}${fmtNumRaw(desvio.toFixed(1))}% face ao esperado${mau ? " — vale a pena verificar" : ""}
    </div>` : `<div style="font-size:11.5px;color:var(--ink-muted);margin-top:8px">
      Acrescenta o consumo esperado desta viatura à folha «Viaturas» para veres o desvio.</div>`}
  </div>`;
}

function abastHTML(td) {
  const t = td.trips.find(x => x.cod === viagemNav.sel);
  const code = (t.cod || "").trim();
  const head = `${backBtn("data-abast-back", "Voltar à viagem")}
    <div class="section-title">Abastecimentos · ${esc(code.toUpperCase())}</div>`;
  if (!code) return head + emptyState("Viagem sem código", "Sem código não é possível encontrar a folha de abastecimentos.");

  const entry = abastCache[code.toLowerCase()];
  if (!entry || entry.loading) {
    if (!entry) loadAbastecimentos(code);
    return head + `<div class="card"><div class="skel" style="height:120px"></div></div>`;
  }
  if (entry.err === "config") {
    return head + `<div class="state"><div class="icon">🔗</div><h3>Ficheiro por ligar</h3>
      <p>A "planilha de abastecimentos" ainda não está ligada à app. É preciso partilhar esse ficheiro no Drive («Qualquer pessoa com o link — Leitor») e configurar o ID no site.</p></div>`;
  }
  if (entry.err) {
    return head + emptyState("Sem folha para esta viagem",
      `Não foi encontrada nenhuma folha chamada «${code}» na planilha de abastecimentos. O nome do separador (em baixo, no Google Sheets) tem de ser exatamente o código da viagem — ex.: «${code.toUpperCase()}».`);
  }

  const clean = entry.rows.filter(r => !isRowEmpty(r));
  let hi = 0, best = 0;
  clean.slice(0, 6).forEach((r, i) => {
    const filled = r.filter(c => c && c.trim()).length;
    if (filled > best) { best = filled; hi = i; }
  });
  const header = clean[hi], dataRows = clean.slice(hi + 1);
  if (!dataRows.length) return head + emptyState("Sem abastecimentos registados nesta viagem.");

  /* totais das colunas de litros/valores */
  const totais = header.map((c, i) => ({ name: (c || "").trim(), i }))
    .filter(c => /litro|valor|custo|montante|total/i.test(c.name) &&
                 !/pre[çc]o|\/|m[ée]di|km/i.test(c.name)) // não somar preços/médias
    .map(c => ({ name: c.name, sum: dataRows.reduce((a, r) => a + (parseNum(r[c.i]) || 0), 0) }))
    .filter(c => c.sum > 0);

  return head +
    `<div style="font-size:11px;color:var(--ink-muted);margin:-4px 2px 8px">Folha «${esc(entry.sheetName || code)}» da planilha de abastecimentos</div>` +
    consumoHTML(t, header, dataRows) +
    tableHTML(header, dataRows) +
    (totais.length ? `<div class="card" style="display:flex;flex-wrap:wrap;gap:6px 18px">
      ${totais.map(c => `<div style="font-size:12px;color:var(--ink-2)">${esc(c.name)}: <b style="color:var(--ink);font-variant-numeric:tabular-nums">${fmtMZN(c.sum)}</b></div>`).join("")}
    </div>` : "");
}

function abastUrl(name) {
  return SRC_OVERRIDE
    ? SRC_OVERRIDE.replace(/\/$/, "") + "/abast-" + encodeURIComponent(name) + ".csv"
    : "https://docs.google.com/spreadsheets/d/" + ABASTECIMENTOS_ID +
      "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(name) + "&t=" + Date.now();
}
async function fetchCsvText(url) {
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) return null;
    const text = await res.text();
    if (/<html/i.test(text.slice(0, 300))) return null;
    return text;
  } catch (e) { return null; }
}

/* nomes de folha a experimentar para um código VF+número, dos mais
   prováveis para os menos: VF15, vf15, Vf15, VF 15, VF-15, VF015 */
function codeVariants(code) {
  const c = code.trim();
  const compact = c.replace(/[\s\-_]/g, "");
  const out = [c, compact.toUpperCase(), compact.toLowerCase(), compact];
  const m = compact.match(/^([A-Za-z]+)0*(\d+)$/);
  if (m) {
    const pre = m[1].toUpperCase(), num = m[2];
    out.push(pre + " " + num, pre + "-" + num, pre + num.padStart(3, "0"),
             pre[0] + pre.slice(1).toLowerCase() + num, num);
  }
  return [...new Set(out.filter(Boolean))];
}

async function loadAbastecimentos(code) {
  const key = code.toLowerCase();
  if (abastCache[key] && !abastCache[key].loading) return;
  if (!ABASTECIMENTOS_ID && !SRC_OVERRIDE) {
    abastCache[key] = { err: "config" }; repaintViagens(); return;
  }
  abastCache[key] = { loading: true };

  /* O gviz devolve a PRIMEIRA folha quando o nome pedido não existe, em vez
     de dar erro. Pedimos primeiro um nome impossível: se vier resposta, é o
     conteúdo da primeira folha ("canário") — e qualquer variante que devolva
     exatamente isso só é aceite se o conteúdo mencionar o código da viagem. */
  const canary = await fetchCsvText(abastUrl("nl_folha_inexistente_9x7z"));

  const norm = s => s.toLowerCase().replace(/[\s\-_]/g, "");
  /* só aceitamos uma resposta igual à sonda se o conteúdo mencionar mesmo
     o código (ex.: "vf50" — e não "bt50" nem "vf500") */
  const codeRe = new RegExp(norm(code).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?!\\d)");
  for (const name of codeVariants(code)) {
    const text = await fetchCsvText(abastUrl(name));
    if (text == null) continue;
    if (canary != null && text === canary && !codeRe.test(norm(text))) {
      continue; // é a primeira folha devolvida por engano — não é esta viagem
    }
    abastCache[key] = { rows: parseCSV(text), sheetName: name };
    repaintViagens();
    return;
  }
  abastCache[key] = { err: "notfound" };
  repaintViagens();
}

function repaintViagens() { repaintView("viagens"); }
function repaintView(id) {
  const view = ALL_VIEWS.find(v => v.id === id);
  if (view && state.data[view.sheet]) paint(view);
}
/* repinta a vista visível da área ativa */

/* --- Render automático (folhas futuras): tabela genérica --- */
function renderAuto(rows) {
  const clean = rows.filter(r => !isRowEmpty(r));
  if (!clean.length) return emptyState("Folha sem dados.");
  // cabeçalho = linha mais "densa" nas primeiras 6 linhas
  let hi = 0, best = 0;
  clean.slice(0, 6).forEach((r, i) => {
    const filled = r.filter(c => c && c.trim()).length;
    if (filled > best) { best = filled; hi = i; }
  });
  return tableHTML(clean[hi], clean.slice(hi + 1));
}

function tableHTML(header, dataRows) {
  const cols = header.map((c, i) => ({ name: (c || "").trim(), i })).filter(c => c.name);
  const head = cols.map(c => `<th>${esc(c.name)}</th>`).join("");
  const body = dataRows.map(r => "<tr>" + cols.map(c => {
    const raw = (r[c.i] || "").trim();
    const numeric = isNumericCell(raw);
    return `<td class="${numeric ? "num" : ""}">${numeric ? fmtNumRaw(raw) : esc(raw) || "—"}</td>`;
  }).join("") + "</tr>").join("");
  return `<div class="card tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function emptyState(title, sub) {
  return `<div class="state">
    <div class="icon">🗂️</div>
    <h3>${esc(title)}</h3>
    ${sub ? `<p>${esc(sub)}</p>` : ""}
  </div>`;
}
function errorState(tabId) {
  return `<div class="state">
    <div class="icon">📡</div>
    <h3>Não foi possível carregar os dados</h3>
    <p>Verifica a ligação à internet. Se o problema continuar, o ficheiro no Google Drive
       tem de estar partilhado como <b>«Qualquer pessoa com o link — Leitor»</b>.</p>
    <button class="retry" onclick="refreshAll(true)">Tentar novamente</button>
  </div>`;
}

/* =====================================================================
   APP — navegação + carregamento
   ===================================================================== */
const RENDERERS = {
  resumo: renderResumo, movimentos: renderMovimentos, plano: renderPlano,
  socios: renderSocios, acertos: renderAcertos, viagens: renderViagens,
  motoristas: renderMotoristas, clientes: renderClientes, viaturas: renderViaturas,

};

const mainEl = document.getElementById("main");

const refreshBtn = document.getElementById("refreshBtn");

navEl.innerHTML = NAV.map(g =>
  `<button data-group="${g.id}" class="${g.id === state.activeGroup ? "on" : ""}" aria-label="${esc(g.label)}">

    <span>${esc(g.label)}</span>

mainEl.innerHTML = NAV.map(g => `
  <section class="panel ${g.id === state.activeGroup ? "active" : ""}" id="panel-${g.id}">

      <h3>Em breve</h3>
      <p>A área de ${esc(g.label)} será ativada quando os dados estiverem prontos no Excel.</p>
    </div>` : ""}
    ${g.views.length > 1 ? `<div class="subtabs" data-group="${g.id}">
      ${g.views.map(v => `<button data-view="${v.id}" class="${v.id === state.activeView[g.id] ? "on" : ""}">${esc(v.label)}</button>`).join("")}

function skeleton() {

function gotoView(groupId, viewId) {
  const group = NAV.find(g => g.id === groupId);
  if (!group) return;
  state.activeGroup = groupId;
  navEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.group === groupId));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + groupId));
  if (viewId && group.views.some(v => v.id === viewId && viewAvailable(v))) {
    state.activeView[groupId] = viewId;
  }
  refreshSubtabs(groupId);
  if (group.views.length === 1) {
    const el = document.getElementById("view-" + group.views[0].id);
    if (el) el.style.display = "";
  }
  window.scrollTo({ top: 0 });
}

navEl.addEventListener("click", e => {

mainEl.addEventListener("click", e => {
  const sub = e.target.closest(".subtabs button[data-view]");

    gotoView(sub.closest(".subtabs").dataset.group, sub.dataset.view);

    openEntity(ent.dataset.entity, ent.dataset.entityName); return;
  }
  const entBack = e.target.closest("[data-entity-back]");
  if (entBack) {
    entityNav[entBack.dataset.entityBack] = null;
    repaintActive(); window.scrollTo({ top: 0 }); return;
  }
  const vRow = e.target.closest("[data-viagem-cod]");
  if (vRow) {
    viagemNav.mode = "detalhe"; viagemNav.sel = vRow.dataset.viagemCod;
    gotoView("viagens", "viagens");
    repaintViagens(); window.scrollTo({ top: 0 });
    return;
  }
  if (e.target.closest("[data-viagens-back]")) {
    viagemNav.mode = "lista"; repaintViagens(); window.scrollTo({ top: 0 });
    return;
  }
  if (e.target.closest("[data-abast-back]")) {
    viagemNav.mode = "detalhe"; repaintViagens(); window.scrollTo({ top: 0 });
    return;
  }
  if (e.target.closest("[data-abast]")) {
    viagemNav.mode = "abast"; repaintViagens(); window.scrollTo({ top: 0 });
    return;
  }
