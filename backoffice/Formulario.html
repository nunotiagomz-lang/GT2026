<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
    --hairline:#e1e0d9; --border:rgba(11,11,11,0.10); --accent:#2a78d6; --good:#0ca30c; --bad:#d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --ink-muted:#898781;
      --hairline:#2c2c2a; --border:rgba(255,255,255,0.10); --accent:#3987e5; --good:#0ca30c; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--page); color: var(--ink); padding: 16px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; margin-bottom: 2px; }
  .sub { font-size: 12.5px; color: var(--ink-2); margin-bottom: 16px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--hairline); margin-bottom: 16px; }
  .tabs button { border: none; background: none; font-family: inherit; font-size: 14px; font-weight: 650;
    color: var(--ink-muted); padding: 10px 14px; cursor: pointer;
    border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
          padding: 14px 16px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin: 12px 0 5px; font-weight: 600; }
  label:first-child { margin-top: 0; }
  input, select, textarea {
    width: 100%; font-family: inherit; font-size: 16px; color: var(--ink);
    padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--page);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary {
    width: 100%; margin-top: 18px; font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 13px; border-radius: 999px; border: none; background: var(--accent); color: #fff; cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: default; }
  .msg { margin-top: 12px; font-size: 13.5px; font-weight: 600; padding: 11px 13px; border-radius: 10px; display: none; }
  .msg.ok  { display: block; background: rgba(12,163,12,.12); color: var(--good); }
  .msg.err { display: block; background: rgba(208,59,59,.12); color: var(--bad); }
  .hint { font-size: 11.5px; color: var(--ink-muted); margin-top: 6px; }
  .loading { text-align: center; color: var(--ink-2); padding: 30px 0; font-size: 14px; }
  .titulo { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
            color: var(--ink-muted); margin-bottom: 10px; }
  .socio-linha { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .socio-linha label { flex: 1; margin: 0; font-size: 14px; font-weight: 650; color: var(--ink); }
  .socio-linha input { flex: 0 0 46%; text-align: right; }
  .total { display: flex; justify-content: space-between; align-items: baseline;
           margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hairline);
           font-size: 15px; font-weight: 750; }
</style>
</head>
<body>

<h1>CNET Logistics, Lda</h1>
<div class="sub">Lançamento de dados — grava direto no Excel do Drive</div>

<div class="tabs">
  <button id="tabViagem" class="on" onclick="mostrar('viagem')">Viagem</button>
  <button id="tabAbast" onclick="mostrar('abast')">Abastecimento</button>
  <button id="tabMov" onclick="mostrar('mov')">Contas</button>
  <button id="tabInv" onclick="mostrar('inv')">Investimentos</button>
</div>

<div id="painelViagem">
  <div class="card" id="camposViagem"><div class="loading">A carregar as colunas da folha…</div></div>
  <button class="primary" id="btnViagem" onclick="gravarViagem()" disabled>Guardar viagem</button>
  <div class="msg" id="msgViagem"></div>
</div>

<div id="painelAbast" style="display:none">
  <div class="card">
    <label for="abCodigo">Viagem</label>
    <select id="abCodigo"><option>A carregar…</option></select>
    <label for="abData">Data</label>
    <input id="abData" type="date">
    <label for="abLocal">Local</label>
    <input id="abLocal" type="text" placeholder="Ex.: Chimoio">
    <label for="abLitros">Litros</label>
    <input id="abLitros" type="number" inputmode="decimal" step="any" placeholder="0">
    <label for="abPreco">Preço por litro (MZN)</label>
    <input id="abPreco" type="number" inputmode="decimal" step="any" placeholder="0">
    <label for="abKm">Km no conta-quilómetros</label>
    <input id="abKm" type="number" inputmode="numeric" step="any" placeholder="0">
    <div class="hint">O valor total é calculado automaticamente (litros × preço).</div>
  </div>
  <button class="primary" onclick="gravarAbastecimento()">Guardar abastecimento</button>
  <div class="msg" id="msgAbast"></div>
</div>

<div id="painelMov" style="display:none">
  <div class="card">
    <label for="mvData">Data</label>
    <input id="mvData" type="date">
    <label for="mvTipo">Tipo</label>
    <select id="mvTipo" onchange="atualizarDica()"></select>
    <div class="hint" id="mvTipoHint"></div>
    <label for="mvCategoria">Categoria</label>
    <input id="mvCategoria" type="text" list="lCategorias" placeholder="Ex.: Combustível">
    <datalist id="lCategorias"></datalist>
    <label for="mvDescricao">Descrição</label>
    <input id="mvDescricao" type="text" placeholder="Ex.: Portagem Maputo - Tete">
    <label for="mvValor">Valor (MZN)</label>
    <input id="mvValor" type="number" inputmode="decimal" step="any" placeholder="0">
    <label for="mvQuem">Pago Por</label>
    <input id="mvQuem" type="text" list="lPagadores" oninput="atualizarDica()"
           placeholder="Um sócio, a empresa, ou um fornecedor / cliente">
    <datalist id="lPagadores"></datalist>
    <div class="hint" id="mvQuemHint"></div>
    <label for="mvMeio">Meio</label>
    <select id="mvMeio" onchange="this.dataset.tocado='1'">
      <option value="">— automático —</option>
      <option value="Caixa">Caixa</option>
      <option value="Banco">Banco</option>
      <option value="Sócio">Sócio</option>
    </select>
    <label for="mvViagem">Viagem (opcional)</label>
    <select id="mvViagem"><option value="">— sem viagem —</option></select>
    <label for="mvNota">Nota (opcional)</label>
    <input id="mvNota" type="text" placeholder="Ex.: nº do documento">
  </div>
  <button class="primary" onclick="gravarMovimento()">Guardar lançamento</button>
  <div class="msg" id="msgMov"></div>
</div>

<div id="painelInv" style="display:none">
  <div class="card">
    <label for="ivData">Data</label>
    <input id="ivData" type="date">
    <label for="ivTipo">Tipo</label>
    <select id="ivTipo" onchange="atualizarDicaInv()"></select>
    <div class="hint" id="ivTipoHint"></div>
    <label for="ivCategoria">Categoria</label>
    <input id="ivCategoria" type="text" list="lCategorias" placeholder="Ex.: Camião">
    <label for="ivDescricao">Descrição</label>
    <input id="ivDescricao" type="text" placeholder="Ex.: Sinal / entrada do camião">
    <label for="ivViagem">Viagem (opcional)</label>
    <select id="ivViagem"><option value="">— sem viagem —</option></select>
    <label for="ivNota">Nota (opcional)</label>
    <input id="ivNota" type="text" placeholder="Ex.: nº do documento">
  </div>

  <div class="card">
    <div class="titulo">Valor por sócio (MZN)</div>
    <div id="ivSocios"><div class="loading">A carregar os sócios…</div></div>
    <div class="total" id="ivTotal">Total: 0 MZN</div>
  </div>

  <button class="primary" onclick="gravarInvestimento()">Guardar investimento</button>
  <div class="msg" id="msgInv"></div>
</div>

<script>
var CONFIG = null;

function mostrar(qual) {
  ['viagem', 'abast', 'mov', 'inv'].forEach(function (q) {
    var painel = { viagem: 'painelViagem', abast: 'painelAbast', mov: 'painelMov', inv: 'painelInv' }[q];
    var aba = { viagem: 'tabViagem', abast: 'tabAbast', mov: 'tabMov', inv: 'tabInv' }[q];
    document.getElementById(painel).style.display = q === qual ? '' : 'none';
    document.getElementById(aba).classList.toggle('on', q === qual);
  });
}

function idDoCampo(nome) { return 'c_' + nome.replace(/[^a-zA-Z0-9]/g, '_'); }

/* Constrói o formulário a partir das colunas reais da folha Viagens:
   acrescentas uma coluna no Excel e ela aparece aqui sozinha. */
function construirViagem(cfg) {
  CONFIG = cfg;
  var listas = cfg.listas || {};
  var html = cfg.colunas.map(function (nome) {
    var id = idDoCampo(nome);
    var n = nome.toLowerCase();
    var lista = /viatura|matr/.test(n) ? listas.viatura
              : /motorista|condutor/.test(n) ? listas.motorista
              : /cliente/.test(n) ? listas.cliente : null;

    if (/^vf$|c.digo/.test(n)) {
      return '<label for="' + id + '">' + nome + '</label>' +
        '<input id="' + id + '" type="text" value="' + cfg.proximoVF + '">' +
        '<div class="hint">Sugerido automaticamente: a viagem fica VF' + cfg.proximoVF + '.</div>';
    }
    if (lista && lista.length) {
      return '<label for="' + id + '">' + nome + '</label>' +
        '<input id="' + id + '" type="text" list="l_' + id + '" placeholder="Escolhe ou escreve">' +
        '<datalist id="l_' + id + '">' +
          lista.map(function (v) { return '<option value="' + v.replace(/"/g, '&quot;') + '">'; }).join('') +
        '</datalist>';
    }
    if (/data|partida|chegada/.test(n)) {
      return '<label for="' + id + '">' + nome + '</label><input id="' + id + '" type="date">';
    }
    if (/km|litros|valor|receita|despesa|saldo|pre.o|quantidade|req/.test(n)) {
      return '<label for="' + id + '">' + nome + '</label>' +
             '<input id="' + id + '" type="number" inputmode="decimal" step="any">';
    }
    return '<label for="' + id + '">' + nome + '</label><input id="' + id + '" type="text">';
  }).join('');

  document.getElementById('camposViagem').innerHTML = html;
  document.getElementById('btnViagem').disabled = false;
}

/* datas para o Sheets em dd/mm/aaaa (é assim que a app de consulta as lê) */
function formatarData(valor) {
  if (!valor) return '';
  var p = valor.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : valor;
}

function mensagem(id, texto, erro) {
  var el = document.getElementById(id);
  el.textContent = texto;
  el.className = 'msg ' + (erro ? 'err' : 'ok');
}

function gravarViagem() {
  if (!CONFIG) return;
  var btn = document.getElementById('btnViagem');
  btn.disabled = true; btn.textContent = 'A guardar…';

  var valores = {};
  CONFIG.colunas.forEach(function (nome) {
    var el = document.getElementById(idDoCampo(nome));
    if (!el) return;
    valores[nome] = el.type === 'date' ? formatarData(el.value) : el.value;
  });

  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false; btn.textContent = 'Guardar viagem';
      mensagem('msgViagem', '✓ Viagem ' + res.codigo + ' guardada. A folha de abastecimentos foi criada.', false);
      recarregar();
    })
    .withFailureHandler(function (err) {
      btn.disabled = false; btn.textContent = 'Guardar viagem';
      mensagem('msgViagem', 'Não foi possível guardar: ' + err.message, true);
    })
    .guardarViagem(valores);
}

function gravarAbastecimento() {
  var codigo = document.getElementById('abCodigo').value;
  if (!codigo) { mensagem('msgAbast', 'Escolhe a viagem.', true); return; }
  var dados = {
    data: formatarData(document.getElementById('abData').value),
    local: document.getElementById('abLocal').value,
    litros: document.getElementById('abLitros').value,
    preco: document.getElementById('abPreco').value,
    km: document.getElementById('abKm').value
  };
  if (!dados.litros) { mensagem('msgAbast', 'Indica os litros.', true); return; }

  google.script.run
    .withSuccessHandler(function (res) {
      mensagem('msgAbast', '✓ Abastecimento guardado na folha ' + res.folha + '.', false);
      ['abLocal', 'abLitros', 'abPreco', 'abKm'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
    })
    .withFailureHandler(function (err) {
      mensagem('msgAbast', 'Não foi possível guardar: ' + err.message, true);
    })
    .guardarAbastecimento(codigo, dados);
}

var CFG_MOV = null;

function construirMovimento(cfg) {
  CFG_MOV = cfg;
  var opcoes = function (lista) {
    return lista.map(function (v) {
      return '<option value="' + v.replace(/"/g, '&quot;') + '">' + v + '</option>';
    }).join('');
  };
  document.getElementById('mvTipo').innerHTML = opcoes(cfg.tipos);
  var sugestoes = function (lista) {
    return lista.map(function (v) { return '<option value="' + v.replace(/"/g, '&quot;') + '">'; }).join('');
  };
  document.getElementById('lCategorias').innerHTML = sugestoes(cfg.categorias);
  /* sócios primeiro (são os que também vão para o livro dos investidores),
     depois a empresa e quem já apareceu antes */
  document.getElementById('lPagadores').innerHTML =
    sugestoes(cfg.socios.concat([cfg.pagadorEmpresa]).concat(cfg.pagadores || []));
  atualizarDica();
  construirInvestimento(cfg);
}

/* ---- formulário Investimentos: uma caixa de valor por sócio ---- */
function idDoSocio(nome) { return 'iv_' + nome.replace(/[^a-zA-Z0-9]/g, '_'); }

function construirInvestimento(cfg) {
  document.getElementById('ivTipo').innerHTML = (cfg.tiposInvestidores || cfg.tipos)
    .map(function (v) { return '<option value="' + v + '">' + v + '</option>'; }).join('');

  var lista = cfg.socioCols && cfg.socioCols.length ? cfg.socioCols : cfg.socios;
  if (!lista.length) {
    document.getElementById('ivSocios').innerHTML =
      '<div class="loading">Sem sócios — verifica a folha «Sócios - Contas Correntes».</div>';
    return;
  }
  var semColuna = cfg.socios.filter(function (s) {
    return !(cfg.socioCols || []).some(function (c) { return c.toLowerCase() === s.toLowerCase(); });
  });
  document.getElementById('ivSocios').innerHTML = lista.map(function (nome) {
    var id = idDoSocio(nome);
    return '<div class="socio-linha"><label for="' + id + '">' + nome + '</label>' +
      '<input id="' + id + '" type="number" inputmode="decimal" step="any" placeholder="0" ' +
      'oninput="somarInvestimento()"></div>';
  }).join('') + (semColuna.length
    ? '<div class="hint">Sem coluna no livro dos investidores: ' + semColuna.join(', ') +
      '. Acrescenta-a à folha para poderem ser lançados.</div>'
    : '');
  somarInvestimento();
  atualizarDicaInv();
}

function somarInvestimento() {
  if (!CFG_MOV) return 0;
  var lista = CFG_MOV.socioCols && CFG_MOV.socioCols.length ? CFG_MOV.socioCols : CFG_MOV.socios;
  var total = 0;
  lista.forEach(function (nome) {
    var el = document.getElementById(idDoSocio(nome));
    if (el) total += Number(el.value) || 0;
  });
  document.getElementById('ivTotal').innerHTML =
    '<span>Total</span><span>' + total.toLocaleString('pt-PT') + ' MZN</span>';
  return total;
}

function atualizarDicaInv() {
  var tipo = document.getElementById('ivTipo').value;
  var saiParaSocio = /devolu|dividend/i.test(tipo);
  document.getElementById('ivTipoHint').textContent = saiParaSocio
    ? 'Dinheiro que sai para os sócios — desconta ao que cada um tem investido.'
    : 'Dinheiro que os sócios põem na empresa.';
}

function gravarInvestimento() {
  if (!CFG_MOV) return;
  var lista = CFG_MOV.socioCols && CFG_MOV.socioCols.length ? CFG_MOV.socioCols : CFG_MOV.socios;
  var valores = {};
  lista.forEach(function (nome) {
    var el = document.getElementById(idDoSocio(nome));
    if (el && Number(el.value)) valores[nome] = Number(el.value);
  });
  if (!somarInvestimento()) { mensagem('msgInv', 'Preenche o valor de pelo menos um sócio.', true); return; }

  google.script.run
    .withSuccessHandler(function (res) {
      mensagem('msgInv', '✓ ' + res.total.toLocaleString('pt-PT') +
        ' MZN guardados em: ' + res.folhas.join(' e ') + '.', false);
      ['ivDescricao', 'ivNota'].forEach(function (id) { document.getElementById(id).value = ''; });
      lista.forEach(function (nome) {
        var el = document.getElementById(idDoSocio(nome));
        if (el) el.value = '';
      });
      somarInvestimento();
      recarregar();
    })
    .withFailureHandler(function (err) {
      mensagem('msgInv', 'Não foi possível guardar: ' + err.message, true);
    })
    .guardarInvestimento({
      data: formatarData(document.getElementById('ivData').value),
      tipo: document.getElementById('ivTipo').value,
      categoria: document.getElementById('ivCategoria').value,
      descricao: document.getElementById('ivDescricao').value,
      viagem: document.getElementById('ivViagem').value,
      nota: document.getElementById('ivNota').value,
      valores: valores
    });
}

/* explica, antes de gravar, o que vai acontecer e onde */
function atualizarDica() {
  if (!CFG_MOV) return;
  var tipo = document.getElementById('mvTipo').value;
  document.getElementById('mvTipoHint').textContent = tipo === 'Investimento'
    ? 'Investimento dura anos (camião, licenças) — não é despesa do mês.'
    : tipo === 'Despesa'
      ? 'Despesa consome-se agora (combustível, portagens, diárias).'
      : tipo === 'Suprimento'
        ? 'Entrada de dinheiro de um sócio na empresa.'
        : 'Entrada de dinheiro de um cliente ou terceiro.';

  var quem = document.getElementById('mvQuem').value.trim();
  var socio = CFG_MOV.socios.filter(function (s) {
    return s.toLowerCase() === quem.toLowerCase();
  })[0];
  var semColuna = socio && CFG_MOV.socioCols.length &&
    !CFG_MOV.socioCols.some(function (c) { return c.toLowerCase() === quem.toLowerCase(); });
  document.getElementById('mvQuemHint').textContent = !quem
    ? 'Escreve um sócio (entra também na conta corrente dele) ou um fornecedor / cliente.'
    : socio
      ? (semColuna
          ? 'Atenção: «' + socio + '» não tem coluna no livro dos investidores — acrescenta-a antes de gravar.'
          : 'Vai para os dois livros: Movimentos Geral e Movimentos dos Investidores (conta corrente de ' + socio + ').')
      : 'Vai só para o livro Movimentos Geral.';

  /* meio automático: se foi um sócio a pagar, o dinheiro saiu do bolso dele */
  var meio = document.getElementById('mvMeio');
  if (!meio.dataset.tocado) meio.value = socio ? 'Sócio' : '';
}

function gravarMovimento() {
  var dados = {
    data: formatarData(document.getElementById('mvData').value),
    tipo: document.getElementById('mvTipo').value,
    categoria: document.getElementById('mvCategoria').value,
    descricao: document.getElementById('mvDescricao').value,
    valor: document.getElementById('mvValor').value,
    quem: document.getElementById('mvQuem').value,
    meio: document.getElementById('mvMeio').value,
    viagem: document.getElementById('mvViagem').value,
    nota: document.getElementById('mvNota').value
  };
  if (!dados.valor) { mensagem('msgMov', 'Indica o valor.', true); return; }

  google.script.run
    .withSuccessHandler(function (res) {
      mensagem('msgMov', '✓ Lançamento guardado em: ' + res.folhas.join(' e ') + '.', false);
      ['mvDescricao', 'mvValor', 'mvNota'].forEach(function (id) {
        document.getElementById(id).value = '';
      });
      recarregar();
    })
    .withFailureHandler(function (err) {
      mensagem('msgMov', 'Não foi possível guardar: ' + err.message, true);
    })
    .guardarMovimento(dados);
}

function recarregar() {
  google.script.run
    .withSuccessHandler(construirMovimento)
    .withFailureHandler(function (err) {
      document.getElementById('mvTipoHint').textContent = 'Erro ao ler o livro de movimentos: ' + err.message;
    })
    .obterConfiguracaoMovimentos();

  google.script.run
    .withSuccessHandler(construirViagem)
    .withFailureHandler(function (err) {
      document.getElementById('camposViagem').innerHTML =
        '<div class="loading">Erro ao ler a folha: ' + err.message + '</div>';
    })
    .obterConfiguracao();

  google.script.run
    .withSuccessHandler(function (lista) {
      var opcoes = lista.map(function (c) {
        return '<option value="' + c + '">VF' + String(c).replace(/\D/g, '') + '</option>';
      }).join('');
      document.getElementById('abCodigo').innerHTML = opcoes || '<option value="">(sem viagens)</option>';
      document.getElementById('mvViagem').innerHTML = '<option value="">— sem viagem —</option>' + opcoes;
      document.getElementById('ivViagem').innerHTML = '<option value="">— sem viagem —</option>' + opcoes;
    })
    .listarViagens();
}

/* data de hoje por defeito */
var hoje = new Date().toISOString().slice(0, 10);
document.getElementById('abData').value = hoje;
document.getElementById('mvData').value = hoje;
document.getElementById('ivData').value = hoje;
recarregar();
</script>
</body>
</html>
